name: OVH Actual Page Identity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ops/ovh-actual-page-identity.sh'
      - '.github/workflows/ovh-actual-page-identity.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ops/ovh-actual-page-identity.sh
