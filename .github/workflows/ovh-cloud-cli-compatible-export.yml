name: OVH Supabase CLI Compatible Cloud Export
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ops/ovh-cloud-cli-compatible-export.sh'
      - '.github/workflows/ovh-cloud-cli-compatible-export.yml'
permissions:
  contents: read
concurrency:
  group: ovh-supabase-cloud-cli-export
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate export shell syntax
        run: bash -n scripts/ops/ovh-cloud-cli-compatible-export.sh
      - name: Configure pinned SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OVH_HOST" && test -n "$OVH_SSH_KEY" && test -n "$OVH_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Create Supabase-compatible migration SQL artifacts
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          CLOUD_DATABASE_URL: ${{ secrets.CLOUD_DATABASE_URL }}
        run: bash scripts/ops/ovh-cloud-cli-compatible-export.sh
