name: Verify Timetable Edge Cold Boot Retry (No OVH)
on:
  push:
    branches: [fix/timetable-edge-startup-retry-20261102]
    paths:
      - 'scripts/ops/ovh-deploy-timetable-ai-cloudflare-v1.py'
      - 'qa/ovh-cloudflare-edge-coldboot.test.py'
      - '.github/workflows/verify-timetable-edge-startup.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: oven-sh/setup-bun@v2
      - name: Validate retry semantics, Docker preservation and existing app
        run: |
          python3 -m py_compile scripts/ops/ovh-deploy-timetable-ai-cloudflare-v1.py
          python3 qa/ovh-cloudflare-edge-coldboot.test.py
          python3 qa/ovh-cloudflare-compose-preservation.test.py
          bun install --frozen-lockfile
          node --check scripts/timetable-ai-cloudflare-v1.js
          node qa/timetable-pdf-position-and-footnotes.test.mjs
          node qa/timetable-guided-import-v2.test.mjs
          node qa/static-check.mjs
          npm run qa:unit
