name: OVH Isolated Schema Restore Test
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: ovh-disposable-schema-restore
  cancel-in-progress: false
jobs:
  isolated-schema:
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OVH_HOST" && test -n "$OVH_SSH_KEY" && test -n "$OVH_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Restore schema ONLY into verified isolated test DB
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@$OVH_HOST" 'bash -s' < scripts/ops/ovh-isolated-schema-restore.sh

      - name: Report failed test to GitHub Issues
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The issue contains only a link to GitHub's own job log, not SQL or data.
          printf 'Isolated schema test failed. Read the existing sanitized SQL diagnostics in the run logs:\n\n%s\n\nThis did not target the production database.\n' "$RUN_URL" > /tmp/neis-restore-issue.txt
          gh issue create --repo "$GH_REPO" --title "OVH isolated schema test failed (run #${{ github.run_number }})" --body-file /tmp/neis-restore-issue.txt
