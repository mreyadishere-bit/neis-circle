name: OVH Integration Secret Presence Check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ovh-integration-secret-presence.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 5
    steps:
      - name: Inspect presence only, never print values
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_WORKER_SECRET: ${{ secrets.EMAIL_WORKER_SECRET }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          NOTIFICATION_FROM_EMAIL: ${{ secrets.NOTIFICATION_FROM_EMAIL || vars.NOTIFICATION_FROM_EMAIL }}
          NOTIFICATION_FROM_NAME: ${{ secrets.NOTIFICATION_FROM_NAME || vars.NOTIFICATION_FROM_NAME }}
          SITE_URL: ${{ secrets.SITE_URL || vars.SITE_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,sys
          names=('BREVO_API_KEY','EMAIL_WORKER_SECRET','FIREBASE_SERVICE_ACCOUNT_JSON','LIVEKIT_API_KEY','LIVEKIT_API_SECRET','LIVEKIT_URL','NOTIFICATION_FROM_EMAIL','NOTIFICATION_FROM_NAME','SITE_URL')
          missing=[n for n in names if not os.environ.get(n,'').strip()]
          print('GITHUB_EDGE_INTEGRATION_NAMES_CONFIGURED='+str(len(names)-len(missing))+'/'+str(len(names)))
          print('GITHUB_EDGE_INTEGRATION_NAMES_MISSING='+(','.join(missing) if missing else 'NONE'))
          print('SECRET_VALUES_PRINTED=NO')
          sys.exit(1 if missing else 0)
          PY
