name: Compare Cloudflare Vision on Synthetic Timetable (No OVH)
on:
  push:
    branches: [diagnostics/cloudflare-workers-ai-readiness-20261102]
    paths: [.github/workflows/cloudflare-timetable-vision-benchmark.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 8
    steps:
      - name: Install synthetic image generator only
        run: python3 -m pip install --quiet pillow
      - name: Compare models on a synthetic visual timetable without exposing prompts or secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          from PIL import Image,ImageDraw,ImageFont
          import base64,io,json,os,re,urllib.error,urllib.request
          account=os.getenv('CLOUDFLARE_ACCOUNT_ID','').strip()
          token=os.getenv('CLOUDFLARE_API_TOKEN','').strip()
          if not account or not token:raise SystemExit('CLOUDFLARE_SETTINGS_MISSING')
          img=Image.new('RGB',(1060,580),'white')
          draw=ImageDraw.Draw(img)
          font_file='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          f=ImageFont.truetype(font_file,33)
          bold=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',34)
          xcoords=[0,360,610,1060]
          for x in xcoords:draw.line((x,0,x,580),fill='black',width=3)
          for y in range(0,581,96):draw.line((0,y,1060,y),fill='black',width=3)
          rows=[
            ('Day','Time','Subject'),
            ('Monday','08:00','English'),
            ('Monday','09:00','Maths L2'),
            ('Tuesday','10:00','Physics L2'),
            ('Wednesday','11:00','ICT'),
            ('Thursday','12:00','Chemistry'),
          ]
          for i,row in enumerate(rows):
            y=i*96+26
            for j,val in enumerate(row):draw.text((xcoords[j]+15,y),val,font=bold if i==0 else f,fill='black')
          b=io.BytesIO();img.save(b,format='PNG')
          url_img='data:image/png;base64,'+base64.b64encode(b.getvalue()).decode()
          p='Read the grid visually. Output a JSON list of all classes for ONLY English, Maths L2, Physics L2, ICT. Keys: day, time, subject. Never include Chemistry. Do not invent lessons.'
          message={'role':'user','content':[{'type':'text','text':p},{'type':'image_url','image_url':{'url':url_img}}]}
          headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'}
          def run_model(name):
            url='https://api.cloudflare.com/client/v4/accounts/'+account+'/ai/run/'+name
            body={'messages':[message],'max_tokens':400}
            req=urllib.request.Request(url,headers=headers,data=json.dumps(body).encode('utf-8'))
            try:
              with urllib.request.urlopen(req,timeout=65) as resp:result=json.load(resp)
            except urllib.error.HTTPError as e:
              print('MODEL_'+name.split('/')[-1]+'_HTTP='+str(e.code))
              return
            except Exception as e:
              print('MODEL_'+name.split('/')[-1]+'_ERROR_TYPE='+type(e).__name__)
              return
            d=result.get('result') or {}
            if isinstance(d,dict):
              output=d.get('response','')
              if not output:
                choices=d.get('choices',[])
                output=(choices[0].get('message') or {}).get('content','') if choices else ''
            else:output=''
            if not isinstance(output,str):output=''
            label=name.split('/')[-1].replace('-','_').upper()
            words=output.lower()
            expected=[('monday','08:00','english'),('monday','09:00','maths l2'),('tuesday','10:00','physics l2'),('wednesday','11:00','ict')]
            checks=[all(t in words for t in row) for row in expected]
            print('MODEL_'+label+'_RETURNED_TEXT='+str(bool(output.strip())).upper())
            print('MODEL_'+label+'_SUBJECT_DAY_TIME_TERMS='+str(sum(checks))+'/4')
            print('MODEL_'+label+'_EXCLUDED_CHEMISTRY='+str('chemistry' not in words).upper())
            print('MODEL_'+label+'_RAW_RESPONSE_HIDDEN=YES')
          for model in ('@cf/meta/llama-4-scout-17b-16e-instruct','@cf/qwen/qwen3.8-27b'):
            run_model(model)
          PY
