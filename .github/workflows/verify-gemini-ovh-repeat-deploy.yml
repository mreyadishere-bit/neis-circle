name: Verify repeat Gemini OVH deploy is rollback-safe (No OVH)
on:
  push:
    branches: [fix/gemini-repeat-ovh-deploy-20261102]
    paths:
      - scripts/ops/ovh-deploy-timetable-ai-gemini-v1.py
      - qa/ovh-gemini-repeat-deploy.test.py
      - .github/workflows/verify-gemini-ovh-repeat-deploy.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/ops/ovh-deploy-timetable-ai-gemini-v1.py
      - qa/ovh-gemini-repeat-deploy.test.py
      - .github/workflows/verify-gemini-ovh-repeat-deploy.yml
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile deployment script and tests
        run: |
          python3 -m py_compile scripts/ops/ovh-deploy-timetable-ai-gemini-v1.py
          python3 -m py_compile qa/ovh-gemini-repeat-deploy.test.py
      - name: Exercise real Docker Compose repeat deployment with synthetic credentials
        run: |
          python3 qa/ovh-gemini-repeat-deploy.test.py
          python3 qa/ovh-gemini-compose-preservation.test.py
