
name: OVH Caddy Readonly Diagnostics
on:
  push:
    branches: [main]
    paths:
      - 'scripts/ops/ovh-caddy-live-diagnostic.py'
      - '.github/workflows/ovh-caddy-live-diagnostic.yml'
permissions:
  contents: read
concurrency:
  group: ovh-caddy-readonly-diagnostics
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned OVH SSH
        env:
          HOST: ${{ secrets.OVH_HOST }}
          KEY: ${{ secrets.OVH_SSH_KEY }}
          KNOWN: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$KEY" && test -n "$KNOWN"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Run read-only diagnostics on OVH
        env:
          HOST: ${{ secrets.OVH_HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@$HOST" 'python3 -' < scripts/ops/ovh-caddy-live-diagnostic.py
