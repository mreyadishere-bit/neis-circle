name: OVH Windows PWA push delivery read-only audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ovh-windows-push-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OVH_HOST" && test -n "$OVH_SSH_KEY" && test -n "$OVH_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Inspect push subscriptions and message dispatch without modifying data
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          set -euo pipefail
          host="ubuntu@$OVH_HOST"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$host" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          cd /home/ubuntu/neis-supabase
          docker=(sudo -n /usr/bin/docker)
          "${docker[@]}" exec supabase-db psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -Atqc "
            SELECT 'ACTIVE_PUSH_SUBSCRIPTIONS='||count(*) FROM public.web_push_subscriptions WHERE enabled=true
            UNION ALL SELECT 'PUSH_OUTBOX_PENDING='||count(*) FROM public.web_push_outbox WHERE status='pending'
            UNION ALL SELECT 'PUSH_OUTBOX_FAILED='||count(*) FROM public.web_push_outbox WHERE status='failed'
            UNION ALL SELECT 'PUSH_OUTBOX_SENT='||count(*) FROM public.web_push_outbox WHERE status='sent'
            UNION ALL SELECT 'PUSH_OUTBOX_LAST_HOUR='||count(*) FROM public.web_push_outbox WHERE created_at > now() - interval '1 hour'
            UNION ALL SELECT 'PUSH_SENT_LAST_HOUR='||count(*) FROM public.web_push_outbox WHERE status='sent' AND created_at > now() - interval '1 hour'
            UNION ALL SELECT 'PUSH_FAILED_LAST_HOUR='||count(*) FROM public.web_push_outbox WHERE status='failed' AND created_at > now() - interval '1 hour'
            UNION ALL SELECT 'PUSH_ACTIVE_RECENT_HOUR='||count(*) FROM public.web_push_subscriptions WHERE enabled=true AND last_seen_at > now() - interval '1 hour'
            UNION ALL SELECT 'PUSH_SENT_24H='||count(*) FROM public.web_push_outbox WHERE status='sent' AND created_at>now()-interval '24 hours'
            UNION ALL SELECT 'PUSH_DELIVERY_SLOW_10S_24H='||count(*) FROM public.web_push_outbox WHERE sent_at-created_at>interval '10 seconds' AND created_at>now()-interval '24 hours'
            UNION ALL SELECT 'PUSH_DELIVERY_SLOW_60S_24H='||count(*) FROM public.web_push_outbox WHERE sent_at-created_at>interval '60 seconds' AND created_at>now()-interval '24 hours'
            UNION ALL SELECT 'PUSH_DELIVERY_AVG_SECONDS_24H='||coalesce(round(avg(extract(epoch from sent_at-created_at))::numeric,2),0) FROM public.web_push_outbox WHERE sent_at IS NOT NULL AND created_at>now()-interval '24 hours'
            UNION ALL SELECT 'PUSH_QUEUE_STALE_30S='||count(*) FROM public.web_push_outbox WHERE status in ('pending','failed','sending') AND created_at<now()-interval '30 seconds'
            UNION ALL SELECT 'PUSH_QUEUE_SENDING='||count(*) FROM public.web_push_outbox WHERE status='sending'
            UNION ALL SELECT 'PUSH_RECENT_ERROR_CLASSES='||coalesce(string_agg(category||':'||number,','),'none') FROM (SELECT coalesce(nullif(regexp_replace(last_error,'[^a-zA-Z0-9_]+','','g'),''),'ok') category,count(*) number FROM public.web_push_outbox WHERE created_at>now()-interval '24 hours' GROUP BY 1 ORDER BY 2 DESC LIMIT 6) z
            UNION ALL SELECT 'PUSH_24H_DM_NOTIFICATION_COUNT='||count(*) FROM public.notifications WHERE type='message' AND created_at>now()-interval '24 hours'
            UNION ALL SELECT 'PUSH_24H_DM_OUTBOX_COUNT='||count(*) FROM public.web_push_outbox WHERE notification_type='message' AND created_at>now()-interval '24 hours'
            UNION ALL SELECT 'DM_MESSAGES_24H='||count(*) FROM public.messages WHERE created_at>now()-interval '24 hours'
            UNION ALL SELECT 'DM_MESSAGES_7D='||count(*) FROM public.messages WHERE created_at>now()-interval '7 days'
            UNION ALL SELECT 'DM_NOTIFICATIONS_7D='||count(*) FROM public.notifications WHERE entity_type='message' AND created_at>now()-interval '7 days'
            UNION ALL SELECT 'DM_PUSH_OUTBOX_7D='||count(*) FROM public.web_push_outbox WHERE notification_type in ('message','reply') AND created_at>now()-interval '7 days'
            UNION ALL SELECT 'DM_TRIGGER_STATE='||coalesce(string_agg(tgname||':'||tgenabled,','),'none') FROM pg_trigger WHERE tgrelid='public.messages'::regclass AND not tgisinternal AND (tgname ilike '%notif%' or tgfoid='public.notify_message()'::regprocedure)
            UNION ALL SELECT 'WEBPUSH_NOTIFICATION_TRIGGER_STATE='||coalesce(string_agg(tgname||':'||tgenabled,','),'none') FROM pg_trigger WHERE tgrelid='public.notifications'::regclass AND not tgisinternal AND tgname ilike '%push%'
            UNION ALL SELECT 'WEBPUSH_DISPATCH_TRIGGER_STATE='||coalesce(string_agg(tgname||':'||tgenabled,','),'none') FROM pg_trigger WHERE tgrelid='public.web_push_outbox'::regclass AND not tgisinternal
            UNION ALL SELECT 'PUSH_DELIVERY_ZERO_DEVICE_24H='||count(*) FROM public.web_push_outbox WHERE last_error='no_active_subscriptions' AND created_at>now()-interval '24 hours'
            UNION ALL SELECT 'PUSH_LAST_7D_DELIVERY_ERROR='||coalesce(string_agg(category||':'||number,','),'none') FROM (SELECT coalesce(last_error,'ok') category,count(*) number FROM public.web_push_outbox WHERE created_at>now()-interval '7 days' GROUP BY 1 ORDER BY 2 DESC LIMIT 8) e
            UNION ALL SELECT 'PUSH_PG_CRON_INSTALLED='||exists(select 1 from pg_extension where extname='pg_cron')::text
            UNION ALL SELECT 'PUSH_DISPATCH_FUNCTION_OVH='||(CASE WHEN to_regprocedure('private.dispatch_web_push_job()') IS NOT NULL THEN pg_get_functiondef('private.dispatch_web_push_job()'::regprocedure) LIKE '%supabase.neiscircle.site%' ELSE false END)::text;
          "
          REMOTE
