name: OVH Mobile Tablet Install Banner and Search Favicon 20261119
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ovh-mobile-install-only-20261119.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ovh-mobile-install-only
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate install banner logic and generate original NC circular favicon
        run: |
          set -euo pipefail
          node --check scripts/pwa-install-v117.js
          python3 -m py_compile scripts/ops/ovh-deploy-mobile-install-only-20261119.py scripts/ops/build-original-logo-rounded-favicon.py
          python3 -m venv /tmp/neis-iconvenv
          /tmp/neis-iconvenv/bin/pip install -q pillow
          /tmp/neis-iconvenv/bin/python scripts/ops/build-original-logo-rounded-favicon.py --source assets/email-logo.png --output-dir /tmp/neis-icon-output
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          js=Path('scripts/pwa-install-v117.js').read_text()
          css=Path('styles/pwa-v117.css').read_text()
          assert 'isMobileOrTabletBrowser()' in js
          assert "card.classList.toggle('hidden',hideInstallCard)" in js
          assert 'html.neis-desktop-browser .pwa-install-card{display:none!important}' in css
          # Original tab icon is untouched; the Google-compatible root ICO remains circular.
          for p in ('index.html','about.html'):
              s=Path(p).read_text()
              assert '<link rel="icon" type="image/png" href="/assets/email-logo.png?v=original-tab-20261119">' in s
          print('MOBILE_TABLET_INSTALL_LOGIC_STATIC=PASS')
          PY
      - name: Setup OVH secure SSH
        env:
          HOST: ${{ secrets.OVH_HOST }}
          KEY: ${{ secrets.OVH_SSH_KEY }}
          KNOWN: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$KEY" && test -n "$KNOWN"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Stage scoped browser install and favicon files
        env:
          HOST: ${{ secrets.OVH_HOST }}
        run: |
          set -euo pipefail
          dst=/home/ubuntu/neis-backups/mobile-install-google-icon-20261119
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@$HOST" "install -d -m 700 $dst"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/pwa-install-v117.js "ubuntu@$HOST:$dst/pwa-install-v117.js"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes styles/pwa-v117.css "ubuntu@$HOST:$dst/pwa-v117.css"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes /tmp/neis-icon-output/* "ubuntu@$HOST:$dst/"
      - name: Atomic OVH release with rollback
        env:
          HOST: ${{ secrets.OVH_HOST }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@$HOST" "GITHUB_SHA='$GITHUB_SHA' python3 -" < scripts/ops/ovh-deploy-mobile-install-only-20261119.py
      - name: Verify live frontend, circle favicon and unchanged login
        run: |
          python3 - <<'PY'
          import urllib.request,time
          base='https://neiscircle.site'
          marker='20261119-mobile-install-only'
          for i in range(20):
              try:
                  def get(path):
                      req=urllib.request.Request(base+path,headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=15) as r:return r.status,r.read()
                  sh,home=get('/')
                  ss,script=get('/scripts/pwa-install-v117.js?v='+marker)
                  sc,css=get('/styles/pwa-v117.css?v='+marker)
                  si,ico=get('/favicon.ico')
                  sa,about=get('/about.html')
                  assert sh==ss==sc==si==sa==200
                  assert b'isMobileOrTabletBrowser()' in script
                  assert b'html.neis-desktop-browser .pwa-install-card' in css
                  assert b'scripts/pwa-install-v117.js?v='+marker.encode() in home
                  assert b'original-tab-20261119' in home and b'original-tab-20261119' in about
                  assert ico[:4]==b'\x00\x00\x01\x00'
                  assert b'scripts/user-activity-v1.js' in home
                  with urllib.request.urlopen('https://supabase.neiscircle.site/auth/v1/settings',timeout=15) as r:assert r.status==200
                  print('PWA_MOBILE_TABLET_EXTERNAL_SMOKE=PASS')
                  break
              except Exception:
                  if i==19:raise
                  time.sleep(3)
          else:raise RuntimeError('Live deployment not verified')
          PY
