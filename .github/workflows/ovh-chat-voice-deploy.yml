name: Deploy bilingual voice input to all NEIS chats
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ovh-chat-voice-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ovh-frontend-caddy-release
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate shared voice module and unchanged chat code
        run: |
          set -euo pipefail
          node --check scripts/chat-voice-v1.js
          grep -Fq "liveChatInput" scripts/chat-voice-v1.js
          grep -Fq "circleChatInput" scripts/chat-voice-v1.js
          grep -Fq "magnusInput" scripts/chat-voice-v1.js
          grep -Fq "recog.continuous=true" scripts/chat-voice-v1.js
          grep -Fq "styles/chat-voice-v1.css?v=20261104v2" index.html
          grep -Fq "scripts/chat-voice-v1.js?v=20261104v2" index.html
      - name: Configure pinned SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OVH_HOST" && test -n "$OVH_SSH_KEY" && test -n "$OVH_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Stage voice assets
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          set -euo pipefail
          host="ubuntu@$OVH_HOST"
          stage="/home/ubuntu/neis-backups/chat-voice-${{ github.run_id }}-${{ github.run_attempt }}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$host" "install -d -m 700 '$stage'"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/chat-voice-v1.js "$host:$stage/chat-voice-v1.js"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes styles/chat-voice-v1.css "$host:$stage/chat-voice-v1.css"
      - name: Isolated frontend activation with rollback
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@$OVH_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          cd /home/ubuntu/neis-supabase
          stage="/home/ubuntu/neis-backups/chat-voice-${{ github.run_id }}-${{ github.run_attempt }}"
          new="/home/ubuntu/neis-frontend/releases/chat-voice-${{ github.run_id }}-${{ github.run_attempt }}"
          overlay="docker-compose.frontend-public.yml"
          docker=(sudo -n /usr/bin/docker)
          compose=("${docker[@]}" compose -f docker-compose.yml -f docker-compose.security.yml -f docker-compose.caddy.yml -f docker-compose.frontend-public.yml -f docker-compose.auth-public-direct.yml)
          test -s "$stage/chat-voice-v1.js" && test -s "$stage/chat-voice-v1.css" && test ! -e "$new"
          old=$("${docker[@]}" inspect supabase-caddy --format '{{range .Mounts}}{{if eq .Destination "/srv/neis-circle"}}{{.Source}}{{end}}{{end}}')
          [[ "$old" == /home/ubuntu/neis-frontend/releases/* ]] && test -d "$old"
          test -f "$old/index.html" && test -f "$old/scripts/05-social.js" && test -f "$old/scripts/magnus-neis-v1.js"
          grep -Fq "$old" "$overlay"
          cp "$overlay" "$stage/overlay.backup"
          cp -a "$old" "$new"
          cp "$stage/chat-voice-v1.js" "$new/scripts/chat-voice-v1.js"
          cp "$stage/chat-voice-v1.css" "$new/styles/chat-voice-v1.css"
          python3 - "$new/index.html" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);h=p.read_text()
          css='<link rel="stylesheet" href="styles/chat-voice-v1.css?v=20261104v2">'
          js='<script src="scripts/chat-voice-v1.js?v=20261104v2" defer></script>'
          if h.count('styles/chat-voice-v1.css')>1 or h.count('scripts/chat-voice-v1.js')>1:raise SystemExit('DUPLICATE_VOICE_ASSET')
          import re
          if 'styles/chat-voice-v1.css' not in h:
            h=h.replace('</head>',f'  {css}\n</head>')
          else:
            h=re.sub(r'styles/chat-voice-v1\.css\?v=[A-Za-z0-9_-]+','styles/chat-voice-v1.css?v=20261104v2',h)
          if 'scripts/chat-voice-v1.js' not in h:
            h=h.replace('</body>',f'  {js}\n</body>')
          else:
            h=re.sub(r'scripts/chat-voice-v1\.js\?v=[A-Za-z0-9_-]+','scripts/chat-voice-v1.js?v=20261104v2',h)
          if h.count('styles/chat-voice-v1.css')!=1 or h.count('scripts/chat-voice-v1.js')!=1:raise SystemExit('VOICE_ASSET_MISSING')
          p.write_text(h)
          PY
          python3 - "$overlay" "$old" "$new" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);old,new=sys.argv[2:];s=p.read_text()
          if s.count(old)!=1:raise SystemExit('FRONTEND_MOUNT_MISMATCH')
          p.write_text(s.replace(old,new))
          PY
          rollback(){
            cp "$stage/overlay.backup" "$overlay"
            "${compose[@]}" up -d --no-deps caddy || true
            echo CHAT_VOICE_DEPLOY=ROLLED_BACK
          }
          trap rollback ERR
          "${compose[@]}" config --quiet
          "${compose[@]}" up -d --no-deps caddy
          cid=$("${compose[@]}" ps -q caddy)
          test -n "$cid"
          "${docker[@]}" exec "$cid" grep -Fq 'circleChatInput' /srv/neis-circle/scripts/chat-voice-v1.js
          "${docker[@]}" exec "$cid" grep -Fq 'liveChatInput' /srv/neis-circle/scripts/chat-voice-v1.js
          "${docker[@]}" exec "$cid" grep -Fq 'magnusInput' /srv/neis-circle/scripts/chat-voice-v1.js
          "${docker[@]}" exec "$cid" grep -Fq 'scripts/chat-voice-v1.js?v=20261104v2' /srv/neis-circle/index.html
          "${docker[@]}" exec "$cid" test -s /srv/neis-circle/styles/chat-voice-v1.css
          trap - ERR
          echo CHAT_VOICE_DEPLOY=SUCCESS
          echo DATABASE_AND_CHAT_LOGIC=UNCHANGED
          REMOTE
