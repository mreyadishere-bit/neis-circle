name: OVH Production Cloud Database Atomic Import
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ops/ovh-final-live-database-import.py'
      - '.github/workflows/ovh-final-live-database-import.yml'
permissions:
  contents: read
concurrency:
  group: ovh-live-database-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Check import syntax
        run: python3 -m py_compile scripts/ops/ovh-final-live-database-import.py
      - name: Configure pinned SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OVH_HOST" && test -n "$OVH_SSH_KEY" && test -n "$OVH_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Export final Cloud Roles Schema and Data during maintenance
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          CLOUD_DATABASE_URL: ${{ secrets.CLOUD_DATABASE_URL }}
        run: bash scripts/ops/ovh-cloud-cli-compatible-export.sh
      - name: Import 91 compatible tables atomically into live OVH PostgreSQL
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@$OVH_HOST" 'python3 -' "$GITHUB_RUN_ID" < scripts/ops/ovh-final-live-database-import.py
