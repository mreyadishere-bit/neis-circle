name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Android version name"
        required: true
        default: "1.0.0"
  push:
    branches:
      - main
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" || { echo "::error::Missing ANDROID_KEYSTORE_B64"; exit 1; }
          test -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "${{ secrets.ANDROID_KEY_ALIAS }}" || { echo "::error::Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "${{ secrets.ANDROID_KEY_PASSWORD }}" || { echo "::error::Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Restore signing file
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -f mobile/android/app/google-services.json || { echo "::error::Missing committed google-services.json"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > mobile/android/app/release.keystore

      - name: Build signed release APK
        shell: bash
        env:
          NEIS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NEIS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NEIS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle -p mobile/android :app:assembleRelease \
            -PNEIS_VERSION_NAME="${{ inputs.version_name || '1.0.0' }}" \
            -PNEIS_VERSION_CODE="${{ github.run_number }}" \
            --no-daemon
          cp mobile/android/app/build/outputs/apk/release/app-release.apk neis-circle-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neis-circle-android
          path: neis-circle-android.apk
          if-no-files-found: error

      - name: Publish latest Android release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-${{ github.run_number }}"
          gh release create "$TAG" neis-circle-android.apk \
            --title "NEIS Circle Android ${{ inputs.version_name || '1.0.0' }}" \
            --notes "Signed Android APK for NEIS Circle." \
            --latest

