name: OVH Fresh Cloud Database Backup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ovh-fresh-cloud-database-backup.yml'
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OVH_HOST" && test -n "$OVH_SSH_KEY" && test -n "$OVH_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Capture Cloud DB using secure direct connection and transfer to private OVH path
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          CLOUD_DATABASE_URL: ${{ secrets.CLOUD_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUD_DATABASE_URL" ]]; then
            echo "BACKUP=BLOCKED_CLOUD_DATABASE_URL_NOT_CONFIGURED"
            exit 1
          fi
          mkdir -p /tmp/neis-private-backup
          chmod 700 /tmp/neis-private-backup
          trap 'rm -rf /tmp/neis-private-backup' EXIT
          # Pinned PostgreSQL major version, independent of GitHub runner defaults.
          export PGCONNECT_TIMEOUT=15
          export PGSSLMODE=require
          if ! docker run --rm --network bridge --user "$(id -u):$(id -g)" \
            -e CLOUD_DATABASE_URL -e PGCONNECT_TIMEOUT -e PGSSLMODE \
            -v /tmp/neis-private-backup:/backup postgres:17 \
            sh -c 'pg_dump --dbname="$CLOUD_DATABASE_URL" --format=custom --no-owner --no-acl --file=/backup/cloud.dump' \
            >/dev/null 2>/tmp/neis-private-backup/pgdump.err; then
            # Report only a fixed non-sensitive error class; never print stderr or URI.
            if grep -qi 'password authentication failed' /tmp/neis-private-backup/pgdump.err; then
              echo "BACKUP_ERROR=AUTHENTICATION"
            elif grep -Eqi 'certificate|SSL|TLS' /tmp/neis-private-backup/pgdump.err; then
              echo "BACKUP_ERROR=TLS"
            elif grep -Eqi 'could not translate host name|name or service not known' /tmp/neis-private-backup/pgdump.err; then
              echo "BACKUP_ERROR=DNS"
            elif grep -Eqi 'timed out|network is unreachable|connection refused|no route to host' /tmp/neis-private-backup/pgdump.err; then
              echo "BACKUP_ERROR=NETWORK"
            elif grep -Eqi 'permission denied|must be owner' /tmp/neis-private-backup/pgdump.err; then
              echo "BACKUP_ERROR=PERMISSIONS"
            elif grep -Eqi 'pg_dump: error: server version|aborting because of server version' /tmp/neis-private-backup/pgdump.err; then
              echo "BACKUP_ERROR=POSTGRES_VERSION"
            elif grep -Eqi 'invalid URI|invalid connection option|missing "=" after' /tmp/neis-private-backup/pgdump.err; then
              echo "BACKUP_ERROR=URI_FORMAT"
            else
              echo "BACKUP_ERROR=OTHER"
            fi
            echo "BACKUP=FAILED_PG_DUMP"
            exit 1
          fi
          test -s /tmp/neis-private-backup/cloud.dump
          sha256sum /tmp/neis-private-backup/cloud.dump | awk '{print $1}' > /tmp/neis-private-backup/cloud.sha256
          BDIR="cloud-import-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@$OVH_HOST" "umask 077; mkdir -p /home/ubuntu/neis-backups/$BDIR"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes /tmp/neis-private-backup/cloud.dump /tmp/neis-private-backup/cloud.sha256 "ubuntu@$OVH_HOST:/home/ubuntu/neis-backups/$BDIR/"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@$OVH_HOST" "set -eu; cd /home/ubuntu/neis-backups/$BDIR; test -s cloud.dump; test -s cloud.sha256; test -f cloud.dump; ACTUAL=\$(sha256sum cloud.dump | awk '{print \$1}'); EXPECTED=\$(cat cloud.sha256); test \"\$ACTUAL\" = \"\$EXPECTED\"; chmod 600 cloud.dump cloud.sha256; echo BACKUP_TRANSFER=VERIFIED; echo BACKUP_PRODUCTION_DATABASE=UNCHANGED"

# Retry after updating the environment database connection secret.
