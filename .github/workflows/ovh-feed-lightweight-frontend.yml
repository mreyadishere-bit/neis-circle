name: OVH Lightweight Feed Rendering
# Reduce client-side feed render work without changing server resources or content.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ovh-feed-lightweight-frontend.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ovh-frontend-caddy-release
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate script and translated label
        run: |
          set -euo pipefail
          node --check scripts/05-social.js
          node qa/feed-performance-safe.test.mjs
          grep -Fq 'const following=new Set' scripts/05-social.js
          grep -Fq 'content-visibility:auto' styles/app.css
      - name: Configure pinned SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OVH_HOST" && test -n "$OVH_SSH_KEY" && test -n "$OVH_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Stage script only
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          set -euo pipefail
          host="ubuntu@$OVH_HOST"
          stage="/home/ubuntu/neis-backups/feed-lightweight-${{ github.run_id }}-${{ github.run_attempt }}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$host" "install -d -m 700 '$stage'"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/05-social.js "$host:$stage/05-social.js"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes styles/app.css "$host:$stage/app.css"
      - name: Activate isolated frontend release with rollback
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@$OVH_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          cd /home/ubuntu/neis-supabase
          stage="/home/ubuntu/neis-backups/feed-lightweight-${{ github.run_id }}-${{ github.run_attempt }}"
          dest="/home/ubuntu/neis-frontend/releases/feed-lightweight-${{ github.run_id }}-${{ github.run_attempt }}"
          overlay=docker-compose.frontend-public.yml
          docker=(sudo -n /usr/bin/docker)
          compose=("${docker[@]}" compose -f docker-compose.yml -f docker-compose.security.yml -f docker-compose.caddy.yml -f docker-compose.frontend-public.yml -f docker-compose.auth-public-direct.yml)
          test -s "$stage/05-social.js" && test -s "$stage/app.css" && test ! -e "$dest"
          old=$("${docker[@]}" inspect supabase-caddy --format '{{range .Mounts}}{{if eq .Destination "/srv/neis-circle"}}{{.Source}}{{end}}{{end}}')
          [[ "$old" == /home/ubuntu/neis-frontend/releases/* ]] && test -d "$old"
          test -s "$old/index.html" && test -s "$old/scripts/05-social.js"
          grep -Fq "$old" "$overlay"
          cp "$overlay" "$stage/overlay.backup"
          cp -a "$old" "$dest"
          cp "$stage/05-social.js" "$dest/scripts/05-social.js"
          cp "$stage/app.css" "$dest/styles/app.css"
          python3 - "$dest/index.html" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]);s=p.read_text()
          for asset in ('scripts/05-social.js','styles/app.css'):
            pat=re.escape(asset)+r'(?:\?[^"\x27<> ]*)?'
            if len(re.findall(pat,s))!=1:raise SystemExit('FEED_ASSET_REFERENCE_MISMATCH_'+asset)
            s=re.sub(pat,asset+'?v=feed-light-${{ github.run_id }}',s)
          p.write_text(s)
          PY
          python3 - "$overlay" "$old" "$dest" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);old,new=sys.argv[2:];s=p.read_text()
          if s.count(old)!=1:raise SystemExit('FRONTEND_MOUNT_MISMATCH')
          p.write_text(s.replace(old,new))
          PY
          rollback(){
            cp "$stage/overlay.backup" "$overlay"
            "${compose[@]}" up -d --no-deps caddy || true
            echo FEED_LIGHTWEIGHT=ROLLED_BACK
          }
          trap rollback ERR
          "${compose[@]}" config --quiet
          "${compose[@]}" up -d --no-deps caddy
          cid=$("${compose[@]}" ps -q caddy);test -n "$cid"
          "${docker[@]}" exec "$cid" grep -Fq 'const following=new Set' /srv/neis-circle/scripts/05-social.js
          "${docker[@]}" exec "$cid" grep -Fq 'content-visibility:auto' /srv/neis-circle/styles/app.css
          "${docker[@]}" exec "$cid" grep -Fq 'feed-light-${{ github.run_id }}' /srv/neis-circle/index.html
          trap - ERR
          echo FEED_LIGHTWEIGHT=SUCCESS
          echo DATABASE_AND_OTHER_SERVICES=UNCHANGED
          REMOTE
