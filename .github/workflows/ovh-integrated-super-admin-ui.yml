name: OVH Integrated Super Admin Access Control
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/main-admin-roles-v1.js'
      - 'scripts/super-admin-management-v1.js'
      - 'scripts/main-admin-auth-studio-v5.js'
      - 'scripts/ops/ovh-deploy-super-admin-integrated-20261103.py'
      - 'qa/super-admin-access-control.test.mjs'
      - '.github/workflows/ovh-integrated-super-admin-ui.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/main-admin-roles-v1.js'
      - 'scripts/super-admin-management-v1.js'
      - 'scripts/main-admin-auth-studio-v5.js'
      - 'scripts/ops/ovh-deploy-super-admin-integrated-20261103.py'
      - '.github/workflows/ovh-integrated-super-admin-ui.yml'
permissions:
  contents: read
concurrency:
  group: ovh-super-admin-integrated-ui-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test Access Control integration without changing accounts
        run: |
          set -euo pipefail
          node --check scripts/main-admin-roles-v1.js
          node --check scripts/super-admin-management-v1.js
          node --check scripts/main-admin-auth-studio-v5.js
          node qa/super-admin-access-control.test.mjs
          python3 -m py_compile scripts/ops/ovh-deploy-super-admin-integrated-20261103.py
          node qa/static-check.mjs
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OVH_HOST" && test -n "$OVH_SSH_KEY" && test -n "$OVH_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Stage only three UI scripts
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          set -euo pipefail
          target="ubuntu@$OVH_HOST"
          stage="/home/ubuntu/neis-backups/super-admin-access-ui-20261103"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "install -d -m 700 $stage"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/main-admin-roles-v1.js "$target:$stage/roles.js"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/super-admin-management-v1.js "$target:$stage/super-admin.js"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/main-admin-auth-studio-v5.js "$target:$stage/auth-studio.js"
      - name: Activate UI release with rollback protection
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          target="ubuntu@$OVH_HOST"
          release="${RELEASE_SHA:0:14}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "DEPLOY_REV=$release python3 -" < scripts/ops/ovh-deploy-super-admin-integrated-20261103.py
