name: OVH Secret Readiness Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ops/ovh-secret-readiness-gate.sh'
      - '.github/workflows/ovh-secret-readiness-gate.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check required secret presence without printing values
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: bash scripts/ops/ovh-secret-readiness-gate.sh
