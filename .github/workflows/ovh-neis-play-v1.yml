name: NEIS Play V1 Safe Rollout
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ovh-neis-play-v1-safe
  cancel-in-progress: false
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Static syntax and safety gates
        run: |
          set -euo pipefail
          node --check scripts/neis-play-v1.js
          node --check qa/neis-play-v1.test.mjs
          node --check qa/neis-play-browser.test.mjs
          python3 -m py_compile scripts/ops/ovh-deploy-neis-play-v1.py
          python3 -m py_compile scripts/ops/ovh-neis-play-authenticated-smoke.py
          node qa/neis-play-v1.test.mjs
  browser:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Playwright for preinstalled Chrome
        run: npm install --no-save playwright
      - name: Test untouched Home and new Play UI on desktop and mobile
        run: node qa/neis-play-browser.test.mjs
  preflight:
    needs: browser
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned OVH SSH
        env:
          HOST: ${{ secrets.OVH_HOST }}
          KEY: ${{ secrets.OVH_SSH_KEY }}
          KNOWN: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$KEY" && test -n "$KNOWN"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Stage new files and execute rolled-back SQL migration
        env:
          HOST: ${{ secrets.OVH_HOST }}
        run: |
          set -euo pipefail
          target="ubuntu@$HOST"
          stage="/home/ubuntu/neis-backups/neis-play-v1-stage"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "install -d -m 700 $stage"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/neis-play-v1.js "$target:$stage/neis-play-v1.js"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes styles/neis-play-v1.css "$target:$stage/neis-play-v1.css"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes supabase/migrations/20261103200000_neis_play_foundation.sql "$target:$stage/migration.sql"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/ops/ovh-deploy-neis-play-v1.py "$target:$stage/deploy.py"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/ops/ovh-neis-play-authenticated-smoke.py "$target:$stage/auth-smoke.py"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "python3 $stage/deploy.py --dry-run"
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned OVH SSH
        env:
          HOST: ${{ secrets.OVH_HOST }}
          KEY: ${{ secrets.OVH_SSH_KEY }}
          KNOWN: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$KEY" && test -n "$KNOWN"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy isolated database and frontend module
        env:
          HOST: ${{ secrets.OVH_HOST }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          target="ubuntu@$HOST"
          stage="/home/ubuntu/neis-backups/neis-play-v1-stage"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/neis-play-v1.js "$target:$stage/neis-play-v1.js"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes styles/neis-play-v1.css "$target:$stage/neis-play-v1.css"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes supabase/migrations/20261103200000_neis_play_foundation.sql "$target:$stage/migration.sql"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/ops/ovh-deploy-neis-play-v1.py "$target:$stage/deploy.py"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/ops/ovh-neis-play-authenticated-smoke.py "$target:$stage/auth-smoke.py"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "GITHUB_SHA=$GITHUB_SHA python3 $stage/deploy.py"
