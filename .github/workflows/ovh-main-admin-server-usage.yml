name: OVH Main Admin Server Usage
on:
  workflow_dispatch:
  push:
    branches: [main, feature/main-admin-ovh-usage-20261011]
    paths:
      - 'supabase/migrations/20261011164000_primary_admin_ovh_server_usage.sql'
      - 'scripts/server-usage-admin-v1.js'
      - 'scripts/ops/ovh-primary-admin-usage-sample.py'
      - 'scripts/ops/ovh-deploy-main-admin-server-usage.py'
      - 'scripts/ops/neis-server-usage-sample.service'
      - 'scripts/ops/neis-server-usage-sample.timer'
      - '.github/workflows/ovh-main-admin-server-usage.yml'
permissions:
  contents: read
concurrency:
  group: ovh-main-admin-server-usage
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts, SQL access guards and append-only deployment
        run: |
          set -euo pipefail
          node --check scripts/server-usage-admin-v1.js
          python3 -m py_compile scripts/ops/ovh-primary-admin-usage-sample.py scripts/ops/ovh-deploy-main-admin-server-usage.py
          python3 - <<'PY'
          from pathlib import Path
          sql=Path('supabase/migrations/20261011164000_primary_admin_ovh_server_usage.sql').read_text()
          ui=Path('scripts/server-usage-admin-v1.js').read_text()
          deploy=Path('scripts/ops/ovh-deploy-main-admin-server-usage.py').read_text()
          for word in ("security definer","auth.uid()","u.id='25b556a3-ec6f-49e7-ac6c-1b09720e3bfd'::uuid","p.role='admin'","account_status","revoke all on public.neis_private_server_usage_samples","revoke all on function public.main_admin_server_usage() from public, anon"):
            assert word in sql,word
          assert "sb.rpc('main_admin_server_usage')" in ui
          assert 'server-usage-admin-v1.js?usage=20261011v1' in deploy
          assert 'rollback()' in deploy
          assert 'MAIN_ADMIN_FEATURE_NOT_PRESENT' in deploy
          print("MAIN_ADMIN_SERVER_USAGE_VALIDATION=PASS")
          PY
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Pinned OVH SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OVH_HOST" && test -n "$OVH_SSH_KEY" && test -n "$OVH_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Stage reviewed deployment assets and install on OVH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          set -euo pipefail
          target="ubuntu@$OVH_HOST"
          path=/home/ubuntu/neis-backups/server-usage-20261011
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "install -d -m 700 $path"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes supabase/migrations/20261011164000_primary_admin_ovh_server_usage.sql "$target:$path/schema.sql"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/ops/ovh-primary-admin-usage-sample.py "$target:$path/agent.py"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/server-usage-admin-v1.js "$target:$path/ui.js"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/ops/neis-server-usage-sample.service "$target:$path/agent.service"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/ops/neis-server-usage-sample.timer "$target:$path/agent.timer"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" 'python3 -' < scripts/ops/ovh-deploy-main-admin-server-usage.py
