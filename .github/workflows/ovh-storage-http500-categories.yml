name: OVH Storage HTTP500 Categorical Diagnosis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ops/ovh-storage-http500-categories.py'
      - '.github/workflows/ovh-storage-http500-categories.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile scripts/ops/ovh-storage-http500-categories.py
      - name: Pinned SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OVH_HOST" && test -n "$OVH_SSH_KEY" && test -n "$OVH_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Diagnose Storage logs and endpoint categories without logging private values
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@$OVH_HOST" 'python3 -' < scripts/ops/ovh-storage-http500-categories.py
