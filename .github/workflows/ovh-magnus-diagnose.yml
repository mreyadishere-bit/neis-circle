name: Diagnose Magnus backend safely
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ovh-magnus-diagnose.yml'
      - 'supabase/functions/magnus-chat/index.ts'
      - 'scripts/magnus-neis-v1.js'
permissions: {contents: read}
jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OVH_HOST" && test -n "$OVH_SSH_KEY" && test -n "$OVH_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Read sanitized recent Magnus error categories and database capability flags
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@$OVH_HOST" 'python3 -' <<'PY'
          import subprocess,re
          def run(args,stdin=None):
            return subprocess.run(args,input=stdin,text=True,capture_output=True,timeout=30)
          logs=run(['sudo','-n','/usr/bin/docker','logs','--since','18h','--tail','1200','supabase-edge-functions']).stderr
          categories=re.findall(r'Magnus request failed:\s*([A-Z][A-Z_]{3,60})',logs)
          print('MAGNUS_ERROR_CATEGORIES='+','.join(categories[-12:]) if categories else 'MAGNUS_ERROR_CATEGORIES=NOT_FOUND')
          sql="""select 'magnus_messages_table='||(to_regclass('public.magnus_messages') is not null)::text;
          select 'magnus_claim_turn='||(to_regprocedure('public.magnus_claim_turn()') is not null)::text;
          select 'magnus_commit_turn='||(to_regprocedure('public.magnus_commit_turn(uuid,uuid,text,text,text)') is not null)::text;
          select 'service_table_select='||has_table_privilege('service_role','public.magnus_messages','select')::text;
          select 'authenticated_claim='||has_function_privilege('authenticated','public.magnus_claim_turn()','execute')::text;"""
          db=run(['sudo','-n','/usr/bin/docker','exec','-i','supabase-db','psql','-X','-v','ON_ERROR_STOP=1','-U','postgres','-d','postgres','-Atq'],stdin=sql)
          if db.returncode:print('MAGNUS_DB_CAPABILITIES=CHECK_FAILED')
          else:
            for line in db.stdout.splitlines():
              if re.match(r'^[a-z_]+=([a-z]+)$',line):print('MAGNUS_DB_'+line)
          docker=run(['sudo','-n','/usr/bin/docker','exec','supabase-edge-functions','sh','-c','test -n "$GEMINI_API_KEY" && test -n "$SUPABASE_ANON_KEY" && test -n "$SUPABASE_SERVICE_ROLE_KEY"'])
          print('MAGNUS_KEYS_PRESENT='+str(docker.returncode==0).lower())
          PY
