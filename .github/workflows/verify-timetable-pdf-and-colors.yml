name: Verify PDF Accuracy and Timetable Colors (No Production Writes)
on:
  push:
    branches: [fix/timetable-pdf-accuracy-colors-20261102]
    paths:
      - scripts/timetable-ai-cloudflare-v1.js
      - supabase/functions/timetable-ai-cloudflare/index.ts
      - scripts/ops/ovh-patch-timetable-rpc-colors.py
      - qa/timetable-pdf-position-and-footnotes.test.mjs
      - qa/timetable-rpc-color-patch.test.py
      - .github/workflows/verify-timetable-pdf-and-colors.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: oven-sh/setup-bun@v2
      - name: Verify code, PDF notes and SQL color fix locally
        run: |
          bun install --frozen-lockfile
          node --check scripts/timetable-ai-cloudflare-v1.js
          node qa/timetable-pdf-position-and-footnotes.test.mjs
          node qa/timetable-guided-import-v2.test.mjs
          python3 -m unittest discover -s qa -p 'timetable-rpc-color-patch.test.py'
          python3 -m py_compile scripts/ops/ovh-patch-timetable-rpc-colors.py
          bun build supabase/functions/timetable-ai-cloudflare/index.ts --target=browser --external '*' --outdir=/tmp/timetable-ts-check
          node qa/static-check.mjs
          npm run qa:unit
      - name: Dry-run color SQL migration against live RPC (read-only)
        env:
          HOST: ${{ secrets.OVH_HOST }}
          KEY: ${{ secrets.OVH_SSH_KEY }}
          KNOWN: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes "ubuntu@$HOST"             'TIMETABLE_RPC_DRY_RUN=1 python3 -' < scripts/ops/ovh-patch-timetable-rpc-colors.py
