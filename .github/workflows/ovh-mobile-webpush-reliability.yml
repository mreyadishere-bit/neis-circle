name: OVH Mobile PWA Push Reliability
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ovh-mobile-webpush-reliability.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ovh-frontend-caddy-release
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: oven-sh/setup-bun@v2
      - name: Validate runtime and push reliability
        run: |
          set -euo pipefail
          node --check scripts/social/notifications-v174.js
          node --check scripts/pwa-install-v117.js
          node qa/mobile-webpush-delivery.test.mjs
          python3 -m py_compile scripts/ops/ovh-webpush-sender-deploy.py
          bun build supabase/functions/send-web-push/index.ts --target=browser --external '*' --outdir=/tmp/webpush-sender-check
      - name: Configure trusted SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OVH_HOST" && test -n "$OVH_SSH_KEY" && test -n "$OVH_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Stage push sender and frontend scripts
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          set -euo pipefail
          host="ubuntu@$OVH_HOST"
          sender="/home/ubuntu/neis-backups/webpush-sender-stage"
          front="/home/ubuntu/neis-backups/mobile-webpush-${{ github.run_id }}-${{ github.run_attempt }}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$host" "install -d -m 700 '$sender' '$front'"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes supabase/functions/send-web-push/index.ts "$host:$sender/index.ts"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/ops/ovh-webpush-sender-deploy.py "$host:$sender/deploy.py"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/social/notifications-v174.js "$host:$front/notifications-v174.js"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/pwa-install-v117.js "$host:$front/pwa-install-v117.js"
      - name: Update isolated Web Push sender preserving all other Edge functions
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@$OVH_HOST"             "python3 /home/ubuntu/neis-backups/webpush-sender-stage/deploy.py"
      - name: Publish two updated frontend modules, rollback on failure
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@$OVH_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          cd /home/ubuntu/neis-supabase
          stage="/home/ubuntu/neis-backups/mobile-webpush-${{ github.run_id }}-${{ github.run_attempt }}"
          dest="/home/ubuntu/neis-frontend/releases/mobile-webpush-${{ github.run_id }}-${{ github.run_attempt }}"
          overlay=docker-compose.frontend-public.yml
          docker=(sudo -n /usr/bin/docker)
          compose=("${docker[@]}" compose -f docker-compose.yml -f docker-compose.security.yml -f docker-compose.caddy.yml -f docker-compose.frontend-public.yml -f docker-compose.auth-public-direct.yml)
          test -s "$stage/notifications-v174.js" && test -s "$stage/pwa-install-v117.js" && test ! -e "$dest"
          old=$("${docker[@]}" inspect supabase-caddy --format '{{range .Mounts}}{{if eq .Destination "/srv/neis-circle"}}{{.Source}}{{end}}{{end}}')
          [[ "$old" == /home/ubuntu/neis-frontend/releases/* ]] && test -d "$old"
          test -s "$old/index.html" && grep -Fq "$old" "$overlay"
          cp "$overlay" "$stage/overlay.backup"
          cp -a "$old" "$dest"
          cp "$stage/notifications-v174.js" "$dest/scripts/social/notifications-v174.js"
          cp "$stage/pwa-install-v117.js" "$dest/scripts/pwa-install-v117.js"
          python3 - "$dest/index.html" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]);s=p.read_text()
          for asset in ('scripts/social/notifications-v174.js','scripts/pwa-install-v117.js'):
            pat=re.escape(asset)+r'(?:\?[^"\x27<> ]*)?'
            if len(re.findall(pat,s))!=1:raise SystemExit('PUSH_SCRIPT_ASSET_MISMATCH_'+asset)
            s=re.sub(pat,asset+'?v=mobile-push-${{ github.run_id }}',s)
          p.write_text(s)
          PY
          python3 - "$overlay" "$old" "$dest" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);old,new=sys.argv[2:];s=p.read_text()
          if s.count(old)!=1:raise SystemExit('FRONTEND_MOUNT_MISMATCH')
          p.write_text(s.replace(old,new))
          PY
          rollback(){
            cp "$stage/overlay.backup" "$overlay"
            "${compose[@]}" up -d --no-deps caddy || true
            echo MOBILE_WEBPUSH_FRONTEND=ROLLED_BACK
          }
          trap rollback ERR
          "${compose[@]}" config --quiet
          "${compose[@]}" up -d --no-deps caddy
          cid=$("${compose[@]}" ps -q caddy);test -n "$cid"
          "${docker[@]}" exec "$cid" grep -Fq "healthy?30000:10000" /srv/neis-circle/scripts/social/notifications-v174.js
          "${docker[@]}" exec "$cid" grep -Fq "Test device notification" /srv/neis-circle/scripts/pwa-install-v117.js
          "${docker[@]}" exec "$cid" grep -Fq 'mobile-push-${{ github.run_id }}' /srv/neis-circle/index.html
          trap - ERR
          echo MOBILE_WEBPUSH_FRONTEND=SUCCESS
          echo OTHER_FRONTEND_AND_DATABASE=UNCHANGED
          REMOTE
