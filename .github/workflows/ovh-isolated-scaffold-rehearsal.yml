name: OVH Isolated Auth Storage Scaffold Rehearsal
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ops/ovh-isolated-scaffold-rehearsal.sh'
      - '.github/workflows/ovh-isolated-scaffold-rehearsal.yml'
permissions:
  contents: read
  issues: write
concurrency:
  group: ovh-disconnected-db-schema
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: SSH credentials
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OVH_HOST" && test -n "$OVH_SSH_KEY" && test -n "$OVH_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Import only Auth Storage DDL into disconnected test
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@$OVH_HOST" 'bash -s' < scripts/ops/ovh-isolated-scaffold-rehearsal.sh
      - name: Publish result URL to GitHub Issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ job.status }}
        run: |
          printf 'Disconnected Auth/Storage schema-only rehearsal: %s\nOutcome: %s\n' "$RUN_URL" "$OUTCOME" > /tmp/result.txt
          gh issue create --repo "$GH_REPO" --title "OVH scaffold rehearsal #${{ github.run_number }} (${{ job.status }})" --body-file /tmp/result.txt
