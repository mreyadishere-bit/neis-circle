name: OVH Edge Candidate Entry Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ops/ovh-edge-entrypoint-audit.sh'
      - '.github/workflows/ovh-edge-entrypoint-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/ops/ovh-edge-entrypoint-audit.sh
      - name: Configure pinned SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OVH_HOST" && test -n "$OVH_SSH_KEY" && test -n "$OVH_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Audit isolated Edge entrypoints
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@$OVH_HOST" 'bash -s' < scripts/ops/ovh-edge-entrypoint-audit.sh
