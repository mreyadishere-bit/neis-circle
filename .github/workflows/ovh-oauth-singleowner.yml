name: OVH OAuth Single Owner Session Fix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/01-core.js'
      - 'scripts/03-auth-i18n.js'
      - 'qa/oauth-fragment-recovery.test.mjs'
      - 'scripts/ops/ovh-deploy-oauth-singleowner.sh'
      - '.github/workflows/ovh-oauth-singleowner.yml'
permissions:
  contents: read
concurrency:
  group: ovh-oauth-recovery
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript and exercise synthetic OAuth callback
        run: |
          node --check scripts/01-core.js
          node --check scripts/03-auth-i18n.js
          node qa/oauth-fragment-recovery.test.mjs
          bash -n scripts/ops/ovh-deploy-oauth-singleowner.sh
      - name: Configure pinned SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OVH_HOST" && test -n "$OVH_SSH_KEY" && test -n "$OVH_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy immutable OVH OAuth recovery static release
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@$OVH_HOST" 'mkdir -p -m 700 /home/ubuntu/neis-backups/oauth-singleowner-20261010'
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/01-core.js "ubuntu@$OVH_HOST:/home/ubuntu/neis-backups/oauth-singleowner-20261010/01-core.js"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/03-auth-i18n.js "ubuntu@$OVH_HOST:/home/ubuntu/neis-backups/oauth-singleowner-20261010/03-auth-i18n.js"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@$OVH_HOST" 'bash -s' < scripts/ops/ovh-deploy-oauth-singleowner.sh
