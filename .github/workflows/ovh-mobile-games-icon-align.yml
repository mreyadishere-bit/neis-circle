name: OVH Mobile More Games Icon Alignment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ovh-mobile-games-icon-align.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ovh-frontend-caddy-release
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify narrow mobile menu icon alignment
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('styles/neis-game-connectors-v1.css').read_text()
          assert '.mobile-nav-list .neis-mobile-game-entry .neis-mobile-game-icon' in s
          assert 'justify-self:center;align-self:center;width:36px;height:36px' in s
          assert '.neis-mobile-game-entry .neis-mobile-game-icon{display:grid;place-items:center;width:23px' not in s
          nav=Path('scripts/navigation-v14.js').read_text()
          assert 'neis-mobile-game-entry' in nav and 'data-neis-connect-open' in nav
          print('GAMES_ICON_ALIGNMENT=PASS')
          PY
      - name: Configure pinned SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OVH_HOST" && test -n "$OVH_SSH_KEY" && test -n "$OVH_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Stage targeted stylesheet
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          set -euo pipefail
          target="ubuntu@$OVH_HOST"
          stage="/home/ubuntu/neis-backups/mobile-games-icon-${{ github.run_id }}-${{ github.run_attempt }}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "install -d -m 700 '$stage'"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes styles/neis-game-connectors-v1.css "$target:$stage/neis-game-connectors-v1.css"
      - name: Atomic CSS-only release with rollback
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@$OVH_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          cd /home/ubuntu/neis-supabase
          stage="/home/ubuntu/neis-backups/mobile-games-icon-${{ github.run_id }}-${{ github.run_attempt }}"
          dest="/home/ubuntu/neis-frontend/releases/mobile-games-icon-${{ github.run_id }}-${{ github.run_attempt }}"
          overlay=docker-compose.frontend-public.yml
          docker=(sudo -n /usr/bin/docker)
          compose=("${docker[@]}" compose -f docker-compose.yml -f docker-compose.security.yml -f docker-compose.caddy.yml -f docker-compose.frontend-public.yml -f docker-compose.auth-public-direct.yml)
          test -s "$stage/neis-game-connectors-v1.css" && test ! -e "$dest"
          old=$("${docker[@]}" inspect supabase-caddy --format '{{range .Mounts}}{{if eq .Destination "/srv/neis-circle"}}{{.Source}}{{end}}{{end}}')
          [[ "$old" == /home/ubuntu/neis-frontend/releases/* ]] && test -d "$old"
          test -s "$old/index.html" && test -s "$old/styles/neis-game-connectors-v1.css"
          grep -Fq "$old" "$overlay"
          cp "$overlay" "$stage/overlay.backup"
          cp -a "$old" "$dest"
          cp "$stage/neis-game-connectors-v1.css" "$dest/styles/neis-game-connectors-v1.css"
          python3 - "$dest/index.html" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]);s=p.read_text()
          pat=r'styles/neis-game-connectors-v1\.css(?:\?[^"\x27<> ]*)?'
          if len(re.findall(pat,s))!=1:raise SystemExit('GAME_CSS_REFERENCE_MISMATCH')
          s=re.sub(pat,'styles/neis-game-connectors-v1.css?v=mobile-game-align-${{ github.run_id }}',s)
          p.write_text(s)
          PY
          python3 - "$overlay" "$old" "$dest" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);old,new=sys.argv[2:];s=p.read_text()
          if s.count(old)!=1:raise SystemExit('FRONTEND_MOUNT_MISMATCH')
          p.write_text(s.replace(old,new))
          PY
          rollback(){
            cp "$stage/overlay.backup" "$overlay"
            "${compose[@]}" up -d --no-deps caddy || true
            echo MOBILE_GAMES_ICON=ROLLED_BACK
          }
          trap rollback ERR
          "${compose[@]}" config --quiet
          "${compose[@]}" up -d --no-deps caddy
          cid=$("${compose[@]}" ps -q caddy);test -n "$cid"
          "${docker[@]}" exec "$cid" grep -Fq 'justify-self:center;align-self:center;width:36px;height:36px' /srv/neis-circle/styles/neis-game-connectors-v1.css
          "${docker[@]}" exec "$cid" grep -Fq 'mobile-game-align-${{ github.run_id }}' /srv/neis-circle/index.html
          trap - ERR
          echo MOBILE_GAMES_ICON=SUCCESS
          echo OTHER_FRONTEND_AND_DB=UNCHANGED
          REMOTE
