name: Gemini real multimodal smoke
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/gemini-live-timetable-smoke.yml']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    environment: ovh-staging
    steps:
      - name: Test live Gemini with 2 tiny images
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,concurrent.futures,time
          key=os.getenv("GEMINI_KEY",""); assert key
          tiny="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/lN8AAAAASUVORK5CYII="
          p={"contents":[{"role":"user","parts":[{"text":"Return JSON with page_count 2."},{"inlineData":{"mimeType":"image/png","data":tiny}},{"inlineData":{"mimeType":"image/png","data":tiny}}]}],"generationConfig":{"responseMimeType":"application/json","maxOutputTokens":4096}}
          def test(model):
            start=time.monotonic()
            url="https://generativelanguage.googleapis.com/v1beta/models/"+model+":generateContent"
            req=urllib.request.Request(url,data=json.dumps(p).encode(),headers={"x-goog-api-key":key,"Content-Type":"application/json"})
            try:
              with urllib.request.urlopen(req,timeout=19) as res: d=json.load(res)
              c=(d.get("candidates") or [{}])[0]
              content="".join(v.get("text","") for v in c.get("content",{}).get("parts",[]))
              result="PASS" if content else "EMPTY_"+str(c.get("finishReason"))
              if content: json.loads(content)
            except urllib.error.HTTPError as e:
              try: detail=json.loads(e.read()).get("error",{}).get("status","UNKNOWN")
              except Exception: detail="UNKNOWN"
              result="HTTP_"+str(e.code)+"_"+str(detail)
            except Exception as e: result=type(e).__name__
            return model,result,round(time.monotonic()-start,1)
          names=["gemini-3.5-flash-lite","gemini-3.1-flash-lite","gemini-3-flash-preview","gemini-2.5-flash"]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool: results=list(pool.map(test,names))
          for model,result,sec in results: print("REAL_GEMINI",model,result,sec)
          if not any(x[1]=="PASS" for x in results): raise SystemExit("NO_MODEL_PASSED")
          PY
