name: Gemini real multimodal smoke
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/gemini-live-timetable-smoke.yml']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    environment: ovh-staging
    steps:
      - name: Test live Gemini with 2 tiny images
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,concurrent.futures,time,base64,io
          from PIL import Image,ImageDraw
          key=os.getenv("GEMINI_KEY","")
          assert key,"MISSING_KEY"
          parts=[{"text":"Read both school timetable images. Respond JSON only with all_detected_subjects array and page_count=2. Preserve L1 and L2."}]
          for page in (1,2):
            im=Image.new("RGB",(980,400),"white")
            d=ImageDraw.Draw(im)
            d.text((35,35),"GRADE 11 TIMETABLE PAGE "+str(page),fill="black")
            d.text((35,110),"DAY       MATH L2          PHYSICS L2        ENGLISH L1",fill="black")
            d.text((35,205),"MONDAY    10:00-11:00      11:00-12:00       12:00-13:00",fill="black")
            buf=io.BytesIO();im.save(buf,format="PNG")
            parts.append({"inlineData":{"mimeType":"image/png","data":base64.b64encode(buf.getvalue()).decode()}})
          payload={"contents":[{"role":"user","parts":parts}],"generationConfig":{"responseMimeType":"application/json","maxOutputTokens":4096}}
          def test(model):
            start=time.monotonic()
            url="https://generativelanguage.googleapis.com/v1beta/models/"+model+":generateContent"
            req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={"x-goog-api-key":key,"Content-Type":"application/json"})
            try:
              with urllib.request.urlopen(req,timeout=22) as res: data=json.load(res)
              candidate=(data.get("candidates") or [{}])[0]
              content="".join(p.get("text","") for p in candidate.get("content",{}).get("parts",[]))
              if not content: return model,"EMPTY",round(time.monotonic()-start,2)
              parsed=json.loads(content)
              subjects=" ".join(map(str,parsed.get("all_detected_subjects",[]))).lower()
              result="PASS" if "math" in subjects and "physics" in subjects and "l2" in subjects else "INCORRECT_SUBJECTS"
            except urllib.error.HTTPError as e: result="HTTP_"+str(e.code)
            except Exception as e: result=type(e).__name__
            return model,result,round(time.monotonic()-start,2)
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
            results=list(pool.map(test,["gemini-3-flash-preview","gemini-3.1-flash-lite"]))
          for model,status,seconds in results: print("REAL_TIMETABLE",model,status,seconds)
          if not any(x[1]=="PASS" for x in results): raise SystemExit("NO_TIMETABLE_MODEL_PASSED")
          PY
