name: Gemini real multimodal smoke
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/gemini-live-timetable-smoke.yml']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    environment: ovh-staging
    steps:
      - name: Test live Gemini with 2 tiny images
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          key=os.getenv("GEMINI_KEY","")
          assert key
          req=urllib.request.Request("https://generativelanguage.googleapis.com/v1beta/models?pageSize=100",headers={"x-goog-api-key":key})
          try:
            with urllib.request.urlopen(req,timeout=15) as resp: d=json.load(resp)
          except urllib.error.HTTPError as e: raise SystemExit("LIST_MODELS_HTTP_"+str(e.code))
          models=[m["name"] for m in d.get("models",[]) if "generateContent" in m.get("supportedGenerationMethods",[])]
          print("GEMINI_ENABLED_MODELS",",".join(models)[:3000])
          if not models: raise SystemExit("NO_GENERATION_MODELS")
          PY
