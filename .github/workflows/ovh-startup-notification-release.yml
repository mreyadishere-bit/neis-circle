name: OVH Home and notification post release
on:
  workflow_dispatch:
  push:
    branches: [fix/faster-home-hydration-20261023]
    paths:
      - 'scripts/ops/startup-notification-20261023.patch'
      - 'scripts/ops/ovh-deploy-startup-notification.py'
      - 'scripts/ops/ovh-verify-startup-notification.py'
      - '.github/workflows/ovh-startup-notification-release.yml'
permissions:
  contents: read
concurrency:
  group: ovh-startup-notification-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate frontend and targeted regressions
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ops/ovh-deploy-startup-notification.py scripts/ops/ovh-verify-startup-notification.py
          git show 78e89de3acd637622d8faabd91b7beffa1b6171f:index.html > index.html
          git show 78e89de3acd637622d8faabd91b7beffa1b6171f:404.html > 404.html
          npm run qa:static
          npm run qa:unit
          node qa/google-only-auth-contract.mjs
          node qa/notification-sound-device.test.mjs
      - name: Browser regressions
        run: |
          set -euo pipefail
          npm install --no-save playwright
          test -x "$CHROME_PATH"
          node qa/startup-home-dom.test.mjs
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/neis-http.log 2>&1 &
          npm run qa:smoke
  deploy:
    needs: validate
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned SSH
        env:
          HOST: ${{ secrets.OVH_HOST }}
          KEY: ${{ secrets.OVH_SSH_KEY }}
          KNOWN: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$KEY" && test -n "$KNOWN"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Patch a copy of the current live release and activate
        id: activate
        env:
          HOST: ${{ secrets.OVH_HOST }}
        run: |
          set -euo pipefail
          target="ubuntu@$HOST"
          stage=/home/ubuntu/neis-backups/startup-notification-20261023-v2
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "install -d -m 700 $stage"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/ops/startup-notification-20261023.patch "$target:$stage/startup.patch"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" 'python3 -' < scripts/ops/ovh-deploy-startup-notification.py
      - name: Verify the release from the public internet
        run: python3 scripts/ops/ovh-verify-startup-notification.py
      - name: Roll back if public verification fails
        if: failure() && steps.activate.outcome == 'success'
        env:
          HOST: ${{ secrets.OVH_HOST }}
        run: ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@$HOST" 'python3 - --rollback' < scripts/ops/ovh-deploy-startup-notification.py
