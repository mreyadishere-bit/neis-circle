name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "stability-*"
      - "phase*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use pre-maintenance page in CI only
        run: |
          if grep -q 'Maintenance · NEIS Circle' index.html; then
            git show 78e89de3acd637622d8faabd91b7beffa1b6171f:index.html > index.html
            git show 78e89de3acd637622d8faabd91b7beffa1b6171f:404.html > 404.html
            echo "QUALITY_GATE=TESTING_PRE_MAINTENANCE_APP_ONLY"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate OVH migration shell syntax
        run: bash -n scripts/ops/ovh-cli-isolated-restore.sh
      - run: npm run qa:static
      - run: npm run qa:unit

  browser-smoke:
    name: Browser boot smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use pre-maintenance page in CI only
        run: |
          if grep -q 'Maintenance · NEIS Circle' index.html; then
            git show 78e89de3acd637622d8faabd91b7beffa1b6171f:index.html > index.html
            git show 78e89de3acd637622d8faabd91b7beffa1b6171f:404.html > 404.html
            echo "QUALITY_GATE=TESTING_PRE_MAINTENANCE_APP_ONLY"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/neis-http.log 2>&1 &
          echo $! > /tmp/neis-http.pid
          sleep 2
      - name: Run browser smoke
        run: npm run qa:smoke
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/neis-http.log || true
