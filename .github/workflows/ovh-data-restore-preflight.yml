name: OVH Data Restore Preflight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ops/ovh-data-restore-preflight.sh'
      - '.github/workflows/ovh-data-restore-preflight.yml'
permissions:
  contents: read
  issues: write
jobs:
  preflight:
    environment: ovh-staging
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OVH_HOST" && test -n "$OVH_SSH_KEY" && test -n "$OVH_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Run disconnected DB preflight
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@$OVH_HOST" 'bash -s' < scripts/ops/ovh-data-restore-preflight.sh
      - name: Record safe failure link
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'Read-only isolated data restore preflight failed: %s\n' "$RUN_URL" > /tmp/report.txt
          gh issue create --repo "$GH_REPO" --title "OVH data restore prerequisites blocked (run #${{ github.run_number }})" --body-file /tmp/report.txt
