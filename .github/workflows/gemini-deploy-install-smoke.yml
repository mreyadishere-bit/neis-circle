name: Gemini Deploy Dependency Install Smoke (No OVH)
on:
  push:
    branches: [fix/gemini-workflow-bun-lock-20261102]
    paths:
      - '.github/workflows/ovh-timetable-ai-gemini-deploy.yml'
      - '.github/workflows/gemini-deploy-install-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - name: Install using tracked Bun lock, run production preflight
        run: |
          bun install --frozen-lockfile
          node qa/static-check.mjs
          npm run qa:unit
