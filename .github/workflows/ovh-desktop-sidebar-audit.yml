name: OVH Desktop Sidebar Structure Audit
on:
  workflow_dispatch:
  push:
    branches: [feature/desktop-hover-sidebar-20261012]
    paths:
      - 'scripts/ops/ovh-desktop-sidebar-audit.py'
      - '.github/workflows/ovh-desktop-sidebar-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned SSH
        env:
          HOST: ${{ secrets.OVH_HOST }}
          KEY: ${{ secrets.OVH_SSH_KEY }}
          KNOWN: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$KEY" && test -n "$KNOWN"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Inspect live sidebar markup without writes
        env:
          HOST: ${{ secrets.OVH_HOST }}
        run: ssh -o StrictHostKeyChecking=yes ubuntu@"$HOST" 'python3 -' < scripts/ops/ovh-desktop-sidebar-audit.py
