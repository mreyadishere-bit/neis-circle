name: OVH Live Domain Check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ops/ovh-live-domain-check.sh'
      - '.github/workflows/ovh-live-domain-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ops/ovh-live-domain-check.sh
