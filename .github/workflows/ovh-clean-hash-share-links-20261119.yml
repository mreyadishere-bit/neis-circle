name: OVH Clean Section URL Previews and Original Hash Navigation 20261119
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ovh-clean-hash-share-links-20261119.yml'
      - 'scripts/ops/ovh-deploy-clean-hash-links-20261119.py'
      - 'scripts/ops/build-clean-hash-previews-20261119.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ovh-clean-hash-section-links
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Generate original-aspect-ratio OG images and instant app redirects
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ops/build-clean-hash-previews-20261119.py scripts/ops/ovh-deploy-clean-hash-links-20261119.py scripts/ops/ovh-rollback-clean-hash-links-20261119.py
          node --check scripts/hash-route-open-v1.js
          test -s deploy/NEIS_Circle_Complete_Share_Assets.zip
          mkdir -p /tmp/neis-share-source /tmp/neis-share-build
          unzip -q deploy/NEIS_Circle_Complete_Share_Assets.zip -d /tmp/neis-share-source
          python3 -m venv /tmp/neis-share-venv
          /tmp/neis-share-venv/bin/pip install --quiet pillow
          /tmp/neis-share-venv/bin/python scripts/ops/build-clean-hash-previews-20261119.py --assets-dir /tmp/neis-share-source/assets/share --output-dir /tmp/neis-share-build
          /tmp/neis-share-venv/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          root=Path('/tmp/neis-share-build')
          mapping=json.loads((root/'mapping.json').read_text())
          assert len(mapping)==15
          for slug,info in mapping.items():
              page=(root/'html'/(slug+'.html')).read_text()
              assert 'window.location.replace(' in page and '#/'+slug in page
              assert 'og:image:width' in page and 'og:image:height' in page
              assert info['og_image'] in page and info['url'] in page
              with Image.open(root/'assets/share-link'/(slug+'.webp')) as im:
                  assert im.size==(1200,630) and im.format=='WEBP'
              assert info['corrected_artwork_width']<=1200
          assert 'hash-route-open-v1.js' in Path('index.html').read_text()
          assert 'original-tab-20261119' in Path('index.html').read_text()
          print('CLEAN_SHARE_ASPECT_RATIO_AND_METADATA_CHECK=PASS')
          PY
      - name: Set up existing private OVH SSH credentials
        env:
          HOST: ${{ secrets.OVH_HOST }}
          KEY: ${{ secrets.OVH_SSH_KEY }}
          KNOWN: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$KEY" && test -n "$KNOWN"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Stage only 15 bot previews, 15 corrected images and tiny hash router
        env:
          HOST: ${{ secrets.OVH_HOST }}
        run: |
          set -euo pipefail
          dest=/home/ubuntu/neis-backups/clean-hash-links-20261119
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@$HOST" "install -d -m 700 $dest/html $dest/assets"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes /tmp/neis-share-build/html/*.html "ubuntu@$HOST:$dest/html/"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes /tmp/neis-share-build/assets/share-link/*.webp "ubuntu@$HOST:$dest/assets/"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/hash-route-open-v1.js "ubuntu@$HOST:$dest/hash-route-open-v1.js"
      - name: Deploy atomic OVH release and change only the Caddy SPA fallback line
        env:
          HOST: ${{ secrets.OVH_HOST }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@$HOST" "GITHUB_SHA='$GITHUB_SHA' python3 -" < scripts/ops/ovh-deploy-clean-hash-links-20261119.py
      - name: Externally verify 15 clean URLs, 15 OG previews and original app
        run: |
          python3 - <<'PY'
          import urllib.request,time,re
          base='https://neiscircle.site'
          slugs=('feed','discover','study','messages','connections','saved',
              'opportunities','gallery','articles','circles','analytics',
              'timetable','notifications','settings','games')
          def fetch(path,user_agent='facebookexternalhit/1.1'):
              req=urllib.request.Request(base+path,headers={'User-Agent':user_agent,'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=16) as r:
                  return r.status,r.url,r.headers.get('Content-Type',''),r.read()
          for attempt in range(12):
              try:
                  for slug in slugs:
                      status,url,mime,bytes_=fetch('/'+slug)
                      html=bytes_.decode('utf8','replace')
                      assert status==200 and mime.startswith('text/html'),(slug,mime)
                      assert f'<meta property="og:url" content="{base}/{slug}">' in html,slug
                      assert f'<meta property="og:image" content="{base}/assets/share-link/{slug}.webp?v=20261119-proportions">' in html,slug
                      assert "window.location.replace('/'+window.location.search+'#/"+slug+"')" in html,slug
                      assert 'An independent community for students' not in html,slug
                      si,_,mi,image=fetch('/assets/share-link/'+slug+'.webp')
                      assert si==200 and image[:4]==b'RIFF' and image[8:12]==b'WEBP',slug
                  sh,_,_,home=fetch('/')
                  assert sh==200 and b'scripts/hash-route-open-v1.js?v=20261119-clean-links' in home
                  assert b'assets/share/home-main.webp' in home
                  assert b'scripts/user-activity-v1.js' in home and b'scripts/03-auth-i18n.js' in home
                  st,_,mt,old_app=fetch('/#/articles',user_agent='Mozilla/5.0')
                  assert st==200 and b'scripts/03-auth-i18n.js' in old_app
                  with urllib.request.urlopen('https://supabase.neiscircle.site/auth/v1/settings',timeout=16) as r:assert r.status==200
                  print('NEIS_CLEAN_OG_HASH_ROUTES_EXTERNAL=PASS')
                  print('PUBLIC_SOCIAL_PREVIEWS='+str(len(slugs)))
                  print('ORIGINAL_MAIN_AND_APP_STILL_LIVE=YES')
                  break
              except Exception as error:
                  print('PUBLIC_SMOKE_RETRY',attempt+1,repr(error)[:190])
                  if attempt==11:raise
                  time.sleep(3)
          PY
      - name: Roll back Caddy and frontend automatically if any external preview fails
        if: failure()
        env:
          HOST: ${{ secrets.OVH_HOST }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ -f ~/.ssh/id_ed25519 ]; then
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@$HOST" "GITHUB_SHA='$GITHUB_SHA' python3 -" < scripts/ops/ovh-rollback-clean-hash-links-20261119.py
          fi
