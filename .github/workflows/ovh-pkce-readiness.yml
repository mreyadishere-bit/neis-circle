name: OVH PKCE Readiness Check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'qa/ovh-pkce-readiness.py'
      - '.github/workflows/ovh-pkce-readiness.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 qa/ovh-pkce-readiness.py
