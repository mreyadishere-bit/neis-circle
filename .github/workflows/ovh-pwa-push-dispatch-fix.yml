name: OVH PWA Push Dispatch Fix
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ovh-pwa-push-dispatch-fix
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate migration target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("supabase/migrations/20261030210000_web_push_dispatch_ovh.sql").read_text()
          assert "create or replace function private.dispatch_web_push_job()" in s
          assert "https://supabase.neiscircle.site/functions/v1/send-web-push" in s
          assert "drop " not in s.lower()
          print("MIGRATION_STATIC=PASS")
          PY
      - name: Configure pinned SSH
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OVH_HOST" && test -n "$OVH_SSH_KEY" && test -n "$OVH_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Safely apply Web Push dispatcher fix to OVH database
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
        run: |
          set -euo pipefail
          target="ubuntu@$OVH_HOST"
          remote_dir="/home/ubuntu/neis-backups/pwa-push-dispatch-20261030"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "install -d -m 700 '$remote_dir'"
          scp -q -o BatchMode=yes -o StrictHostKeyChecking=yes supabase/migrations/20261030210000_web_push_dispatch_ovh.sql "$target:$remote_dir/migration.sql"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/neis-supabase
          stage=/home/ubuntu/neis-backups/pwa-push-dispatch-20261030
          dc=(sudo -n /usr/bin/docker compose -f docker-compose.yml -f docker-compose.security.yml -f docker-compose.caddy.yml)
          # Never print user data, secret values or function definitions to Actions logs.
          ddl=$("${dc[@]}" exec -T db psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -Atqc "select pg_get_functiondef('private.dispatch_web_push_job()'::regprocedure)")
          if [[ "$ddl" == *"supabase.neiscircle.site/functions/v1/send-web-push"* ]]; then
            echo "DISPATCH=ALREADY_OVH"
            exit 0
          fi
          if [[ "$ddl" != *"ydieijgynqlckaczalju.supabase.co/functions/v1/send-web-push"* ]]; then
            echo "DISPATCH=UNKNOWN_TARGET_REFUSING_CHANGE"
            exit 1
          fi
          printf '%s\n' "$ddl" > "$stage/previous_function.sql"
          chmod 600 "$stage/previous_function.sql"
          cat "$stage/migration.sql" | "${dc[@]}" exec -T db psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -q
          new=$("${dc[@]}" exec -T db psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -Atqc "select pg_get_functiondef('private.dispatch_web_push_job()'::regprocedure) like '%https://supabase.neiscircle.site/functions/v1/send-web-push%'")
          test "$new" = t
          echo "DISPATCH=OVH_VERIFIED"
          REMOTE
