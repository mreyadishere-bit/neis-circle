const schemaSQL=`-- Run in Supabase SQL Editor
create table profiles (id uuid primary key references auth.users on delete cascade, full_name text, username text unique, grade text, campus text, bio text, interests text[], created_at timestamptz default now());
create table posts (id bigint generated by default as identity primary key, author_id uuid references profiles(id) on delete cascade, kind text not null, title text not null, body text not null, tags text[], created_at timestamptz default now());
create table comments (id bigint generated by default as identity primary key, post_id bigint references posts(id) on delete cascade, author_id uuid references profiles(id) on delete cascade, body text not null, created_at timestamptz default now());
create table messages (id bigint generated by default as identity primary key, sender_id uuid references profiles(id), receiver_id uuid references profiles(id), body text not null, created_at timestamptz default now());
alter table profiles enable row level security; alter table posts enable row level security; alter table comments enable row level security; alter table messages enable row level security;
create policy "members read profiles" on profiles for select to authenticated using (true);
create policy "users update own profile" on profiles for all to authenticated using (auth.uid()=id) with check (auth.uid()=id);
create policy "members read posts" on posts for select to authenticated using (true);
create policy "users create posts" on posts for insert to authenticated with check (auth.uid()=author_id);
create policy "authors manage posts" on posts for update to authenticated using (auth.uid()=author_id);
create policy "authors delete posts" on posts for delete to authenticated using (auth.uid()=author_id);
create policy "members read comments" on comments for select to authenticated using (true);
create policy "users create comments" on comments for insert to authenticated with check (auth.uid()=author_id);
create policy "private messages" on messages for select to authenticated using (auth.uid()=sender_id or auth.uid()=receiver_id);
create policy "send messages" on messages for insert to authenticated with check (auth.uid()=sender_id);`;
function setup(){
  openModal(`<div class="modal-head"><div><h2>Connect the live platform</h2><p>Public project values are safe here. Keep Google Client Secret only in Supabase.</p></div><button class="close" data-close>×</button></div><div class="row"><label class="field">Supabase project URL<input id="sbUrl" placeholder="https://xxxx.supabase.co" value="${esc(localStorage.getItem("neis-sb-url")||window.NEIS_CONFIG.supabaseUrl)}"></label><label class="field">Supabase anon key<input id="sbKey" placeholder="eyJhbGci…" value="${esc(localStorage.getItem("neis-sb-key")||window.NEIS_CONFIG.supabaseAnonKey)}"></label></div><label class="field">Allowed school email domain (optional)<input id="sbDomain" placeholder="students.neis.edu" value="${esc(localStorage.getItem("neis-domain")||window.NEIS_CONFIG.allowedEmailDomain)}"></label><div class="module-card" style="margin-top:14px"><b>1. Create the database tables and security rules</b><p>Open Supabase → SQL Editor → paste the prepared schema.</p><button class="secondary" type="button" id="copySql" style="margin-top:12px">Copy secure SQL schema</button></div><div class="module-card" style="margin-top:12px"><b>2. Enable Google</b><p>Supabase → Authentication → Providers → Google. Put the Client ID and Client Secret there, never in this file.</p><button class="secondary" type="button" id="googleAuth" style="margin-top:12px" ${sb?"":"disabled"}>Continue with Google</button></div><div class="modal-actions"><button class="secondary" type="button" data-close>Cancel</button><button class="primary" id="saveConnection">Save & test connection</button></div>`,true);

function safeRich(html){const t=document.createElement("template");t.innerHTML=String(html||"");const allowed=new Set(["P","BR","STRONG","B","EM","I","U","S","H2","H3","H4","UL","OL","LI","BLOCKQUOTE","A","DIV","SPAN"]);[...t.content.querySelectorAll("*")].forEach(el=>{if(!allowed.has(el.tagName)){el.replaceWith(...el.childNodes);return}[...el.attributes].forEach(a=>{if(a.name==="href"&&el.tagName==="A"){if(!/^https?:\/\//i.test(a.value))el.removeAttribute(a.name)}else if(a.name==="dir"&&(a.value==="rtl"||a.value==="ltr")){}else if(a.name==="style"&&/^(text-align:\s*(left|right|center);?)$/i.test(a.value)){}else el.removeAttribute(a.name)})});return t.innerHTML}

function articleCard(a){const ar=state.articleLanguage==="ar",title=(ar?a.title_ar:a.title_en)||a.title_en||a.title_ar||"Untitled",excerpt=(ar?a.excerpt_ar:a.excerpt_en)||a.excerpt_en||a.excerpt_ar||"";return `<article class="article-card"><div class="article-cover" style="background-image:${a.cover_url?`url('${esc(a.cover_url)}')`:mediaCardPlaceholder(title)}"></div><div class="article-copy"><div class="article-meta"><span class="post-kind">${a.status==="published"?"Article":"Draft"}</span><span>${formatDate(a.published_at||a.created_at)}</span></div><h3>${esc(title)}</h3><p>${esc(excerpt)}</p><button class="author-link" data-author="${a.author_id}">${avatar({name:authorName(a.author),initials:initials(authorName(a.author)),color:"#006f5b"})}<span>${esc(authorName(a.author))}<small style="display:block;color:var(--muted)">${esc(authorMeta(a.author))}</small></span></button><div class="article-actions"><button class="primary" data-read-article="${a.id}">Read article</button>${(isMine(a)||state.isAdmin)?`<button class="secondary" data-edit-article="${a.id}">Edit</button>`:""}</div></div></article>`}
function galleryCard(g){const cap=(state.lang==="ar"?g.caption_ar:g.caption_en)||g.caption_en||g.caption_ar||"Community moment";return `<article class="gallery-card"><img src="${esc(g.image_url)}" alt="${esc(cap)}" loading="lazy"><div class="gallery-tools">${g.featured?`<span class="status-pill live">Featured</span>`:""}${state.isAdmin&&!g.approved?`<button data-approve-gallery="${g.id}">Approve</button>`:""}${state.isAdmin?`<button data-feature-gallery="${g.id}">${g.featured?"Unfeature":"Feature"}</button>`:""}</div><div class="gallery-copy"><div class="tag-row">${(g.tags||[]).slice(0,3).map(t=>`<span>#${esc(t)}</span>`).join("")}</div><h3>${esc(cap)}</h3><p>${esc(authorName(g.author))} · ${esc(authorMeta(g.author))}</p></div></article>`}

home=function(){let posts=state.posts.filter(p=>!state.query||(`${p.title} ${p.body} ${(p.tags||[]).join(" ")}`).toLowerCase().includes(state.query.toLowerCase()));if(state.filter==="Questions")posts=posts.filter(p=>p.kind==="Question");if(state.filter==="Resources")posts=posts.filter(p=>p.kind==="Resource");const latest=(state.articles.length?state.articles:NEIS_ARTICLE_SEED).filter(a=>a.status==="published").slice(0,2);return `${setupBanner()}<section class="hero"><div class="hero-main"><p class="kicker"><i></i> ${state.lang==="ar"?`مساء الخير، ${esc(state.profile.name)}.`:`Good evening, ${esc(state.profile.name)}.`}</p><h1>${L[state.lang].hero}</h1><p>${L[state.lang].sub}</p><div style="display:flex;gap:8px;margin-top:20px"><button class="primary" data-nav="gallery">Explore gallery</button><button class="secondary" data-nav="articles">Read articles</button></div></div><div class="hero-side"><div class="pulse"><div><strong>${state.members.length||128}</strong><small>students in the network</small></div><span class="pulse-orb"></span></div><div class="profile-meter"><div class="meter-row"><b>Your identity</b><strong>${state.profile.grade||"Student"}</strong></div><small>${esc(state.profile.branch||"Choose your branch")}</small><div class="bar"><i style="width:${state.profile.branch?"100":"55"}%"></i></div></div></div></section>
${latest.length?`<section style="margin-bottom:22px"><div class="page-title" style="margin-bottom:14px"><div><p class="kicker"><i></i>Editorial</p><h2>Latest articles</h2></div><button class="secondary" data-nav="articles">View all</button></div><div class="article-grid">${latest.map(articleCard).join("")}</div></section>`:""}
<div class="dashboard"><div class="main-column"><div class="composer-bar">${avatar({initials:initials(state.profile.name),color:"#7056d8"})}<button data-action="compose">${L[state.lang].compose}</button><button class="compose" data-action="compose">+</button></div><div class="tabs">${[L[state.lang].forYou,L[state.lang].latest,L[state.lang].questions,L[state.lang].resources].map((x,i)=>`<button class="${state.filter===["For you","Latest","Questions","Resources"][i]?"active":""}" data-filter="${["For you","Latest","Questions","Resources"][i]}">${x}</button>`).join("")}</div><div class="feed">${posts.length?posts.map(postCard).join(""):`<div class="empty"><b>No conversations yet</b><span>Start the first useful one.</span></div>`}</div></div>

discover=function(){let q=state.query.toLowerCase();const base=state.members.length?state.members.map(m=>({name:m.full_name||"Student",initials:initials(m.full_name),color:"#7056d8",grade:m.grade||"Student",branch:m.branch||"NEIS",interests:(m.interests||[]).join(" · ")||"Learning · Community"})):seed.people.map((p,i)=>({...p,branch:i%2?"Sadat Branch":"Main Branch"}));let people=base.filter(p=>!q||(`${p.name} ${p.grade} ${p.branch} ${p.interests}`).toLowerCase().includes(q));return `${setupBanner()}${pageTitle("Discover people","Find students by grade, branch, interests and skills.")}<div class="grid-3">${people.map(p=>`<article class="module-card">${avatar(p,true)}<h3>${esc(p.name)}</h3><div class="identity-line"><span class="post-kind">${esc(p.grade)}</span><span class="branch-tag">${esc(p.branch)}</span></div><p>${esc(p.interests)}</p><button class="primary" data-follow="${esc(p.name)}">${state.following.includes(p.name)?"Following ✓":"Follow student"}</button></article>`).join("")}</div>`};

gallery=function(){let items=(state.gallery.length?state.gallery:NEIS_GALLERY_SEED).filter(g=>g.approved||isMine(g)||state.isAdmin);if(state.galleryFilter==="Featured")items=items.filter(g=>g.featured);if(state.galleryFilter==="Mine")items=items.filter(isMine);return `${pageTitle("Community gallery","Projects, events, art and memorable moments—shared by students.",`<button class="primary" data-action="new-gallery">+ Add to gallery</button>`)}<div class="tabs">${["All","Featured","Mine"].map(x=>`<button class="${state.galleryFilter===x?"active":""}" data-gallery-filter="${x}">${x}</button>`).join("")}</div><div class="gallery-grid" style="margin-top:18px">${items.length?items.map(galleryCard).join(""):`<div class="empty"><b>The gallery is ready for its first story</b><span>Upload a meaningful photo with context—not just another image.</span></div>`}</div>`}
articles=function(){let items=(state.articles.length?state.articles:NEIS_ARTICLE_SEED).filter(a=>a.status==="published"||isMine(a)||state.isAdmin);if(state.articleAuthor)items=items.filter(a=>a.author_id===state.articleAuthor);if(state.articleSearch)items=items.filter(a=>`${a.title_en} ${a.title_ar} ${a.excerpt_en} ${a.excerpt_ar}`.toLowerCase().includes(state.articleSearch.toLowerCase()));return `${pageTitle(state.articleAuthor?"Articles by this writer":"Student journal","Long-form ideas, guides, experiences and student perspectives.",`<button class="primary" data-action="new-article">+ Write article</button>`)}<div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px"><label class="search" style="margin:0;max-width:360px"><svg><use href="#i-search"/></svg><input id="articleSearch" placeholder="Search articles…" value="${esc(state.articleSearch)}"></label><div class="tabs" style="margin:0"><button class="${state.articleLanguage==="en"?"active":""}" data-article-lang="en">English</button><button class="${state.articleLanguage==="ar"?"active":""}" data-article-lang="ar">العربية</button>${state.articleAuthor?`<button data-clear-author>All writers ×</button>`:""}</div></div><div class="article-grid">${items.length?items.map(articleCard).join(""):`<div class="empty"><b>No articles match</b><span>Try another search or publish the first article.</span></div>`}</div>`}

admin=function(){if(!state.isAdmin)return `<div class="empty"><b>Private workspace</b><span>This area is available only to the platform administrator.</span></div>`;const pending=state.gallery.filter(x=>!x.approved);const drafts=state.articles.filter(x=>x.status!=="published");return `<section class="admin-hero"><div class="admin-banner"><span class="badge-admin">Admin only</span><h1>Your private control room.</h1><p style="opacity:.76;max-width:600px">Moderate submissions, manage editorial quality and keep technical settings away from student accounts.</p><div style="display:flex;gap:8px;margin-top:20px"><button class="primary" data-action="new-article">Write article</button><button class="secondary" data-action="new-gallery">Add gallery item</button></div></div><div class="stat-grid"><div class="stat"><strong>${state.members.length}</strong><small>Profiles</small></div><div class="stat"><strong>${state.posts.length}</strong><small>Posts</small></div><div class="stat"><strong>${state.articles.length}</strong><small>Articles</small></div><div class="stat"><strong>${pending.length}</strong><small>Pending gallery</small></div></div></section>
<section class="module-card" style="margin-top:18px"><div class="page-title"><div><h2>Moderation queue</h2><p>Only you can see and approve pending gallery submissions.</p></div><button class="secondary" data-action="admin-connection">Technical settings</button></div>${pending.length?`<table class="admin-table"><thead><tr><th>Preview</th><th>Student</th><th>Caption</th><th>Action</th></tr></thead><tbody>${pending.map(g=>`<tr><td><img src="${esc(g.image_url)}" style="width:60px;height:45px;object-fit:cover;border-radius:9px"></td><td>${esc(authorName(g.author))}</td><td>${esc(g.caption_en||g.caption_ar||"")}</td><td><button class="primary" data-approve-gallery="${g.id}">Approve</button></td></tr>`).join("")}</tbody></table>`:`<div class="empty"><b>Queue cleared</b><span>No gallery submissions are waiting.</span></div>`}</section>
<section class="module-card" style="margin-top:18px"><h2>Members & branches</h2><table class="admin-table"><thead><tr><th>Name</th><th>Grade</th><th>Branch</th><th>Access</th></tr></thead><tbody>${state.members.slice(0,12).map(m=>`<tr><td>${esc(m.full_name||"Student")}</td><td>${esc(m.grade||"—")}</td><td><span class="branch-tag">${esc(m.branch||"Not set")}</span></td><td>${m.role==="admin"?`<span class="badge-admin">Administrator</span>`:`<span class="status-pill">Student</span>`}</td></tr>`).join("")}</tbody></table></section>
${drafts.length?`<section class="module-card" style="margin-top:18px"><h2>Draft articles</h2><div class="article-grid" style="margin-top:14px">${drafts.map(articleCard).join("")}</div></section>`:""}`}

render=function(){document.body.classList.toggle("is-admin",state.isAdmin);if(state.view==="admin"&&!state.isAdmin)state.view="home";const V={home,discover,circles,messages,library,opportunities,gallery,articles,admin};$("#view").innerHTML=(V[state.view]||home)();const av=initials(state.profile.name);if($("#topAvatar"))$("#topAvatar").textContent=av;if($("#railAvatar"))$("#railAvatar").textContent=av;$$('[data-nav]').forEach(b=>b.classList.toggle("active",b.dataset.nav===state.view));bindDynamic()};

bindDynamic=function(){NEIS_BASE_BIND();$$('[data-gallery-filter]').forEach(b=>b.onclick=()=>{state.galleryFilter=b.dataset.galleryFilter;render()});$$('[data-article-lang]').forEach(b=>b.onclick=()=>{state.articleLanguage=b.dataset.articleLang;render()});$$('[data-read-article]').forEach(b=>b.onclick=()=>readArticle(b.dataset.readArticle));$$('[data-edit-article]').forEach(b=>b.onclick=()=>openArticleEditor((state.articles.length?state.articles:NEIS_ARTICLE_SEED).find(x=>String(x.id)===b.dataset.editArticle)));$$('[data-author]').forEach(b=>b.onclick=()=>{state.articleAuthor=b.dataset.author;nav("articles")});$$('[data-clear-author]').forEach(b=>b.onclick=()=>{state.articleAuthor="";render()});$$('[data-approve-gallery]').forEach(b=>b.onclick=()=>moderateGallery(b.dataset.approveGallery,{approved:true}));$$('[data-feature-gallery]').forEach(b=>b.onclick=()=>{const g=state.gallery.find(x=>String(x.id)===b.dataset.featureGallery);moderateGallery(b.dataset.featureGallery,{featured:!g?.featured})});const as=$("#articleSearch");if(as)as.oninput=e=>{state.articleSearch=e.target.value;render()}}

function readArticle(id){const a=(state.articles.length?state.articles:NEIS_ARTICLE_SEED).find(x=>String(x.id)===String(id));if(!a)return;const ar=state.articleLanguage==="ar",title=(ar?a.title_ar:a.title_en)||a.title_en||a.title_ar,body=safeRich((ar?a.content_ar:a.content_en)||a.content_en||a.content_ar);openModal(`<article class="reader" dir="${ar?"rtl":"ltr"}">${a.cover_url?`<img class="reader-cover" src="${esc(a.cover_url)}" alt="${esc(title)}">`:""}<div class="article-meta" style="margin-top:18px"><span class="post-kind">${ar?"مقال":"Article"}</span><span>${formatDate(a.published_at||a.created_at)}</span></div><h1>${esc(title)}</h1><button class="author-link" data-author="${a.author_id}">${avatar({name:authorName(a.author),initials:initials(authorName(a.author)),color:"#006f5b"},true)}<span>${esc(authorName(a.author))}<small style="display:block;color:var(--muted)">${esc(authorMeta(a.author))}</small></span></button><div class="reader-body">${body}</div><div class="modal-actions"><button class="secondary" data-close>Close</button>${(isMine(a)||state.isAdmin)?`<button class="primary" data-edit-article="${a.id}">Edit article</button>`:""}</div></article>`,true);$$('[data-author]').forEach(b=>b.onclick=()=>{state.articleAuthor=b.dataset.author;closeModal();nav("articles")});$$('[data-edit-article]').forEach(b=>b.onclick=()=>openArticleEditor(a))}

function editorToolbar(target){return `<div class="editor-toolbar" data-editor="${target}"><select data-block><option value="p">Paragraph</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option><option value="blockquote">Quote</option></select><button type="button" data-cmd="bold"><b>B</b></button><button type="button" data-cmd="italic"><i>I</i></button><button type="button" data-cmd="underline"><u>U</u></button><button type="button" data-cmd="insertUnorderedList">• List</button><button type="button" data-cmd="insertOrderedList">1. List</button><button type="button" data-cmd="justifyLeft">Left</button><button type="button" data-cmd="justifyCenter">Center</button><button type="button" data-cmd="justifyRight">Right</button><button type="button" data-dir="ltr">LTR</button><button type="button" data-dir="rtl">RTL</button><button type="button" data-link>Link</button><button type="button" data-cmd="undo">↶</button><button type="button" data-cmd="removeFormat">Clear</button></div>`}
function openArticleEditor(a=null){if(!requireAccount())return;const editing=!!a,canEdit=!a||isMine(a)||state.isAdmin;if(!canEdit){toast("You cannot edit this article");return}openModal(`<div class="modal-head"><div><p class="kicker"><i></i>Student journal</p><h2>${editing?"Edit article":"Write a complete article"}</h2><p>Write in English, Arabic, or both. Preview before publishing.</p></div><button class="close" data-close>×</button></div><input type="hidden" id="articleId" value="${a?.id||""}"><div class="row"><label class="field">English title<input id="articleTitleEn" maxlength="180" value="${esc(a?.title_en||"")}" placeholder="Clear, valuable title"></label><label class="field">العنوان العربي<input id="articleTitleAr" maxlength="180" dir="rtl" value="${esc(a?.title_ar||"")}" placeholder="عنوان واضح ومفيد"></label></div><div class="row"><label class="field">English excerpt<textarea id="articleExcerptEn" rows="3">${esc(a?.excerpt_en||"")}</textarea></label><label class="field">الملخص العربي<textarea id="articleExcerptAr" dir="rtl" rows="3">${esc(a?.excerpt_ar||"")}</textarea></label></div><label class="field">Cover image<input id="articleCover" type="file" accept="image/*"></label>${a?.cover_url?`<img id="articleCoverPreview" class="upload-preview" src="${esc(a.cover_url)}">`:`<img id="articleCoverPreview" class="upload-preview hidden">`}<div class="editor-tabs"><button class="active" data-editor-tab="en">English editor</button><button data-editor-tab="ar">المحرر العربي</button></div><div class="editor-pane active" data-editor-pane="en"><div class="editor-shell">${editorToolbar("articleEditorEn")}<div id="articleEditorEn" class="rich-editor" contenteditable="true" data-placeholder="Write your English article…">${safeRich(a?.content_en||"")}</div></div></div><div class="editor-pane" data-editor-pane="ar"><div class="editor-shell" dir="rtl">${editorToolbar("articleEditorAr")}<div id="articleEditorAr" class="rich-editor" contenteditable="true" data-placeholder="اكتب المقال العربي…">${safeRich(a?.content_ar||"")}</div></div></div><section id="articlePreview" class="module-card hidden" style="margin-top:16px"></section><div class="modal-actions"><button class="secondary" type="button" data-article-preview>Preview</button><button class="secondary" type="button" data-save-article="draft">Save draft</button><button class="primary" type="button" data-save-article="published">Publish article</button></div>`,true);bindArticleEditor()}
function bindArticleEditor(){$$('[data-editor-tab]').forEach(b=>b.onclick=()=>{$$('[data-editor-tab]').forEach(x=>x.classList.toggle("active",x===b));$$('[data-editor-pane]').forEach(x=>x.classList.toggle("active",x.dataset.editorPane===b.dataset.editorTab))});$$('.editor-toolbar').forEach(bar=>{const ed=$("#"+bar.dataset.editor);bar.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{ed.focus();document.execCommand(b.dataset.cmd,false,null)});bar.querySelector('[data-block]').onchange=e=>{ed.focus();document.execCommand("formatBlock",false,e.target.value)};bar.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{ed.dir=b.dataset.dir;ed.focus()});bar.querySelector('[data-link]').onclick=()=>{const u=prompt("Paste a full https:// link");if(u&&/^https?:\/\//i.test(u)){ed.focus();document.execCommand("createLink",false,u)}}});$$('[data-save-article]').forEach(b=>b.onclick=()=>saveArticle(b.dataset.saveArticle));$('[data-article-preview]').onclick=previewArticle;$('#articleCover').onchange=e=>{const f=e.target.files[0];if(f){const p=$('#articleCoverPreview');p.src=URL.createObjectURL(f);p.classList.remove('hidden')}}}
function previewArticle(){const ar=$('[data-editor-tab].active')?.dataset.editorTab==="ar",title=ar?$('#articleTitleAr').value:$('#articleTitleEn').value,body=safeRich(ar?$('#articleEditorAr').innerHTML:$('#articleEditorEn').innerHTML),p=$('#articlePreview');p.classList.remove('hidden');p.dir=ar?'rtl':'ltr';p.innerHTML=`<p class="kicker"><i></i>${ar?'معاينة المقال':'Article preview'}</p><h1 style="font-size:38px;margin:12px 0">${esc(title||'Untitled')}</h1><div class="reader-body">${body||'<p>Start writing to see the preview.</p>'}</div>`;p.scrollIntoView({behavior:'smooth',block:'start'})}
async function saveArticle(status){if(!sb||!authUser){toast("Sign in first");return}const id=$('#articleId').value,title_en=$('#articleTitleEn').value.trim(),title_ar=$('#articleTitleAr').value.trim();if(!title_en&&!title_ar){toast("Add at least one title");return}const existing=state.articles.find(x=>String(x.id)===id),file=$('#articleCover').files[0];let cover_url=existing?.cover_url||"";if(file){cover_url=await uploadMedia(file,"article-covers");if(!cover_url)return}const payload={author_id:authUser.id,title_en,title_ar,excerpt_en:$('#articleExcerptEn').value.trim(),excerpt_ar:$('#articleExcerptAr').value.trim(),content_en:safeRich($('#articleEditorEn').innerHTML),content_ar:safeRich($('#articleEditorAr').innerHTML),cover_url,status,published_at:status==='published'?(existing?.published_at||new Date().toISOString()):null,updated_at:new Date().toISOString()};const q=id?sb.from('articles').update(payload).eq('id',id):sb.from('articles').insert(payload),{error}=await q;if(error){toast(error.message);return}closeModal();await loadLiveData();nav('articles');toast(status==='published'?"Article published":"Draft saved")}

function newGallery(){if(!requireAccount())return;openModal(`<div class="modal-head"><div><p class="kicker"><i></i>Community gallery</p><h2>Share a visual story</h2><p>Use a clear image and explain why the moment matters.</p></div><button class="close" data-close>×</button></div><form id="galleryForm"><label class="field">Image<input id="galleryFile" type="file" accept="image/*" required></label><img id="galleryPreview" class="upload-preview hidden"><div class="row"><label class="field">English caption<textarea id="galleryCaptionEn" rows="4" placeholder="What is happening, and why does it matter?"></textarea></label><label class="field">الوصف العربي<textarea id="galleryCaptionAr" dir="rtl" rows="4" placeholder="ماذا يحدث ولماذا هذه اللحظة مهمة؟"></textarea></label></div><label class="field">Tags<input id="galleryTags" placeholder="Robotics, Art, Event"></label><div class="modal-actions"><button type="button" class="secondary" data-close>Cancel</button><button class="primary">Submit to gallery</button></div></form>`);$('#galleryFile').onchange=e=>{const f=e.target.files[0];if(f){$('#galleryPreview').src=URL.createObjectURL(f);$('#galleryPreview').classList.remove('hidden')}};$('#galleryForm').onsubmit=async e=>{e.preventDefault();const file=$('#galleryFile').files[0];if(!file)return;const image_url=await uploadMedia(file,'gallery');if(!image_url)return;const {error}=await sb.from('gallery_items').insert({author_id:authUser.id,image_url,caption_en:$('#galleryCaptionEn').value.trim(),caption_ar:$('#galleryCaptionAr').value.trim(),tags:$('#galleryTags').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,8),approved:state.isAdmin});if(error){toast(error.message);return}closeModal();await loadLiveData();nav('gallery');toast(state.isAdmin?"Published to gallery":"Submitted for admin approval")}}
async function moderateGallery(id,changes){if(!state.isAdmin)return;const {error}=await sb.from('gallery_items').update(changes).eq('id',id);if(error){toast(error.message);return}await loadLiveData();render();toast("Gallery updated")}

async function uploadMedia(file,folder){if(!sb||!authUser)return "";if(file.size>8*1024*1024){toast("Image must be smaller than 8 MB");return ""}if(!file.type.startsWith('image/')){toast("Choose an image file");return ""}const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').toLowerCase(),path=`${authUser.id}/${folder}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;toast("Uploading image…");const {error}=await sb.storage.from('community-media').upload(path,file,{cacheControl:'3600',upsert:false});if(error){toast(error.message);return ""}return sb.storage.from('community-media').getPublicUrl(path).data.publicUrl}

compose=function(kind="Discussion"){if(!requireAccount())return;openModal(`<div class="modal-head"><div><p class="kicker"><i></i>Create</p><h2>Share with NEIS Circle</h2><p>A strong post combines a clear idea, useful context and an optional visual.</p></div><button class="close" data-close>×</button></div><form id="postFormPlus"><div class="row"><label class="field">Type<select id="postKind"><option ${kind==='Discussion'?'selected':''}>Discussion</option><option ${kind==='Question'?'selected':''}>Question</option><option>Resource</option><option>Experience</option></select></label><label class="field">Circle<select><option>General</option><option>Physics Lab</option><option>Build & Code</option><option>Future Paths</option></select></label></div><label class="field">Title<input id="postTitle" required maxlength="140" placeholder="Make the value clear"></label><label class="field">Details<textarea id="postBody" required rows="7" placeholder="Add context, what you tried, or what others can learn…"></textarea></label><div class="row"><label class="field">Tags<input id="postTags" placeholder="Physics, Grade11, Practical"></label><label class="field">Optional image<input id="postImage" type="file" accept="image/*"></label></div><img id="postImagePreview" class="upload-preview hidden"><div class="modal-actions"><button type="button" class="secondary" data-close>Cancel</button><button class="primary">Publish post</button></div></form>`);$('#postImage').onchange=e=>{const f=e.target.files[0];if(f){$('#postImagePreview').src=URL.createObjectURL(f);$('#postImagePreview').classList.remove('hidden')}};$('#postFormPlus').onsubmit=async e=>{e.preventDefault();const title=$('#postTitle').value.trim(),body=$('#postBody').value.trim(),file=$('#postImage').files[0];let image_url="";if(file){image_url=await uploadMedia(file,'posts');if(!image_url)return}const {error}=await sb.from('posts').insert({author_id:authUser.id,kind:$('#postKind').value,title,body,tags:$('#postTags').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,6),image_url});if(error){toast(error.message);return}closeModal();await loadLiveData();nav('home');toast("Published successfully")}}

profile=function(){const p=state.profile;openModal(`<div class="modal-head"><div><div class="identity-line"><h2>Your profile</h2>${state.isAdmin?`<span class="badge-admin">Administrator</span>`:""}</div><p>Your grade and branch appear beside your name across the platform.</p></div><button class="close" data-close>×</button></div><form id="profileFormPlus"><div class="row"><label class="field">Name<input id="pfName" value="${esc(p.name)}" required></label><label class="field">Username<input id="pfUser" value="${esc(p.username)}" required></label></div><div class="row"><label class="field">Grade<input id="pfGrade" value="${esc(p.grade)}" placeholder="Grade 11"></label><label class="field">Branch<input id="pfBranch" value="${esc(p.branch)}" placeholder="Sadat Branch"></label></div><label class="field">Campus<input id="pfCampus" value="${esc(p.campus)}"></label><label class="field">Bio<textarea id="pfBio" rows="4">${esc(p.bio)}</textarea></label><label class="field">Interests<input id="pfInterests" value="${esc(p.interests)}"></label><div class="modal-actions"><button type="button" class="secondary" data-close>Cancel</button><button class="primary">Save profile</button></div></form>`);$('#profileFormPlus').onsubmit=async e=>{e.preventDefault();const payload={full_name:$('#pfName').value.trim(),username:$('#pfUser').value.trim(),grade:$('#pfGrade').value.trim(),branch:$('#pfBranch').value.trim(),campus:$('#pfCampus').value.trim(),bio:$('#pfBio').value.trim(),interests:$('#pfInterests').value.split(',').map(x=>x.trim()).filter(Boolean)};if(sb&&authUser){const {error}=await sb.from('profiles').update(payload).eq('id',authUser.id);if(error){toast(error.message);return}}state.profile={...state.profile,name:payload.full_name,username:payload.username,grade:payload.grade,branch:payload.branch,campus:payload.campus,bio:payload.bio,interests:payload.interests.join(', ')};save();closeModal();await loadLiveData();render();toast("Profile updated")}}

settings=function(){openModal(`<div class="modal-head"><div><h2>Settings</h2><p>Account, appearance, language and privacy.</p></div><button class="close" data-close>×</button></div><div class="account-menu"><div class="account-row"><div><b>${esc(state.profile.name)}</b><small>${esc(state.profile.grade)} · ${esc(state.profile.branch)}</small></div>${state.isAdmin?`<span class="badge-admin">Admin</span>`:`<span class="status-pill">Student</span>`}</div><button class="account-row" data-setting-plus="theme"><span>Appearance</span><b>${state.theme==='light'?'Light':'Dark'}</b></button><button class="account-row" data-setting-plus="lang"><span>Language</span><b>${state.lang==='en'?'English':'العربية'}</b></button>${state.isAdmin?`<button class="account-row" data-nav="admin"><span>Private admin workspace</span><b>Open →</b></button><button class="account-row" data-action="admin-connection"><span>Technical connection</span><b>Admin only</b></button>`:""}</div><button class="secondary signout" data-action="signout">Sign out of this account</button>`);$('[data-setting-plus=theme]').onclick=()=>{state.theme=state.theme==='light'?'dark':'light';applyPrefs();settings()};$('[data-setting-plus=lang]').onclick=()=>{state.lang=state.lang==='en'?'ar':'en';state.articleLanguage=state.lang;applyPrefs();closeModal();render()};$$('.modal [data-nav]').forEach(b=>b.onclick=()=>{closeModal();nav(b.dataset.nav)})}
setup=function(){if(!state.isAdmin){toast("Technical settings are private to the administrator");return}NEIS_TECH_SETUP()}
async function signOut(){if(sb)await sb.auth.signOut();authUser=null;state.isAdmin=false;state.profile.role='student';state.articles=[];state.gallery=[];state.members=[];closeModal();nav('home');toast("Signed out safely")}

loadLiveData=async function(){if(!sb||!authUser)return;const [postRes,commentRes,reactionRes,bookmarkRes,profileRes,articleRes,galleryRes,memberRes]=await Promise.all([
sb.from('posts').select('id,kind,title,body,tags,image_url,created_at,author_id,profiles!posts_author_id_fkey(full_name,grade,branch,campus)').order('created_at',{ascending:false}),
sb.from('comments').select('post_id'),sb.from('reactions').select('post_id,user_id'),sb.from('bookmarks').select('post_id,user_id').eq('user_id',authUser.id),
sb.from('profiles').select('full_name,username,grade,branch,campus,bio,interests,role').eq('id',authUser.id).maybeSingle(),
sb.from('articles').select('*,author:profiles!articles_author_id_fkey(full_name,username,grade,branch)').order('created_at',{ascending:false}),
sb.from('gallery_items').select('*,author:profiles!gallery_items_author_id_fkey(full_name,username,grade,branch)').order('created_at',{ascending:false}),
sb.from('profiles').select('id,full_name,username,grade,branch,interests,role').order('full_name')]);
if(profileRes.data){const p=profileRes.data;state.isAdmin=p.role==='admin'||authUser.id===NEIS_ADMIN_ID;state.profile={name:p.full_name||authUser.user_metadata?.full_name||'Student',username:p.username||'',grade:p.grade||(state.isAdmin?'Grade 11':''),branch:p.branch||(state.isAdmin?'Sadat Branch':''),campus:p.campus||'',bio:p.bio||'',interests:(p.interests||[]).join(', '),role:state.isAdmin?'admin':'student'}}else{state.isAdmin=authUser.id===NEIS_ADMIN_ID;if(state.isAdmin)state.profile={...state.profile,name:authUser.user_metadata?.full_name||state.profile.name||'Eyad Ahmed',grade:'Grade 11',branch:'Sadat Branch',role:'admin'}}
if(!postRes.error){const cc={},rc={};(commentRes.data||[]).forEach(x=>cc[x.post_id]=(cc[x.post_id]||0)+1);(reactionRes.data||[]).forEach(x=>rc[x.post_id]=(rc[x.post_id]||0)+1);state.posts=(postRes.data||[]).map(p=>{const n=p.profiles?.full_name||'NEIS Student';return {id:p.id,user:n,initials:initials(n),color:'#006f5b',meta:[p.profiles?.grade,p.profiles?.branch,p.profiles?.campus].filter(Boolean).join(' · ')||'NEIS Circle',time:formatDate(p.created_at),kind:p.kind,title:p.title,body:p.body,tags:p.tags||[],image_url:p.image_url||'',likes:rc[p.id]||0,comments:cc[p.id]||0}});state.liked=(reactionRes.data||[]).filter(x=>x.user_id===authUser.id).map(x=>x.post_id);state.saved=(bookmarkRes.data||[]).map(x=>x.post_id)}
if(!articleRes.error)state.articles=articleRes.data||[];if(!galleryRes.error)state.gallery=galleryRes.data||[];if(!memberRes.error)state.members=memberRes.data||[];if(!state.members.length&&state.profile.name)state.members=[{id:authUser.id,full_name:state.profile.name,username:state.profile.username,grade:state.profile.grade,branch:state.profile.branch,interests:state.profile.interests?state.profile.interests.split(',').map(x=>x.trim()).filter(Boolean):[],role:state.isAdmin?'admin':'student'}];state.platformReady=true;save();document.body.classList.toggle('is-admin',state.isAdmin);
if(!neisRealtimeReady){if(realtimeChannel)await sb.removeChannel(realtimeChannel);realtimeChannel=sb.channel('neis-platform-v3').on('postgres_changes',{event:'*',schema:'public',table:'posts'},async()=>{await loadLiveData();render()}).on('postgres_changes',{event:'*',schema:'public',table:'articles'},async()=>{await loadLiveData();render()}).on('postgres_changes',{event:'*',schema:'public',table:'gallery_items'},async()=>{await loadLiveData();render()}).subscribe();neisRealtimeReady=true}}

document.addEventListener('click',async e=>{const a=e.target.closest('[data-action]');if(a){const x=a.dataset.action;if(x==='signout')await signOut();if(x==='new-article')openArticleEditor();if(x==='new-gallery')newGallery();if(x==='admin-connection')setup()}},true);

async function neisEnhanceInit(){if(sb){const {data}=await sb.auth.getSession();authUser=data.session?.user||null;if(authUser)await loadLiveData()}render()}
neisEnhanceInit();
</script>
</body>
</html>
