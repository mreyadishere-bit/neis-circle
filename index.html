const schemaSQL=`-- Run in Supabase SQL Editor
create table profiles (id uuid primary key references auth.users on delete cascade, full_name text, username text unique, grade text, campus text, bio text, interests text[], created_at timestamptz default now());
create table posts (id bigint generated by default as identity primary key, author_id uuid references profiles(id) on delete cascade, kind text not null, title text not null, body text not null, tags text[], created_at timestamptz default now());
create table comments (id bigint generated by default as identity primary key, post_id bigint references posts(id) on delete cascade, author_id uuid references profiles(id) on delete cascade, body text not null, created_at timestamptz default now());
create table messages (id bigint generated by default as identity primary key, sender_id uuid references profiles(id), receiver_id uuid references profiles(id), body text not null, created_at timestamptz default now());
alter table profiles enable row level security; alter table posts enable row level security; alter table comments enable row level security; alter table messages enable row level security;
create policy "members read profiles" on profiles for select to authenticated using (true);
create policy "users update own profile" on profiles for all to authenticated using (auth.uid()=id) with check (auth.uid()=id);
create policy "members read posts" on posts for select to authenticated using (true);
create policy "users create posts" on posts for insert to authenticated with check (auth.uid()=author_id);
create policy "authors manage posts" on posts for update to authenticated using (auth.uid()=author_id);
create policy "authors delete posts" on posts for delete to authenticated using (auth.uid()=author_id);
create policy "members read comments" on comments for select to authenticated using (true);
create policy "users create comments" on comments for insert to authenticated with check (auth.uid()=author_id);
create policy "private messages" on messages for select to authenticated using (auth.uid()=sender_id or auth.uid()=receiver_id);
create policy "send messages" on messages for insert to authenticated with check (auth.uid()=sender_id);`;

  <h3>${esc(p.title)}</h3><p>${esc(p.body)}</p>${p.image_url?`<img class="upload-preview" style="margin-top:15px" src="${esc(p.image_url)}" alt="${esc(p.title)}">`:""}<div class="tag-row">${(p.tags||[]).map(t=>`<span>#${esc(t)}</span>`).join("")}</div>
  <div class="post-actions"><button class="action ${liked?"active":""}" data-action="like" data-id="${p.id}">${icon("heart")}<span>Helpful</span><b>${p.likes+(liked?1:0)}</b></button><button class="action" data-action="comments" data-id="${p.id}">${icon("chat")}<span>Replies</span><b>${p.comments}</b></button><button class="action save ${saved?"active":""}" data-action="save" data-id="${p.id}">${icon("save")}<span>${saved?"Saved":"Save"}</span></button><button class="action" data-action="share" data-id="${p.id}">${icon("share")}<span>Share</span></button></div>
</article>`};

function articleCard(a){const ar=state.articleLanguage==="ar",title=(ar?a.title_ar:a.title_en)||a.title_en||a.title_ar||"Untitled",excerpt=(ar?a.excerpt_ar:a.excerpt_en)||a.excerpt_en||a.excerpt_ar||"",editable=!String(a.id).startsWith('demo-')&&(isMine(a)||state.isAdmin);return `<article class="article-card"><div class="article-cover" style="background-image:${a.cover_url?`url('${esc(a.cover_url)}')`:mediaCardPlaceholder(title)}"></div><div class="article-copy"><div class="article-meta"><span class="post-kind">${a.status==="published"?"Article":"Draft"}</span><span>${formatDate(a.published_at||a.created_at)}</span></div><h3>${esc(title)}</h3><p>${esc(excerpt)}</p><button class="author-link" data-author="${a.author_id}">${avatar({name:authorName(a.author),initials:initials(authorName(a.author)),color:"#006f5b"})}<span>${esc(authorName(a.author))}<small style="display:block;color:var(--muted)">${esc(authorMeta(a.author))}</small></span></button><div class="article-actions"><button class="primary" data-read-article="${a.id}">Read article</button>${editable?`<button class="secondary" data-edit-article="${a.id}">Edit</button>`:""}</div></div></article>`}
function galleryCard(g){const cap=(state.lang==="ar"?g.caption_ar:g.caption_en)||g.caption_en||g.caption_ar||"Community moment";return `<article class="gallery-card"><img src="${esc(g.image_url)}" alt="${esc(cap)}" loading="lazy"><div class="gallery-tools">${g.featured?`<span class="status-pill live">Featured</span>`:""}${state.isAdmin&&!g.approved?`<button data-approve-gallery="${g.id}">Approve</button>`:""}${state.isAdmin?`<button data-feature-gallery="${g.id}">${g.featured?"Unfeature":"Feature"}</button>`:""}</div><div class="gallery-copy"><div class="tag-row">${(g.tags||[]).slice(0,3).map(t=>`<span>#${esc(t)}</span>`).join("")}</div><h3>${esc(cap)}</h3><p>${esc(authorName(g.author))} · ${esc(authorMeta(g.author))}</p></div></article>`}

home=function(){let posts=state.posts.filter(p=>!state.query||(`${p.title} ${p.body} ${(p.tags||[]).join(" ")}`).toLowerCase().includes(state.query.toLowerCase()));if(state.filter==="Questions")posts=posts.filter(p=>p.kind==="Question");if(state.filter==="Resources")posts=posts.filter(p=>p.kind==="Resource");const latest=state.articles.filter(a=>a.status==="published").slice(0,2);return `${setupBanner()}<section class="hero"><div class="hero-main"><p class="kicker"><i></i> ${state.lang==="ar"?`مساء الخير، ${esc(state.profile.name)}.`:`Good evening, ${esc(state.profile.name)}.`}</p><h1>${L[state.lang].hero}</h1><p>${L[state.lang].sub}</p><div style="display:flex;gap:8px;margin-top:20px"><button class="primary" data-nav="gallery">Explore gallery</button><button class="secondary" data-nav="articles">Read articles</button></div></div><div class="hero-side"><div class="pulse"><div><strong>${state.members.length}</strong><small>students in the network</small></div><span class="pulse-orb"></span></div><div class="profile-meter"><div class="meter-row"><b>Your identity</b><strong>${state.profile.grade||"Student"}</strong></div><small>${esc(state.profile.branch||"Choose your branch")}</small><div class="bar"><i style="width:${state.profile.branch?"100":"55"}%"></i></div></div></div></section>
${latest.length?`<section style="margin-bottom:22px"><div class="page-title" style="margin-bottom:14px"><div><p class="kicker"><i></i>Editorial</p><h2>Latest articles</h2></div><button class="secondary" data-nav="articles">View all</button></div><div class="article-grid">${latest.map(articleCard).join("")}</div></section>`:""}
<div class="dashboard"><div class="main-column"><div class="composer-bar">${avatar({initials:initials(state.profile.name),color:"#7056d8"})}<button data-action="compose">${L[state.lang].compose}</button><button class="compose" data-action="compose">+</button></div><div class="tabs">${[L[state.lang].forYou,L[state.lang].latest,L[state.lang].questions,L[state.lang].resources].map((x,i)=>`<button class="${state.filter===["For you","Latest","Questions","Resources"][i]?"active":""}" data-filter="${["For you","Latest","Questions","Resources"][i]}">${x}</button>`).join("")}</div><div class="feed">${posts.length?posts.map(postCard).join(""):`<div class="empty"><b>No conversations yet</b><span>Start the first useful one.</span></div>`}</div></div>
<aside class="side-column"><section class="side-card"><h3>${state.isAdmin?"Admin workspace":L[state.lang].people}</h3>${state.isAdmin?`<div class="account-row"><div><b>Platform controls</b><small>Moderation and publishing</small></div><button class="primary" data-nav="admin">Open</button></div>`:seed.people.slice(0,3).map(p=>`<div class="person">${avatar(p)}<div><b>${p.name}</b><small>${p.grade} · ${p.interests.split(" · ")[0]}</small></div><button data-follow="${p.name}">${state.following.includes(p.name)?"✓":"+"}</button></div>`).join("")}</section><section class="side-card"><h3>Creative spaces</h3><div class="account-menu"><button class="account-row" data-nav="gallery"><span>Community gallery</span><b>→</b></button><button class="account-row" data-nav="articles"><span>Student journal</span><b>→</b></button></div></section></aside></div>`};

discover=function(){let q=state.query.toLowerCase();const base=state.members.length?state.members.map(m=>({name:m.full_name||"Student",initials:initials(m.full_name),color:"#7056d8",grade:m.grade||"Student",branch:m.branch||"NEIS",interests:(m.interests||[]).join(" · ")||"Learning · Community"})):seed.people.map((p,i)=>({...p,branch:i%2?"Sadat Branch":"Main Branch"}));let people=base.filter(p=>!q||(`${p.name} ${p.grade} ${p.branch} ${p.interests}`).toLowerCase().includes(q));return `${setupBanner()}${pageTitle("Discover people","Find students by grade, branch, interests and skills.")}<div class="grid-3">${people.map(p=>`<article class="module-card">${avatar(p,true)}<h3>${esc(p.name)}</h3><div class="identity-line"><span class="post-kind">${esc(p.grade)}</span><span class="branch-tag">${esc(p.branch)}</span></div><p>${esc(p.interests)}</p><button class="primary" data-follow="${esc(p.name)}">${state.following.includes(p.name)?"Following ✓":"Follow student"}</button></article>`).join("")}</div>`};

gallery=function(){let items=(state.gallery.length?state.gallery:NEIS_GALLERY_SEED).filter(g=>g.approved||isMine(g)||state.isAdmin);if(state.galleryFilter==="Featured")items=items.filter(g=>g.featured);if(state.galleryFilter==="Mine")items=items.filter(isMine);return `${pageTitle("Community gallery","Projects, events, art and memorable moments—shared by students.",`<button class="primary" data-action="new-gallery">+ Add to gallery</button>`)}<div class="tabs">${["All","Featured","Mine"].map(x=>`<button class="${state.galleryFilter===x?"active":""}" data-gallery-filter="${x}">${x}</button>`).join("")}</div><div class="gallery-grid" style="margin-top:18px">${items.length?items.map(galleryCard).join(""):`<div class="empty"><b>The gallery is ready for its first story</b><span>Upload a meaningful photo with context—not just another image.</span></div>`}</div>`}
articles=function(){let items=state.articles.filter(a=>a.status==="published"||isMine(a)||state.isAdmin);if(state.articleAuthor)items=items.filter(a=>a.author_id===state.articleAuthor);if(state.articleSearch)items=items.filter(a=>`${a.title_en} ${a.title_ar} ${a.excerpt_en} ${a.excerpt_ar}`.toLowerCase().includes(state.articleSearch.toLowerCase()));if(state.query){const q=state.query.toLowerCase();items=items.filter(a=>`${a.title_en} ${a.title_ar} ${a.excerpt_en} ${a.excerpt_ar} ${a.body_en||''} ${a.body_ar||''} ${authorName(a.author)}`.toLowerCase().includes(q))}return `${pageTitle(state.articleAuthor?"Articles by this writer":"Student journal","Long-form ideas, guides, experiences and student perspectives.",`<button class="primary" data-action="new-article">+ Write article</button>`)}<div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px"><label class="search" style="margin:0;max-width:360px"><svg><use href="#i-search"/></svg><input id="articleSearch" placeholder="Search articles…" value="${esc(state.articleSearch)}"></label><div class="tabs" style="margin:0"><button class="${state.articleLanguage==="en"?"active":""}" data-article-lang="en">English</button><button class="${state.articleLanguage==="ar"?"active":""}" data-article-lang="ar">العربية</button>${state.articleAuthor?`<button data-clear-author>All writers ×</button>`:""}</div></div><div class="article-grid">${items.length?items.map(articleCard).join(""):`<div class="empty"><b>No articles yet</b><span>Publish the first complete student article.</span></div>`}</div>`}

admin=function(){if(!state.isAdmin)return `<div class="empty"><b>Private workspace</b><span>This area is available only to the platform administrator.</span></div>`;const pending=state.gallery.filter(x=>!x.approved);const drafts=state.articles.filter(x=>x.status!=="published");return `<section class="admin-hero"><div class="admin-banner"><span class="badge-admin">Admin only</span><h1>Your private control room.</h1><p style="opacity:.76;max-width:600px">Moderate submissions, manage editorial quality and keep technical settings away from student accounts.</p><div style="display:flex;gap:8px;margin-top:20px"><button class="primary" data-action="new-article">Write article</button><button class="secondary" data-action="new-gallery">Add gallery item</button></div></div><div class="stat-grid"><div class="stat"><strong>${state.members.length}</strong><small>Profiles</small></div><div class="stat"><strong>${state.posts.length}</strong><small>Posts</small></div><div class="stat"><strong>${state.articles.length}</strong><small>Articles</small></div><div class="stat"><strong>${pending.length}</strong><small>Pending gallery</small></div></div></section>
<section class="module-card" style="margin-top:18px"><div class="page-title"><div><h2>Moderation queue</h2><p>Only you can see and approve pending gallery submissions.</p></div><button class="secondary" data-action="admin-connection">Technical settings</button></div>${pending.length?`<table class="admin-table"><thead><tr><th>Preview</th><th>Student</th><th>Caption</th><th>Action</th></tr></thead><tbody>${pending.map(g=>`<tr><td><img src="${esc(g.image_url)}" style="width:60px;height:45px;object-fit:cover;border-radius:9px"></td><td>${esc(authorName(g.author))}</td><td>${esc(g.caption_en||g.caption_ar||"")}</td><td><button class="primary" data-approve-gallery="${g.id}">Approve</button></td></tr>`).join("")}</tbody></table>`:`<div class="empty"><b>Queue cleared</b><span>No gallery submissions are waiting.</span></div>`}</section>
<section class="module-card" style="margin-top:18px"><h2>Members & branches</h2><table class="admin-table"><thead><tr><th>Name</th><th>Grade</th><th>Branch</th><th>Access</th></tr></thead><tbody>${state.members.slice(0,12).map(m=>`<tr><td>${esc(m.full_name||"Student")}</td><td>${esc(m.grade||"—")}</td><td><span class="branch-tag">${esc(m.branch||"Not set")}</span></td><td>${m.role==="admin"?`<span class="badge-admin">Administrator</span>`:`<span class="status-pill">Student</span>`}</td></tr>`).join("")}</tbody></table></section>
${drafts.length?`<section class="module-card" style="margin-top:18px"><h2>Draft articles</h2><div class="article-grid" style="margin-top:14px">${drafts.map(articleCard).join("")}</div></section>`:""}`}

render=function(){document.body.classList.toggle("is-admin",state.isAdmin);if(state.view==="admin"&&!state.isAdmin)state.view="home";const V={home,discover,circles,messages,library,opportunities,gallery,articles,admin};$("#view").innerHTML=(V[state.view]||home)();const av=initials(state.profile.name);if($("#topAvatar"))$("#topAvatar").textContent=av;if($("#railAvatar"))$("#railAvatar").textContent=av;$$('[data-nav]').forEach(b=>b.classList.toggle("active",b.dataset.nav===state.view));bindDynamic()};

bindDynamic=function(){NEIS_BASE_BIND();$$('[data-gallery-filter]').forEach(b=>b.onclick=()=>{state.galleryFilter=b.dataset.galleryFilter;render()});$$('[data-article-lang]').forEach(b=>b.onclick=()=>{state.articleLanguage=b.dataset.articleLang;render()});$$('[data-read-article]').forEach(b=>b.onclick=()=>readArticle(b.dataset.readArticle));$$('[data-edit-article]').forEach(b=>b.onclick=()=>openArticleEditor(state.articles.find(x=>String(x.id)===b.dataset.editArticle)));$$('[data-author]').forEach(b=>b.onclick=()=>{state.articleAuthor=b.dataset.author;nav("articles")});$$('[data-clear-author]').forEach(b=>b.onclick=()=>{state.articleAuthor="";render()});$$('[data-approve-gallery]').forEach(b=>b.onclick=()=>moderateGallery(b.dataset.approveGallery,{approved:true}));$$('[data-feature-gallery]').forEach(b=>b.onclick=()=>{const g=state.gallery.find(x=>String(x.id)===b.dataset.featureGallery);moderateGallery(b.dataset.featureGallery,{featured:!g?.featured})});const as=$("#articleSearch");if(as)as.oninput=e=>{state.articleSearch=e.target.value;render()}}

function readArticle(id){const a=state.articles.find(x=>String(x.id)===String(id));if(!a)return;const ar=state.articleLanguage==="ar",title=(ar?a.title_ar:a.title_en)||a.title_en||a.title_ar,body=safeRich((ar?a.content_ar:a.content_en)||a.content_en||a.content_ar),editable=isMine(a)||state.isAdmin;openModal(`<article class="reader" dir="${ar?"rtl":"ltr"}">${a.cover_url?`<img class="reader-cover" src="${esc(a.cover_url)}" alt="${esc(title)}">`:""}<div class="article-meta" style="margin-top:18px"><span class="post-kind">${ar?"مقال":"Article"}</span><span>${formatDate(a.published_at||a.created_at)}</span></div><h1>${esc(title)}</h1><button class="author-link" data-author="${a.author_id}">${avatar({name:authorName(a.author),initials:initials(authorName(a.author)),color:"#006f5b"},true)}<span>${esc(authorName(a.author))}<small style="display:block;color:var(--muted)">${esc(authorMeta(a.author))}</small></span></button><div class="reader-body">${body}</div><div class="modal-actions"><button class="secondary" data-close>Close</button>${editable?`<button class="primary" data-edit-article="${a.id}">Edit article</button>`:""}</div></article>`,true);$$('[data-author]').forEach(b=>b.onclick=()=>{state.articleAuthor=b.dataset.author;closeModal();nav("articles")});$$('[data-edit-article]').forEach(b=>b.onclick=()=>openArticleEditor(a))}

function editorToolbar(target){return `<div class="editor-toolbar" data-editor="${target}"><select data-block><option value="p">Paragraph</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option><option value="blockquote">Quote</option></select><button type="button" data-cmd="bold"><b>B</b></button><button type="button" data-cmd="italic"><i>I</i></button><button type="button" data-cmd="underline"><u>U</u></button><button type="button" data-cmd="insertUnorderedList">• List</button><button type="button" data-cmd="insertOrderedList">1. List</button><button type="button" data-cmd="justifyLeft">Left</button><button type="button" data-cmd="justifyCenter">Center</button><button type="button" data-cmd="justifyRight">Right</button><button type="button" data-dir="ltr">LTR</button><button type="button" data-dir="rtl">RTL</button><button type="button" data-link>Link</button><button type="button" data-cmd="undo">↶</button><button type="button" data-cmd="removeFormat">Clear</button></div>`}
function openArticleEditor(a=null){if(!requireAccount())return;const editing=!!a,canEdit=!a||isMine(a)||state.isAdmin;if(!canEdit){toast("You cannot edit this article");return}openModal(`<div class="modal-head"><div><p class="kicker"><i></i>Student journal</p><h2>${editing?"Edit article":"Write a complete article"}</h2><p>Write in English, Arabic, or both. Preview before publishing.</p></div><button class="close" data-close>×</button></div><input type="hidden" id="articleId" value="${a?.id||""}"><div class="row"><label class="field">English title<input id="articleTitleEn" maxlength="180" value="${esc(a?.title_en||"")}" placeholder="Clear, valuable title"></label><label class="field">العنوان العربي<input id="articleTitleAr" maxlength="180" dir="rtl" value="${esc(a?.title_ar||"")}" placeholder="عنوان واضح ومفيد"></label></div><div class="row"><label class="field">English excerpt<textarea id="articleExcerptEn" rows="3">${esc(a?.excerpt_en||"")}</textarea></label><label class="field">الملخص العربي<textarea id="articleExcerptAr" dir="rtl" rows="3">${esc(a?.excerpt_ar||"")}</textarea></label></div><label class="field">Cover image<input id="articleCover" type="file" accept="image/*"></label>${a?.cover_url?`<img id="articleCoverPreview" class="upload-preview" src="${esc(a.cover_url)}">`:`<img id="articleCoverPreview" class="upload-preview hidden">`}<div class="editor-tabs"><button class="active" data-editor-tab="en">English editor</button><button data-editor-tab="ar">المحرر العربي</button></div><div class="editor-pane active" data-editor-pane="en"><div class="editor-shell">${editorToolbar("articleEditorEn")}<div id="articleEditorEn" class="rich-editor" contenteditable="true" data-placeholder="Write your English article…">${safeRich(a?.content_en||"")}</div></div></div><div class="editor-pane" data-editor-pane="ar"><div class="editor-shell" dir="rtl">${editorToolbar("articleEditorAr")}<div id="articleEditorAr" class="rich-editor" contenteditable="true" data-placeholder="اكتب المقال العربي…">${safeRich(a?.content_ar||"")}</div></div></div><section id="articlePreview" class="module-card hidden" style="margin-top:16px"></section><div class="modal-actions"><button class="secondary" type="button" data-article-preview>Preview</button><button class="secondary" type="button" data-save-article="draft">Save draft</button><button class="primary" type="button" data-save-article="published">Publish article</button></div>`,true);bindArticleEditor()}
function bindArticleEditor(){$$('[data-editor-tab]').forEach(b=>b.onclick=()=>{$$('[data-editor-tab]').forEach(x=>x.classList.toggle("active",x===b));$$('[data-editor-pane]').forEach(x=>x.classList.toggle("active",x.dataset.editorPane===b.dataset.editorTab))});$$('.editor-toolbar').forEach(bar=>{const ed=$("#"+bar.dataset.editor);bar.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{ed.focus();document.execCommand(b.dataset.cmd,false,null)});bar.querySelector('[data-block]').onchange=e=>{ed.focus();document.execCommand("formatBlock",false,e.target.value)};bar.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{ed.dir=b.dataset.dir;ed.focus()});bar.querySelector('[data-link]').onclick=()=>{const u=prompt("Paste a full https:// link");if(u&&/^https?:\/\//i.test(u)){ed.focus();document.execCommand("createLink",false,u)}}});$$('[data-save-article]').forEach(b=>b.onclick=()=>saveArticle(b.dataset.saveArticle));$('[data-article-preview]').onclick=previewArticle;bindImageEditor($('#articleCover'),$('#articleCoverPreview'),{aspect:16/9})}
function previewArticle(){const ar=$('[data-editor-tab].active')?.dataset.editorTab==="ar",title=ar?$('#articleTitleAr').value:$('#articleTitleEn').value,body=safeRich(ar?$('#articleEditorAr').innerHTML:$('#articleEditorEn').innerHTML),p=$('#articlePreview');p.classList.remove('hidden');p.dir=ar?'rtl':'ltr';p.innerHTML=`<p class="kicker"><i></i>${ar?'معاينة المقال':'Article preview'}</p><h1 style="font-size:38px;margin:12px 0">${esc(title||'Untitled')}</h1><div class="reader-body">${body||'<p>Start writing to see the preview.</p>'}</div>`;p.scrollIntoView({behavior:'smooth',block:'start'})}
async function saveArticle(status){if(!sb||!authUser){toast("Sign in first");return}const id=$('#articleId').value,title_en=$('#articleTitleEn').value.trim(),title_ar=$('#articleTitleAr').value.trim();if(!title_en&&!title_ar){toast("Add at least one title");return}const existing=state.articles.find(x=>String(x.id)===id),file=$('#articleCover').files[0];let cover_url=existing?.cover_url||"";if(file){cover_url=await uploadMedia(file,"article-covers");if(!cover_url)return}const payload={author_id:authUser.id,title_en,title_ar,excerpt_en:$('#articleExcerptEn').value.trim(),excerpt_ar:$('#articleExcerptAr').value.trim(),content_en:safeRich($('#articleEditorEn').innerHTML),content_ar:safeRich($('#articleEditorAr').innerHTML),cover_url,status,published_at:status==='published'?(existing?.published_at||new Date().toISOString()):null,updated_at:new Date().toISOString()};const q=id?sb.from('articles').update(payload).eq('id',id):sb.from('articles').insert(payload),{error}=await q;if(error){toast(error.message);return}closeModal();await loadLiveData();nav('articles');toast(status==='published'?"Article published":"Draft saved")}

function newGallery(){if(!requireAccount())return;openModal(`<div class="modal-head"><div><p class="kicker"><i></i>Community gallery</p><h2>Share a visual story</h2><p>Use a clear image and explain why the moment matters.</p></div><button class="close" data-close>×</button></div><form id="galleryForm"><label class="field">Image<input id="galleryFile" type="file" accept="image/*" required></label><img id="galleryPreview" class="upload-preview hidden"><div class="row"><label class="field">English caption<textarea id="galleryCaptionEn" rows="4" placeholder="What is happening, and why does it matter?"></textarea></label><label class="field">الوصف العربي<textarea id="galleryCaptionAr" dir="rtl" rows="4" placeholder="ماذا يحدث ولماذا هذه اللحظة مهمة؟"></textarea></label></div><label class="field">Tags<input id="galleryTags" placeholder="Robotics, Art, Event"></label><div class="modal-actions"><button type="button" class="secondary" data-close>Cancel</button><button class="primary">Submit to gallery</button></div></form>`);$('#galleryFile').onchange=e=>{const f=e.target.files[0];if(f){$('#galleryPreview').src=URL.createObjectURL(f);$('#galleryPreview').classList.remove('hidden')}};$('#galleryForm').onsubmit=async e=>{e.preventDefault();const file=$('#galleryFile').files[0];if(!file)return;const image_url=await uploadMedia(file,'gallery');if(!image_url)return;const {error}=await sb.from('gallery_items').insert({author_id:authUser.id,image_url,caption_en:$('#galleryCaptionEn').value.trim(),caption_ar:$('#galleryCaptionAr').value.trim(),tags:$('#galleryTags').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,8),approved:state.isAdmin});if(error){toast(error.message);return}closeModal();await loadLiveData();nav('gallery');toast(state.isAdmin?"Published to gallery":"Submitted for admin approval")}}
async function moderateGallery(id,changes){if(!state.isAdmin)return;const {error}=await sb.from('gallery_items').update(changes).eq('id',id);if(error){toast(error.message);return}await loadLiveData();render();toast("Gallery updated")}

async function uploadMedia(file,folder){file=window.resolveEditedFile?.(file)||file;if(!sb||!authUser)return "";if(file.size>8*1024*1024){toast("Image must be smaller than 8 MB");return ""}if(!file.type.startsWith('image/')){toast("Choose an image file");return ""}const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').toLowerCase(),path=`${authUser.id}/${folder}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;toast("Uploading image…");const {error}=await sb.storage.from('community-media').upload(path,file,{cacheControl:'3600',upsert:false});if(error){toast(error.message);return ""}return sb.storage.from('community-media').getPublicUrl(path).data.publicUrl}

compose=function(kind="Discussion"){if(!requireAccount())return;openModal(`<div class="modal-head"><div><p class="kicker"><i></i>Create</p><h2>Share with NEIS Circle</h2><p>A strong post combines a clear idea, useful context and an optional visual.</p></div><button class="close" data-close>×</button></div><form id="postFormPlus"><div class="row"><label class="field">Type<select id="postKind"><option ${kind==='Discussion'?'selected':''}>Discussion</option><option ${kind==='Question'?'selected':''}>Question</option><option>Resource</option><option>Experience</option></select></label><label class="field">Circle<select><option>General</option><option>Physics Lab</option><option>Build & Code</option><option>Future Paths</option></select></label></div><label class="field">Title<input id="postTitle" required maxlength="140" placeholder="Make the value clear"></label><label class="field">Details<textarea id="postBody" required rows="7" placeholder="Add context, what you tried, or what others can learn…"></textarea></label><div class="row"><label class="field">Tags<input id="postTags" placeholder="Physics, Grade11, Practical"></label><label class="field">Optional image<input id="postImage" type="file" accept="image/*"></label></div><img id="postImagePreview" class="upload-preview hidden"><div class="modal-actions"><button type="button" class="secondary" data-close>Cancel</button><button class="primary">Publish post</button></div></form>`);$('#postImage').onchange=e=>{const f=e.target.files[0];if(f){$('#postImagePreview').src=URL.createObjectURL(f);$('#postImagePreview').classList.remove('hidden')}};$('#postFormPlus').onsubmit=async e=>{e.preventDefault();const title=$('#postTitle').value.trim(),body=$('#postBody').value.trim(),file=$('#postImage').files[0];let image_url="";if(file){image_url=await uploadMedia(file,'posts');if(!image_url)return}const {error}=await sb.from('posts').insert({author_id:authUser.id,kind:$('#postKind').value,title,body,tags:$('#postTags').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,6),image_url});if(error){toast(error.message);return}closeModal();await loadLiveData();nav('home');toast("Published successfully")}}

profile=function(){const p=state.profile;openModal(`<div class="modal-head"><div><div class="identity-line"><h2>Your profile</h2>${state.isAdmin?`<span class="badge-admin">Administrator</span>`:""}</div><p>Your grade and branch appear beside your name across the platform.</p></div><button class="close" data-close>×</button></div><form id="profileFormPlus"><div class="row"><label class="field">Name<input id="pfName" value="${esc(p.name)}" required></label><label class="field">Username<input id="pfUser" value="${esc(p.username)}" required></label></div><div class="row"><label class="field">Grade<input id="pfGrade" value="${esc(p.grade)}" placeholder="Grade 11"></label><label class="field">Branch<input id="pfBranch" value="${esc(p.branch)}" placeholder="Sadat Branch"></label></div><label class="field">Campus<input id="pfCampus" value="${esc(p.campus)}"></label><label class="field">Bio<textarea id="pfBio" rows="4">${esc(p.bio)}</textarea></label><label class="field">Interests<input id="pfInterests" value="${esc(p.interests)}"></label><div class="modal-actions"><button type="button" class="secondary" data-close>Cancel</button><button class="primary">Save profile</button></div></form>`);$('#profileFormPlus').onsubmit=async e=>{e.preventDefault();const payload={full_name:$('#pfName').value.trim(),username:$('#pfUser').value.trim(),grade:$('#pfGrade').value.trim(),branch:$('#pfBranch').value.trim(),campus:$('#pfCampus').value.trim(),bio:$('#pfBio').value.trim(),interests:$('#pfInterests').value.split(',').map(x=>x.trim()).filter(Boolean)};if(sb&&authUser){const {error}=await sb.from('profiles').update(payload).eq('id',authUser.id);if(error){toast(error.message);return}}state.profile={...state.profile,name:payload.full_name,username:payload.username,grade:payload.grade,branch:payload.branch,campus:payload.campus,bio:payload.bio,interests:payload.interests.join(', ')};save();closeModal();await loadLiveData();render();toast("Profile updated")}}

settings=function(){openModal(`<div class="modal-head"><div><h2>Settings</h2><p>Account, appearance, language and privacy.</p></div><button class="close" data-close>×</button></div><div class="account-menu"><div class="account-row"><div><b>${esc(state.profile.name)}</b><small>${esc(state.profile.grade)} · ${esc(state.profile.branch)}</small></div>${state.isAdmin?`<span class="badge-admin">Admin</span>`:`<span class="status-pill">Student</span>`}</div><button class="account-row" data-setting-plus="theme"><span>Appearance</span><b>${state.theme==='light'?'Light':'Dark'}</b></button><button class="account-row" data-setting-plus="lang"><span>Language</span><b>${state.lang==='en'?'English':'العربية'}</b></button>${state.isAdmin?`<button class="account-row" data-nav="admin"><span>Private admin workspace</span><b>Open →</b></button><button class="account-row" data-action="admin-connection"><span>Technical connection</span><b>Admin only</b></button>`:""}</div><button class="secondary signout" data-action="signout">Sign out of this account</button>`);$('[data-setting-plus=theme]').onclick=()=>{state.theme=state.theme==='light'?'dark':'light';applyPrefs();settings()};$('[data-setting-plus=lang]').onclick=()=>{state.lang=state.lang==='en'?'ar':'en';state.articleLanguage=state.lang;applyPrefs();closeModal();render()};$$('.modal [data-nav]').forEach(b=>b.onclick=()=>{closeModal();nav(b.dataset.nav)})}
setup=function(){if(!state.isAdmin){toast("Technical settings are private to the administrator");return}NEIS_TECH_SETUP()}
async function signOut(){if(sb)await sb.auth.signOut();authUser=null;state.isAdmin=false;state.profile={name:'Student',username:'',grade:'',branch:'',campus:'',bio:'',interests:'',role:'student'};state.articles=[];state.gallery=[];state.members=[];save();closeModal();nav('home');toast("Signed out safely")}

loadLiveData=async function(){if(!sb||!authUser)return;const [postRes,commentRes,reactionRes,bookmarkRes,profileRes,articleRes,galleryRes,memberRes]=await Promise.all([
sb.from('posts').select('id,kind,title,body,tags,image_url,created_at,author_id,circle_id,pinned,post_type,profiles!posts_author_id_fkey(full_name,grade,branch,campus)').order('created_at',{ascending:false}),
sb.from('comments').select('post_id'),sb.from('reactions').select('post_id,user_id'),sb.from('bookmarks').select('post_id,user_id').eq('user_id',authUser.id),
sb.from('profiles').select('full_name,username,grade,branch,campus,bio,interests,role').eq('id',authUser.id).maybeSingle(),
sb.from('articles').select('*,author:profiles!articles_author_id_fkey(full_name,username,grade,branch)').order('created_at',{ascending:false}),
sb.from('gallery_items').select('*,author:profiles!gallery_items_author_id_fkey(full_name,username,grade,branch)').order('created_at',{ascending:false}),
sb.from('profiles').select('id,full_name,username,grade,branch,interests,role').order('full_name')]);
if(profileRes.data){const p=profileRes.data;state.isAdmin=p.role==='admin'||authUser.id===NEIS_ADMIN_ID;state.profile={name:p.full_name||authUser.user_metadata?.full_name||'Student',username:p.username||'',grade:p.grade||(state.isAdmin?'Grade 11':''),branch:p.branch||(state.isAdmin?'Sadat Branch':''),campus:p.campus||'',bio:p.bio||'',interests:(p.interests||[]).join(', '),role:state.isAdmin?'admin':'student'}}else{state.isAdmin=authUser.id===NEIS_ADMIN_ID;if(state.isAdmin)state.profile={...state.profile,name:authUser.user_metadata?.full_name||state.profile.name||'Eyad Ahmed',grade:'Grade 11',branch:'Sadat Branch',role:'admin'}}
if(!postRes.error){const cc={},rc={};(commentRes.data||[]).forEach(x=>cc[x.post_id]=(cc[x.post_id]||0)+1);(reactionRes.data||[]).forEach(x=>rc[x.post_id]=(rc[x.post_id]||0)+1);const livePosts=(postRes.data||[]).map(p=>{const n=p.profiles?.full_name||'NEIS Student';return {id:p.id,author_id:p.author_id,circle_id:p.circle_id,pinned:!!p.pinned,post_type:p.post_type||'post',is_live:true,created_at:p.created_at,user:n,initials:initials(n),color:'#006f5b',meta:[p.profiles?.grade,p.profiles?.branch,p.profiles?.campus].filter(Boolean).join(' · ')||'NEIS Circle',time:formatDate(p.created_at),kind:p.kind,title:p.title,body:p.body,tags:p.tags||[],image_url:p.image_url||'',likes:rc[p.id]||0,comments:cc[p.id]||0}});state.posts=livePosts;state.liked=(reactionRes.data||[]).filter(x=>x.user_id===authUser.id).map(x=>x.post_id);state.saved=(bookmarkRes.data||[]).map(x=>x.post_id)}
if(!articleRes.error)state.articles=articleRes.data||[];if(!galleryRes.error)state.gallery=galleryRes.data||[];if(!memberRes.error)state.members=memberRes.data||[];if(!state.members.length&&state.profile.name)state.members=[{id:authUser.id,full_name:state.profile.name,username:state.profile.username,grade:state.profile.grade,branch:state.profile.branch,interests:state.profile.interests?state.profile.interests.split(',').map(x=>x.trim()).filter(Boolean):[],role:state.isAdmin?'admin':'student'}];state.platformReady=true;save();document.body.classList.toggle('is-admin',state.isAdmin);
if(!neisRealtimeReady){if(realtimeChannel)await sb.removeChannel(realtimeChannel);realtimeChannel=sb.channel('neis-platform-v3').on('postgres_changes',{event:'*',schema:'public',table:'posts'},async()=>{await loadLiveData();render()}).on('postgres_changes',{event:'*',schema:'public',table:'articles'},async()=>{await loadLiveData();render()}).on('postgres_changes',{event:'*',schema:'public',table:'gallery_items'},async()=>{await loadLiveData();render()}).subscribe();neisRealtimeReady=true}}

document.addEventListener('click',async e=>{const a=e.target.closest('[data-action]');if(a){const x=a.dataset.action;if(x==='signout')await signOut();if(x==='new-article')openArticleEditor();if(x==='new-gallery')newGallery();if(x==='admin-connection')setup()}},true);

async function neisEnhanceInit(){if(sb){const {data}=await sb.auth.getSession();authUser=data.session?.user||null;if(authUser)await loadLiveData()}render()}
neisEnhanceInit();
</script>

function translateTree(root){if(!root||!ar())return;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=walker.nextNode()){const value=n.nodeValue,trim=value.trim();if(uiAr[trim])n.nodeValue=value.replace(trim,uiAr[trim])}root.querySelectorAll('[placeholder]').forEach(el=>{const p=el.getAttribute('placeholder');if(uiAr[p])el.setAttribute('placeholder',uiAr[p])})}

on>`;authRoot.querySelectorAll('[data-auth-mode]').forEach(b=>b.onclick=()=>{authMode=b.dataset.authMode;authScreen()});authRoot.querySelector('[data-auth-google]').onclick=()=>{if(!sb){toast(bi('Connection is not ready. Please refresh.','الاتصال غير جاهز، حدّث الصفحة.'));return}googleSignIn()};authRoot.querySelector('[data-auth-lang]').onclick=()=>{state.lang=ar()?'en':'ar';state.articleLanguage=state.lang;applyPrefs();authScreen()};authRoot.querySelector('[data-auth-theme]').onclick=()=>{state.theme=state.theme==='light'?'dark':'light';applyPrefs();authScreen()}}
function onboardingScreen(){document.body.classList.remove('app-ready');const meta=authUser?.user_metadata||{},name=state.profile.name&&state.profile.name!=='Student'?state.profile.name:(meta.full_name||meta.name||'');authRoot.innerHTML=`<section class="onboard-shell"><div class="onboard-head"><div><span class="onboard-step">${bi('STEP 2 OF 2','الخطوة ٢ من ٢')}</span><h1>${bi('Complete your student profile','أكمل ملفك كطالب')}</h1><p>${bi('This information helps students find the right people and keeps the community organized.','تساعد هذه البيانات الطلاب في العثور على الأشخاص المناسبين وتنظيم المجتمع.')}</p></div><div class="auth-tools"><button data-auth-lang>${ar()?'EN':'AR'}</button><button data-onboard-signout>${bi('Sign out','خروج')}</button></div></div><form id="onboardForm"><div class="onboard-grid"><label class="field">${bi('Full name','الاسم الكامل')}<input id="obName" value="${esc(name)}" required maxlength="80"></label><label class="field">${bi('Username','اسم المستخدم')}<input id="obUsername" value="${esc(state.profile.username||'')}" required maxlength="30" placeholder="eyad_ahmed" pattern="[A-Za-z0-9_]{3,30}"></label><label class="field">${bi('Grade','الصف')}<select id="obGrade" required><option value="">${bi('Choose grade','اختر الصف')}</option>${['Grade 10','Grade 11','Grade 12'].map(x=>`<option ${state.profile.grade===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">${bi('Branch','الفرع')}<select id="obBranch" required><option value="">${bi('Choose branch','اختر الفرع')}</option>${['Sadat Branch','Main Branch','New Cairo Branch','El Shorouk Branch','Alexandria Branch'].map(x=>`<option ${state.profile.branch===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field wide">${bi('Interests','الاهتمامات')}<input id="obInterests" value="${esc(state.profile.interests||'')}" placeholder="Physics, Design, Robotics"></label></div><div id="onboardError" class="form-error hidden"></div><div class="modal-actions"><button id="completeProfile" class="primary">${bi('Enter NEIS Circle','دخول NEIS Circle')}</button></div></form></section>`;authRoot.querySelector('[data-auth-lang]').onclick=()=>{state.lang=ar()?'en':'ar';state.articleLanguage=state.lang;applyPrefs();onboardingScreen()};authRoot.querySelector('[data-onboard-signout]').onclick=signOut;authRoot.querySelector('#onboardForm').onsubmit=saveOnboarding}
async function saveOnboarding(e){e.preventDefault();const btn=$('#completeProfile'),errorBox=$('#onboardError'),username=$('#obUsername').value.trim().toLowerCase();if(!/^[a-z0-9_]{3,30}$/.test(username)){errorBox.textContent=bi('Username must be 3–30 letters, numbers or underscores.','اسم المستخدم يجب أن يكون من ٣ إلى ٣٠ حرفًا إنجليزيًا أو رقمًا أو شرطة سفلية.');errorBox.classList.remove('hidden');return}btn.classList.add('button-loading');btn.textContent=bi('Saving…','جارٍ الحفظ…');const payload={id:authUser.id,full_name:$('#obName').value.trim(),username,grade:$('#obGrade').value,branch:$('#obBranch').value,campus:$('#obBranch').value,interests:$('#obInterests').value.split(',').map(x=>x.trim()).filter(Boolean),onboarding_complete:true};const {error}=await sb.from('profiles').upsert(payload,{onConflict:'id'});if(error){errorBox.textContent=error.code==='23505'?bi('This username is already taken.','اسم المستخدم مستخدم بالفعل.'):window.neisFriendlyError?.(error,'complete your profile')||bi('We could not complete your profile. Please try again.','تعذر إكمال ملفك. حاول مرة أخرى.');errorBox.classList.remove('hidden');btn.classList.remove('button-loading');btn.textContent=bi('Enter NEIS Circle','دخول NEIS Circle');return}state.onboardingComplete=true;await loadLiveData();render();toast(bi('Profile completed — welcome!','اكتمل ملفك — أهلًا بك!'))}

galleryCard=function(g){const cap=(ar()?g.caption_ar:g.caption_en)||g.caption_en||g.caption_ar||bi('Community moment','لحظة من المجتمع'),demo=String(g.id).startsWith('demo-'),manageable=state.isAdmin&&!demo;return `<article class="gallery-card"><img src="${esc(g.image_url)}" alt="${esc(cap)}" loading="lazy"><div class="gallery-tools">${!g.approved&&!demo?`<span class="status-pill">${bi('Pending review','قيد المراجعة')}</span>`:''}${g.featured?`<span class="status-pill live">${bi('Featured','مميز')}</span>`:''}${manageable&&!g.approved?`<button data-approve-gallery="${g.id}">${bi('Approve','موافقة')}</button>`:''}${manageable&&g.approved?`<button data-feature-gallery="${g.id}">${g.featured?bi('Unfeature','إلغاء التمييز'):bi('Feature','تمييز')}</button>`:''}</div><div class="gallery-copy"><div class="tag-row">${(g.tags||[]).slice(0,3).map(t=>`<span>#${esc(t)}</span>`).join('')}</div><h3>${esc(cap)}</h3><p>${esc(authorName(g.author))} · ${esc(authorMeta(g.author))}</p></div></article>`};

async function uploadRecord(file,folder){file=window.resolveEditedFile?.(file)||file;if(!file)return null;if(file.size>8*1024*1024){toast(bi('Image must be smaller than 8 MB.','يجب أن تكون الصورة أقل من 8 ميجابايت.'));return null}if(!file.type.startsWith('image/')){toast(bi('Choose a valid image file.','اختر ملف صورة صالحًا.'));return null}const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').toLowerCase(),path=`${authUser.id}/${folder}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;toast(bi('Uploading image…','جارٍ رفع الصورة…'));const {error}=await sb.storage.from('community-media').upload(path,file,{cacheControl:'3600',upsert:false});if(error){toast(error.message);return null}return {path,url:sb.storage.from('community-media').getPublicUrl(path).data.publicUrl}}
newGallery=function(){if(!requireAccount())return;openModal(`<div class="modal-head"><div><p class="kicker"><i></i>${bi('Community gallery','معرض المجتمع')}</p><h2>${bi('Share a visual story','شارك قصة بصرية')}</h2><p>${bi('Every submission goes to the admin review queue before publishing.','كل مشاركة تذهب إلى قائمة مراجعة الأدمن قبل النشر.')}</p></div><button class="close" data-close>×</button></div><form id="galleryForm"><label class="field">${bi('Image','الصورة')}<input id="galleryFile" type="file" accept="image/*" required></label><img id="galleryPreview" class="upload-preview hidden"><div class="row"><label class="field">English caption<textarea id="galleryCaptionEn" rows="4" placeholder="What is happening, and why does it matter?"></textarea></label><label class="field">الوصف العربي<textarea id="galleryCaptionAr" dir="rtl" rows="4" placeholder="ماذا يحدث ولماذا هذه اللحظة مهمة؟"></textarea></label></div><label class="field">${bi('Tags','الوسوم')}<input id="galleryTags" placeholder="Robotics, Art, Event"></label><div class="modal-actions"><button type="button" class="secondary" data-close>${bi('Cancel','إلغاء')}</button><button id="gallerySubmit" class="primary">${bi('Send for review','إرسال للمراجعة')}</button></div></form>`);$('#galleryFile').onchange=e=>{const f=e.target.files[0];if(f){$('#galleryPreview').src=URL.createObjectURL(f);$('#galleryPreview').classList.remove('hidden')}};$('#galleryForm').onsubmit=async e=>{e.preventDefault();const btn=$('#gallerySubmit');btn.classList.add('button-loading');const media=await uploadRecord($('#galleryFile').files[0],'gallery');if(!media){btn.classList.remove('button-loading');return}const {error}=await sb.from('gallery_items').insert({author_id:authUser.id,image_url:media.url,caption_en:$('#galleryCaptionEn').value.trim(),caption_ar:$('#galleryCaptionAr').value.trim(),tags:$('#galleryTags').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,8),approved:false,featured:false});if(error){await sb.storage.from('community-media').remove([media.path]);toast(error.message);btn.classList.remove('button-loading');return}closeModal();await loadLiveData();nav(state.isAdmin?'admin':'gallery');toast(bi('Sent to the moderation queue.','تم الإرسال إلى قائمة المراجعة.'))}};
const v3SaveArticle=saveArticle;
saveArticle=async function(status){const file=getEditedImage($('#articleCover'));if(!file)return v3SaveArticle(status);if(!sb||!authUser)return;const id=$('#articleId').value,title_en=$('#articleTitleEn').value.trim(),title_ar=$('#articleTitleAr').value.trim();if(!title_en&&!title_ar){toast(bi('Add at least one title.','أضف عنوانًا واحدًا على الأقل.'));return}const media=await uploadRecord(file,'article-covers');if(!media)return;const existing=state.articles.find(x=>String(x.id)===id),payload={author_id:authUser.id,title_en,title_ar,excerpt_en:$('#articleExcerptEn').value.trim(),excerpt_ar:$('#articleExcerptAr').value.trim(),content_en:safeRich($('#articleEditorEn').innerHTML),content_ar:safeRich($('#articleEditorAr').innerHTML),cover_url:media.url,status,published_at:status==='published'?(existing?.published_at||new Date().toISOString()):null,updated_at:new Date().toISOString()};const q=id?sb.from('articles').update(payload).eq('id',id):sb.from('articles').insert(payload),{error}=await q;if(error){await sb.storage.from('community-media').remove([media.path]);toast(error.message);return}closeModal();await loadLiveData();nav('articles');toast(status==='published'?bi('Article published.','تم نشر المقال.'):bi('Draft saved.','تم حفظ المسودة.'))};

compose=function(kind='Discussion'){if(!requireAccount())return;openModal(`<div class="modal-head"><div><p class="kicker"><i></i>${bi('Create','إنشاء')}</p><h2>${bi('Share with NEIS Circle','شارك مع NEIS Circle')}</h2><p>${bi('Add a clear idea, useful context and an optional image.','أضف فكرة واضحة وسياقًا مفيدًا وصورة اختيارية.')}</p></div><button class="close" data-close>×</button></div><form id="postFormPlus"><label class="field">${bi('Type','النوع')}<select id="postKind"><option ${kind==='Discussion'?'selected':''}>Discussion</option><option ${kind==='Question'?'selected':''}>Question</option><option>Resource</option><option>Experience</option></select></label><label class="field">${bi('Title','العنوان')}<input id="postTitle" required maxlength="140" placeholder="${bi('Make the value clear','اكتب عنوانًا واضحًا')}"></label><label class="field">${bi('Details','التفاصيل')}<textarea id="postBody" required rows="7" placeholder="${bi('Add context, what you tried, or what others can learn…','أضف السياق وما جرّبته أو ما يمكن للآخرين تعلمه…')}"></textarea></label><div class="row"><label class="field">${bi('Tags','الوسوم')}<input id="postTags" placeholder="Physics, Grade11, Practical"></label><label class="field">${bi('Optional image','صورة اختيارية')}<input id="postImage" type="file" accept="image/*"></label></div><img id="postImagePreview" class="upload-preview hidden"><div class="modal-actions"><button type="button" class="secondary" data-close>${bi('Cancel','إلغاء')}</button><button id="postSubmit" class="primary">${bi('Publish post','نشر المنشور')}</button></div></form>`);$('#postImage').onchange=e=>{const f=e.target.files[0];if(f){$('#postImagePreview').src=URL.createObjectURL(f);$('#postImagePreview').classList.remove('hidden')}};$('#postFormPlus').onsubmit=async e=>{e.preventDefault();const btn=$('#postSubmit'),file=$('#postImage').files[0];btn.classList.add('button-loading');let media=null;if(file){media=await uploadRecord(file,'posts');if(!media){btn.classList. date(payload).eq('id',authUser.id);if(error){toast(error.message);return}await loadLiveData();closeModal();render();toast(bi('Profile updated.','تم تحديث الملف الشخصي.'))}};
settings=function(){openModal(`<div class="modal-head"><div><h2>${bi('Settings','الإعدادات')}</h2><p>${bi('Account, appearance, language and privacy.','الحساب والمظهر واللغة والخصوصية.')}</p></div><button class="close" data-close>×</button></div><div class="account-menu"><div class="account-row"><div><b>${esc(state.profile.name)}</b><small>${esc(state.profile.grade)} · ${esc(state.profile.branch)}</small></div>${state.isAdmin?`<span class="badge-admin">${bi('Admin','أدمن')}</span>`:`<span class="status-pill">${bi('Student','طالب')}</span>`}</div><button class="account-row" data-setting-plus="theme"><span>${bi('Appearance','المظهر')}</span><b>${state.theme==='light'?bi('Light','فاتح'):bi('Dark','داكن')}</b></button><button class="account-row" data-setting-plus="lang"><span>${bi('Language','اللغة')}</span><b>${ar()?'العربية':'English'}</b></button>${state.isAdmin?`<button class="account-row" data-nav="admin"><span>${bi('Private admin workspace','مساحة الأدمن الخاصة')}</span><b>${bi('Open →','فتح ←')}</b></button><button class="account-row" data-action="admin-connection"><span>${bi('Technical connection','الاتصال التقني')}</span><b>${bi('Admin only','للأدمن فقط')}</b></button>`:''}</div><button class="secondary signout" data-action="signout">${bi('Sign out of this account','تسجيل الخروج من الحساب')}</button>`);$('[data-setting-plus=theme]').onclick=()=>{state.theme=state.theme==='light'?'dark':'light';applyPrefs();settings()};$('[data-setting-plus=lang]').onclick=()=>{state.lang=ar()?'en':'ar';state.articleLanguage=state.lang;applyPrefs();closeModal();render()};$$('.modal [data-nav]').forEach(b=>b.onclick=()=>{closeModal();nav(b.dataset.nav)});translateTree($('#modalRoot'))};

<script>
/* NEIS Circle v5 — complete permissions UX, reliable filters/search, and polished active states. */
(function(){
const v5Ar=()=>state.lang==='ar';
const v5Text=(en,arabic)=>v5Ar()?arabic:en;
const normalizeSearch=value=>String(value||'').toLocaleLowerCase(state.lang==='ar'?'ar':'en').normalize('NFKD').replace(/[\u064b-\u065f\u0670]/g,'').trim();
const matchesSearch=(query,...values)=>!query||normalizeSearch(values.flat().join(' ')).includes(query);
const emptyState=(title,copy)=>`<div class="empty"><b>${title}</b><span>${copy}</span></div>`;

window.neisFriendlyError=function(error,action='complete this action'){
  const message=String(error?.message||error||'');
  if(/permission denied|row.level security|violates.*policy|42501|PGRST/i.test(message))return v5Text(`We could not ${action}. Please refresh and try again.`,`تعذر ${action==='load this content'?'تحميل المحتوى':'إكمال العملية'}. حدّث الصفحة وحاول مرة أخرى.`);
  if(/duplicate|23505/i.test(message))return v5Text('This item already exists.','هذا العنصر موجود بالفعل.');
  if(/foreign key|23503/i.test(message))return v5Text('This sample item cannot be changed.','لا يمكن تعديل هذا العنصر التجريبي.');
  if(/network|fetch|offline|timeout/i.test(message))return v5Text('Connection problem. Check your internet and try again.','مشكلة في الاتصال. تحقق من الإنترنت وحاول مرة أخرى.');
  return v5Text(`We could not ${action}. Please try again.`,`تعذر إكمال العملية. حاول مرة أخرى.`);
};
const v5Toast=toast;
toast=function(message){const raw=String(message?.message||message||'');v5Toast(/permission denied|row.level security|violates.*policy|42501|PGRST|foreign key/i.test(raw)?window.neisFriendlyError(message):raw)};

const v5LiveToggle=liveToggle;
liveToggle=async function(table,id,on){const post=state.posts.find(p=>String(p.id)===String(id));if(post&&!post.is_live)return;return v5LiveToggle(table,id,on)};

state.localReplies=load('neis-local-replies-v5',{});
comments=async function(id){
  const p=state.posts.find(x=>String(x.id)===String(id));if(!p)return;
  let replies=p.is_live?[]:(state.localReplies[id]||[]);
  if(p.is_live&&sb&&authUser){const {data,error}=await sb.from('comments').select('id,body,created_at,profiles!comments_author_id_fkey(full_name)').eq('post_id',id).order('created_at');if(error)toast(window.neisFriendlyError(error,'load this content'));else replies=data||[]}

  $('#commentForm').onsubmit=async e=>{e.preventDefault();const body=$('#commentInput').value.trim();if(!body)return;const send=$('#commentForm button');send.disabled=true;if(p.is_live){const {error}=await sb.from('comments').insert({post_id:id,author_id:authUser.id,body});if(error){toast(window.neisFriendlyError(error,'add your reply'));send.disabled=false;return}await loadLiveData()}else{state.localReplies[id]=[...(state.localReplies[id]||[]),{body,name:state.profile.name,created_at:new Date().toISOString()}];localStorage.setItem('neis-local-replies-v5',JSON.stringify(state.localReplies));p.comments=(p.comments||0)+1;save()}closeModal();render();toast(v5Text('Reply added.','تمت إضافة الرد.'))}
};

const v5Home=home;
home=function(){const original=state.posts;if(state.filter==='Latest')state.posts=[...original].sort((a,b)=>{const dates=(Date.parse(b.created_at||'')||0)-(Date.parse(a.created_at||'')||0);return dates||Number(b.id||0)-Number(a.id||0)});const html=v5Home();state.posts=original;return html};

discover=function(){
  const query=normalizeSearch(state.query),rawBase=state.members.length?state.members.map(m=>({name:m.full_name||'Student',initials:initials(m.full_name),color:'#7056d8',grade:m.grade||'Student',branch:m.branch||'NEIS',interests:(m.interests||[]).join(' · ')||'Learning · Community'})):seed.people.map((p,i)=>({...p,branch:i%2?'Sadat Branch':'Main Branch'})),seenPeople=new Set(),base=rawBase.filter(p=>{const key=normalizeSearch(`${p.name}|${p.grade}|${p.branch}`);if(seenPeople.has(key))return false;seenPeople.add(key);return true});

};

circles=function(){const query=normalizeSearch(state.query),items=seed.circles.filter(c=>matchesSearch(query,c.name,c.desc,c.code));return `${pageTitle(v5Text('Circles','المجتمعات'),v5Text('Small, focused spaces built around useful conversations.','مساحات مركزة لمحادثات مفيدة.'),`<button class="primary" data-action="new-circle">${v5Text('+ New circle','+ مجتمع جديد')}</button>`)}${query?`<p class="search-result-note">${items.length} ${v5Text('matching circles','مجتمعات مطابقة')}</p>`:''}<div class="grid-3">${items.length?items.map(c=>`<article class="module-card"><span class="module-icon" style="--tone:${c.color}20;color:${c.color}">${esc(c.code)}</span><h3>${esc(c.name)}</h3><p>${esc(c.desc)}</p><div class="module-meta"><span>${c.members.toLocaleString()} ${v5Text('members','عضو')}</span></div><button class="primary" data-join="${c.id}">${state.joined.includes(c.id)?v5Text('Joined ✓','منضم ✓'):v5Text('Join circle','انضم للمجتمع')}</button></article>`).join(''):emptyState(v5Text('No circles match','لا توجد مجتمعات مطابقة'),v5Text('Try a broader search.','جرّب بحثًا أوسع.'))}</div>`};

const opportunityDates={1:'2026-09-28',2:'2026-10-04',3:'2026-10-12',4:'2026-10-20'};
opportunities=function(){

};

gallery=function(){let items=state.gallery.filter(g=>g.approved||isMine(g)||state.isAdmin),query=normalizeSearch(state.query);if(state.galleryFilter==='Featured')items=items.filter(g=>g.featured);if(state.galleryFilter==='Mine')items=items.filter(isMine);items=items.filter(g=>matchesSearch(query,g.caption_en,g.caption_ar,g.tags,authorName(g.author)));return `${pageTitle(v5Text('Community gallery','معرض المجتمع'),v5Text('Projects, events, art and memorable moments—shared by students.','مشروعات وفعاليات وفنون ولحظات يشاركها الطلاب.'),`<button class="primary" data-action="new-gallery">${v5Text('+ Add to gallery','+ أضف للمعرض')}</button>`)}<div class="tabs">${[['All','الكل'],['Featured','المميز'],['Mine','مشاركاتي']].map(([value,label])=>`<button class="${state.galleryFilter===value?'active':''}" data-gallery-filter="${value}">${v5Text(value,label)}</button>`).join('')}</div><div class="gallery-grid" style="margin-top:18px">${items.length?items.map(galleryCard).join(''):emptyState(v5Text('No gallery items yet','لا توجد صور بعد'),v5Text('Share the first meaningful visual story.','شارك أول قصة بصرية مفيدة.'))}</div>`};

library=function(){const query=normalizeSearch(state.query),items=state.posts.filter(p=>state.saved.includes(p.id)&&matchesSearch(query,p.title,p.body,p.tags,p.user));return `${pageTitle(v5Text('Your library','مكتبتك'),v5Text('Everything useful you saved for later.','كل ما حفظته للرجوع إليه لاحقًا.'))}<div class="feed">${items.length?items.map(postCard).join(''):emptyState(v5Text('No saved items match','لا توجد عناصر محفوظة مطابقة'),v5Text('Save useful posts or try another search.','احفظ منشورات مفيدة أو جرّب بحثًا آخر.'))}</div>`};

const searchInput=$('#globalSearch');
if(searchInput)searchInput.setAttribute('aria-label',v5Text('Search this section','ابحث في هذا القسم'));
})();

<script>
/* NEIS Circle v6 — database-first conversations, replies, connections, search, circles and notifications. */
(function(){
const t=(en,arabic)=>state.lang==='ar'?arabic:en;
const same=(a,b)=>String(a)===String(b);
const byId=(arr,id)=>arr.find(x=>same(x.id,id));
const normalize=value=>String(value||'').toLocaleLowerCase(state.lang==='ar'?'ar':'en').normalize('NFKD').replace(/[\u064b-\u065f\u0670]/g,'').trim();
const match=(query,...values)=>!query||normalize(values.flat().join(' ')).includes(query);
const blank=(title,copy)=>`<div class="empty"><b>${title}</b><span>${copy}</span></div>`;
const normalizeSearch=normalize,matchesSearch=match,emptyState=blank;
const when=value=>new Intl.DateTimeFormat(state.lang==='ar'?'ar-EG':'en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(value||Date.now()));
const relative=value=>{const sec=Math.max(0,(Date.now()-new Date(value).getTime())/1000);if(sec<60)return t('now','الآن');if(sec<3600)return `${Math.floor(sec/60)}${t('m','د')}`;if(sec<86400)return `${Math.floor(sec/3600)}${t('h','س')}`;return new Intl.DateTimeFormat(state.lang==='ar'?'ar-EG':'en-GB',{day:'numeric',month:'short'}).format(new Date(value))};
const safeError=(error,fallback)=>{console.error('[NEIS]',error);return window.neisFriendlyError?.(error,fallback)||t('Something went wrong. Please try again.','حدث خطأ. حاول مرة أخرى.')};
Object.assign(state,{follows:[],conversations:[],conversationMembers:[],liveMessages:[],circleRows:[],circleMembers:[],circleMessages:[],circleMeetings:[],notifications:[],reports:[],allComments:[],connectionTab:'following',searchTab:'all',searchResults:[],searchLoading:false,activeProfileId:'',activeConversationId:'',activeCircleId:'',circleTab:'home',circleFilter:'all',circleQuery:'',connectionsQuery:'',conversationQuery:'',dataErrors:{}});
let v6Channel=null,searchTimer=null,circleSearchTimer=null,searchIndex=-1;

function profileData(id){return state.members.find(x=>same(x.id,id))||{id,full_name:t('NEIS Student','طالب NEIS'),username:'student',grade:'',branch:'',bio:'',interests:[]}}
function profileAvatar(p,large=false){return avatar({name:p.full_name||p.name,initials:initials(p.full_name||p.name),color:'#006f5b'},large)}
function isFollowing(id){return state.follows.some(f=>same(f.follower_id,authUser?.id)&&same(f.following_id,id)&&f.status==='accepted')}
function followsMe(id){return state.follows.some(f=>same(f.follower_id,id)&&same(f.following_id,authUser?.id)&&f.status==='accepted')}
function membership(circleId,userId=authUser?.id){return state.circleMembers.find(m=>same(m.circle_id,circleId)&&same(m.user_id,userId))}
function canManageCircle(circleId){const m=membership(circleId);return !!(state.isAdmin||(m&&m.status==='active'&&['owner','admin'].includes(m.role)))}
function canModerateCircle(circleId){const m=membership(circleId);return !!(state.isAdmin||(m&&m.status==='active'&&['owner','admin','moderator'].includes(m.role)))}
function unreadMessages(){return state.conversations.reduce((sum,c)=>sum+conversationUnread(c.id),0)}
function conversationUnread(id){const member=state.conversationMembers.find(m=>same(m.conversation_id,id)&&same(m.user_id,authUser?.id)),read=member?.last_read_at||'1970-01-01';return state.liveMessages.filter(m=>same(m.conversation_id,id)&&!same(m.sender_id,authUser?.id)&&new Date(m.created_at)>new Date(read)).length}
function routeTo(path,replace=false){const hash='#/'+String(path||'home').replace(/^\/+/, '');if(location.hash===hash){applyRoute();return}(replace?history.replaceState(null,'',hash):history.pushState(null,'',hash));applyRoute()}

function applyRoute(){
  if(!authUser)return;
  const raw=location.hash.replace(/^#\/?/,'')||'home',[pathPart,queryPart='']=raw.split('?'),parts=pathPart.split('/').map(decodeURIComponent),head=parts[0];
  if(head==='profile'&&parts[1]){state.view='profile-detail';state.activeProfileId=parts[1]}
  else if(head==='messages'){state.view='messages';state.activeConversationId=parts[1]||state.activeConversationId||''}
  else if(head==='circles'&&parts[1]){state.view='circle-detail';state.activeCircleId=parts[1];state.circleTab=parts[2]||'home'}
  else if(head==='connections'){state.view='connections';state.connectionTab=parts[1]||'following'}
  else if(head==='search'){state.view='search';const q=new URLSearchParams(queryPart).get('q')||state.query;state.query=q;const input=$('#globalSearch');if(input)input.value=q;performSearch(q,false)}
  else if(head==='post'&&parts[1]){state.view='home';setTimeout(()=>comments(parts[1]),80)}
  else{state.view=['home','discover','circles','messages','library','opportunities','gallery','articles','admin','notifications'].includes(head)?head:'home'}
  render();
}
const priorNav=nav;
nav=function(view){routeTo(view)};

const coreLoad=loadLiveData;
loadLiveData=async function(){
  if(!sb||!authUser)return;
  await coreLoad();
  const uid=authUser.id;
  const [followRes,myMembershipRes,circleRes,circleMemberRes,meetingRes,notificationRes,commentRes,reportRes]=await Promise.all([
    sb.from('follows').select('*').or(`follower_id.eq.${uid},following_id.eq.${uid}`).order('created_at',{ascending:false}),
    sb.from('conversation_members').select('*').eq('user_id',uid),
    sb.from('circles').select('*').order('created_at',{ascending:false}),
    sb.from('circle_members').select('*,profile:profiles(id,full_name,username,grade,branch,avatar_url)').order('joined_at'),
    sb.from('circle_meetings').select('*,creator:profiles(id,full_name,username,avatar_url)').order('starts_at'),
    sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(100),
    sb.from('comments').select('id,post_id,parent_id,author_id,body,created_at,updated_at,deleted_at,profile:profiles(id,full_name,username,grade,branch,avatar_url)').order('created_at'),
    state.isAdmin?sb.from('reports').select('*,reporter:profiles!reports_reporter_id_fkey(full_name,username)').order('created_at',{ascending:false}):Promise.resolve({data:[],error:null})
  ]);
  if(!followRes.error)state.follows=followRes.data||[];else state.dataErrors.connections=followRes.error;
  let conversationIds=(myMembershipRes.data||[]).map(x=>x.conversation_id);
  let conversationRes={data:[]},memberRes={data:[]},messageRes={data:[]};
  if(conversationIds.length){[conversationRes,memberRes,messageRes]=await Promise.all([
    sb.from('conversations').select('*').in('id',conversationIds).order('updated_at',{ascending:false}),
    sb.from('conversation_members').select('*,profile:profiles(id,full_name,username,grade,branch,avatar_url)').in('conversation_id',conversationIds),
    sb.from('messages').select('*').in('conversation_id',conversationIds).order('created_at').limit(500)
  ])}
  if(!conversationRes.error)state.conversations=conversationRes.data||[];
  if(!memberRes.error)state.conversationMembers=memberRes.data||myMembershipRes.data||[];
  if(!messageRes.error)state.liveMessages=messageRes.data||[];
  if(!circleRes.error)state.circleRows=circleRes.data||[];else state.dataErrors.circles=circleRes.error;
  if(!circleMemberRes.error)state.circleMembers=circleMemberRes.data||[];
  if(!meetingRes.error)state.circleMeetings=meetingRes.data||[];else state.dataErrors.meetings=meetingRes.error;
  if(!notificationRes.error)state.notifications=notificationRes.data||[];
  if(!commentRes.error){state.allComments=commentRes.data||[];state.posts.forEach(p=>p.comments=state.allComments.filter(c=>same(c.post_id,p.id)&&!c.deleted_at).length)}
  if(!reportRes.error)state.reports=reportRes.data||[];
  const joinedCircleIds=state.isAdmin?state.circleRows.map(c=>c.id):state.circleMembers.filter(m=>same(m.user_id,uid)&&['active','muted'].includes(m.status)).map(m=>m.circle_id);
  state.circleMessages=[];
  if(joinedCircleIds.length){const cm=await sb.from('circle_messages').select('*,profile:profiles(id,full_name,username,avatar_url)').in('circle_id',joinedCircleIds).order('created_at').limit(500);if(!cm.error)state.circleMessages=cm.data||[]}
  if(v6Channel)await sb.removeChannel(v6Channel);
  v6Channel=sb.channel(`neis-v7-${uid}`).on('postgres_changes',{event:'*',schema:'public',table:'messages'},refreshV6).on('postgres_changes',{event:'*',schema:'public',table:'circle_messages'},refreshV6).on('postgres_changes',{event:'*',schema:'public',table:'circle_meetings'},refreshV6).on('postgres_changes',{event:'*',schema:'public',table:'notifications',filter:`user_id=eq.${uid}`},refreshV6).on('postgres_changes',{event:'*',schema:'public',table:'follows'},refreshV6).on('postgres_changes',{event:'*',schema:'public',table:'comments'},refreshV6).on('postgres_changes',{event:'*',schema:'public',table:'circle_members'},refreshV6).subscribe();
};
let refreshBusy=false;
async function refreshV6(){if(refreshBusy)return;refreshBusy=true;try{await loadLiveData();render()}finally{refreshBusy=false}}

const originalPostCard=postCard;

};

discover=function(){
  let people=state.members.filter(p=>!same(p.id,authUser.id)),q=normalize(state.query);
  if(q)people=people.filter(p=>match(q,p.full_name,p.username,p.grade,p.branch,p.interests,p.bio));

  if(state.discoverFilter==='Programming')people=people.filter(p=>normalize(p.interests).includes('programming'));
  return `${pageTitle(t('Discover people','اكتشف الطلاب'),t('Open any profile, follow people, or start a direct conversation.','افتح أي ملف شخصي أو تابع الطلاب أو ابدأ محادثة مباشرة.'))}<div class="tabs">${[['Recommended','مقترح'],['Grade 11','الصف 11'],['Same branch','نفس الفرع'],['Programming','البرمجة']].map(([v,a])=>`<button class="${state.discoverFilter===v?'active':''}" data-discover-filter="${v}">${t(v,a)}</button>`).join('')}</div><div class="grid-3 people-grid" style="margin-top:18px">${people.length?people.map(personCard).join(''):blank(t('No students found','لا يوجد طلاب'),t('Try another search or filter.','جرّب بحثًا أو فلترًا آخر.'))}</div>`

function requestCard(p){return `<article class="module-card profile-card" data-open-profile="${p.id}" tabindex="0"><div class="identity-line">${profileAvatar(p,true)}<div><h3>${esc(p.full_name||'Student')}</h3><p>@${esc(p.username||'student')}</p></div></div><p>${esc(p.grade||'')} · ${esc(p.branch||'')}</p><div class="profile-actions"><button class="primary" data-follow-request="accept" data-user="${p.id}">${t('Accept','قبول')}</button><button class="secondary danger" data-follow-request="reject" data-user="${p.id}">${t('Reject','رفض')}</button></div></article>`}

function conversationName(id){const other=state.conversationMembers.find(m=>same(m.conversation_id,id)&&!same(m.user_id,authUser.id));return other?.profile||profileData(other?.user_id)}
function conversationLast(id){return state.liveMessages.filter(m=>same(m.conversation_id,id)).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0]}

  return `<section class="messages ${active?'mobile-thread-open':''}"><aside class="thread-list"><div class="thread-head"><h2>${t('Messages','الرسائل')}</h2><button class="round-btn" data-new-chat aria-label="${t('New conversation','محادثة جديدة')}">+</button></div><input id="conversationSearch" class="thread-search" placeholder="${t('Search conversations…','ابحث في المحادثات…')}" value="${esc(state.conversationQuery)}"><div class="thread-list-scroll">${threads.length?threads.map(c=>{const p=conversationName(c.id),last=conversationLast(c.id),unread=conversationUnread(c.id);return `<button class="thread ${active&&same(c.id,active.id)?'active':''}" data-open-conversation="${c.id}">${profileAvatar(p)}<div><b>${esc(p?.full_name||'Student')}</b><small>${esc(last?.deleted_at?t('Message deleted','تم حذف الرسالة'):last?.body||t('Start the conversation','ابدأ المحادثة'))}</small></div>${unread?`<i class="count-badge unread">${unread}</i>`:`<time>${last?relative(last.created_at):''}</time>`}</button>`}).join(''):emptyState(t('No conversations yet','لا توجد محادثات بعد'),t('Start a conversation with any student.','ابدأ محادثة مع أي طالب.'))}</div></aside><div class="chat">${active?`<div class="chat-head"><button class="round-btn" data-mobile-threads aria-label="Back">←</button>${profileAvatar(activePerson)}<button class="author-link" data-open-profile="${activePerson?.id}"><span><b>${esc(activePerson?.full_name||'Student')}</b><small>@${esc(activePerson?.username||'student')}</small></span></button></div><div class="chat-flow" id="chatFlow">${msgs.length?msgs.map(messageBubble).join(''):emptyState(t('No messages yet','لا توجد رسائل بعد'),t('Send the first message.','أرسل أول رسالة.'))}</div><form class="chat-form" id="liveChatForm"><input id="liveChatInput" maxlength="4000" required placeholder="${t('Write a message…','اكتب رسالة…')}" autocomplete="off"><button aria-label="${t('Send','إرسال')}">→</button></form>`:`<div class="chat-empty">${emptyState(t('Choose a conversation', window.openNewConversation=function(){
  const people=state.members.filter(p=>!same(p.id,authUser.id));openModal(`<div class="modal-head"><div><h2>${t('New conversation','محادثة جديدة')}</h2><p>${t('Search and message a student directly. Following is not required.','ابحث عن طالب وراسله مباشرة دون اشتراط المتابعة.')}</p></div><button class="close" data-close>×</button></div><label class="field"><input id="newChatSearch" placeholder="${t('Search students…','ابحث عن الطلاب…')}"></label><div id="newChatPeople" class="result-list">${people.slice(0,20).map(newChatRow).join('')}</div>`);const input=$('#newChatSearch');input.oninput=()=>{const q=normalize(input.value);$('#newChatPeople').innerHTML=people.filter(p=>match(q,p.full_name,p.username,p.grade,p.branch)).slice(0,30).map(newChatRow).join('')||blank(t('No students found','لا يوجد طلاب'),t('Try another name.','جرّب اسمًا آخر.'));bindV6($('#modalRoot'))};bindV6($('#modalRoot'))
