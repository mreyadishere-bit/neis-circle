async function comments(id){const p=state.posts.find(x=>x.id===id);let replies=[];if(sb&&authUser){const {data}=await sb.from("comments").select("id,body,created_at,profiles!comments_author_id_fkey(full_name)").eq("post_id",id).order("created_at");replies=data||[]}openModal(`<div class="modal-head"><div><h2>Discussion</h2><p>${esc(p.title)}</p></div><button class="close" data-close>×</button></div><div class="feed">${replies.length?replies.map(r=>`<div class="person">${avatar({name:r.profiles?.full_name||"Student"})}<div><b>${esc(r.profiles?.full_name||"Student")}</b><small>${esc(r.body)}</small></div></div>`).join(""):`<div class="empty"><b>No replies yet</b><span>Start a useful discussion.</span></div>`}</div><form id="commentForm" class="chat-form" style="margin:18px 0 0"><input id="commentInput" required placeholder="Add a useful reply…"><button>→</button></form>`);$("#commentForm").onsubmit=async e=>{e.preventDefault();const body=$("#commentInput").value.trim();if(!body)return;if(sb){if(!requireAccount())return;const {error}=await sb.from("comments").insert({post_id:id,author_id:authUser.id,body});if(error){toast(error.message);return}await loadLiveData()}else{p.comments++;save()}closeModal();render();toast("Reply added")}}
function profile(){
  const p=state.profile;openModal(`<div class="modal-head"><div><h2>Your profile</h2><p>Control what other students can discover about you.</p></div><button class="close" data-close>×</button></div><form id="profileForm"><div class="row"><label class="field">Name<input id="pfName" value="${esc(p.name)}" required></label><label class="field">Username<input id="pfUser" value="${esc(p.username)}" required></label></div><div class="row"><label class="field">Grade<input id="pfGrade" value="${esc(p.grade)}"></label><label class="field">Campus<input id="pfCampus" value="${esc(p.campus)}"></label></div><label class="field">Bio<textarea id="pfBio" rows="4">${esc(p.bio)}</textarea></label><label class="field">Interests<input id="pfInterests" value="${esc(p.interests)}"></label><div class="modal-actions"><button type="button" class="secondary" data-close>Cancel</button><button class="primary">Save profile</button></div></form>`);$("#profileForm").onsubmit=e=>{e.preventDefault();state.profile={name:$("#pfName").value,username:$("#pfUser").value,grade:$("#pfGrade").value,campus:$("#pfCampus").value,bio:$("#pfBio").value,interests:$("#pfInterests").value};save();closeModal();render();toast("Profile updated")}}
function settings(){
  openModal(`<div class="modal-head"><div><h2>Settings</h2><p>Appearance, language, privacy and connection.</p></div><button class="close" data-close>×</button></div><div class="row"><button class="module-card" data-setting="theme"><b>Appearance</b><p>${state.theme==="light"?"Light":"Dark"} mode</p></button><button class="module-card" data-setting="lang"><b>Language</b><p>${state.lang==="en"?"English":"العربية"}</p></button></div><button class="module-card" style="width:100%;margin-top:12px;text-align:start" data-action="setup"><b>Online connection</b><p>${sb?"Connected to Supabase":"Demo mode — connect Supabase and Google"}</p></button><button class="secondary" style="margin-top:18px" data-action="reset">Reset local demo data</button>`);$("[data-setting=theme]").onclick=()=>{state.theme=state.theme==="light"?"dark":"light";applyPrefs();settings()};$("[data-setting=lang]").onclick=()=>{state.lang=state.lang==="en"?"ar":"en";applyPrefs();closeModal();render()};$("[data-action=reset]").onclick=()=>{["neis-posts-v2","neis-saved-v2","neis-liked-v2","neis-joined-v2","neis-follow-v2","neis-rsvp-v2","neis-threads-v2","neis-profile-v2"].forEach(k=>localStorage.removeItem(k));location.reload()};$("[data-action=setup]").onclick=setup}
const schemaSQL=`-- Run in Supabase SQL Editor
create table profiles (id uuid primary key references auth.users on delete cascade, full_name text, username text unique, grade text, campus text, bio text, interests text[], created_at timestamptz default now());
create table posts (id bigint generated by default as identity primary key, author_id uuid references profiles(id) on delete cascade, kind text not null, title text not null, body text not null, tags text[], created_at timestamptz default now());
create table comments (id bigint generated by default as identity primary key, post_id bigint references posts(id) on delete cascade, author_id uuid references profiles(id) on delete cascade, body text not null, created_at timestamptz default now());
create table messages (id bigint generated by default as identity primary key, sender_id uuid references profiles(id), receiver_id uuid references profiles(id), body text not null, created_at timestamptz default now());
alter table profiles enable row level security; alter table posts enable row level security; alter table comments enable row level security; alter table messages enable row level security;
create policy "members read profiles" on profiles for select to authenticated using (true);
create policy "users update own profile" on profiles for all to authenticated using (auth.uid()=id) with check (auth.uid()=id);
create policy "members read posts" on posts for select to authenticated using (true);
create policy "users create posts" on posts for insert to authenticated with check (auth.uid()=author_id);
create policy "authors manage posts" on posts for update to authenticated using (auth.uid()=author_id);
create policy "authors delete posts" on posts for delete to authenticated using (auth.uid()=author_id);
create policy "members read comments" on comments for select to authenticated using (true);
create policy "users create comments" on comments for insert to authenticated with check (auth.uid()=author_id);
create policy "private messages" on messages for select to authenticated using (auth.uid()=sender_id or auth.uid()=receiver_id);
create policy "send messages" on messages for insert to authenticated with check (auth.uid()=sender_id);`;
function setup(){
  openModal(`<div class="modal-head"><div><h2>Connect the live platform</h2><p>Public project values are safe here. Keep Google Client Secret only in Supabase.</p></div><button class="close" data-close>×</button></div><div class="row"><label class="field">Supabase project URL<input id="sbUrl" placeholder="https://xxxx.supabase.co" value="${esc(localStorage.getItem("neis-sb-url")||window.NEIS_CONFIG.supabaseUrl)}"></label><label class="field">Supabase anon key<input id="sbKey" placeholder="eyJhbGci…" value="${esc(localStorage.getItem("neis-sb-key")||window.NEIS_CONFIG.supabaseAnonKey)}"></label></div><label class="field">Allowed school email domain (optional)<input id="sbDomain" placeholder="students.neis.edu" value="${esc(localStorage.getItem("neis-domain")||window.NEIS_CONFIG.allowedEmailDomain)}"></label><div class="module-card" style="margin-top:14px"><b>1. Create the database tables and security rules</b><p>Open Supabase → SQL Editor → paste the prepared schema.</p><button class="secondary" type="button" id="copySql" style="margin-top:12px">Copy secure SQL schema</button></div><div class="module-card" style="margin-top:12px"><b>2. Enable Google</b><p>Supabase → Authentication → Providers → Google. Put the Client ID and Client Secret there, never in this file.</p><button class="secondary" type="button" id="googleAuth" style="margin-top:12px" ${sb?"":"disabled"}>Continue with Google</button></div><div class="modal-actions"><button class="secondary" type="button" data-close>Cancel</button><button class="primary" id="saveConnection">Save & test connection</button></div>`,true);
  $("#copySql").onclick=async()=>{await navigator.clipboard.writeText(schemaSQL);toast("SQL schema copied")};
  $("#googleAuth").onclick=googleSignIn;
  $("#saveConnection").onclick=async()=>{const u=$("#sbUrl").value.trim(),k=$("#sbKey").value.trim(),d=$("#sbDomain").value.trim();if(!u||!k){toast("Add the Supabase URL and anon key");return}localStorage.setItem("neis-sb-url",u);localStorage.setItem("neis-sb-key",k);localStorage.setItem("neis-domain",d);await initSupabase();closeModal();render();toast(sb?"Connected successfully":"Connection failed — check the values")};
}
function newCircle(){
  openModal(`<div class="modal-head"><div><h2>Request a new circle</h2><p>New spaces are reviewed before becoming visible.</p></div><button class="close" data-close>×</button></div><form id="circleForm"><label class="field">Circle name<input id="circleName" required placeholder="Example: Astronomy Club"></label><label class="field">Purpose<textarea id="circlePurpose" required rows="5" placeholder="What useful conversations will happen here?"></textarea></label><label class="field">Proposed rules<textarea id="circleRules" rows="3" placeholder="Be respectful, stay on topic…"></textarea></label><div class="modal-actions"><button type="button" class="secondary" data-close>Cancel</button><button class="primary">Submit request</button></div></form>`);
  $("#circleForm").onsubmit=e=>{e.preventDefault();closeModal();toast("Circle request submitted for review")}
}
async function initSupabase(){
  const u=localStorage.getItem("neis-sb-url")||window.NEIS_CONFIG.supabaseUrl,k=localStorage.getItem("neis-sb-key")||window.NEIS_CONFIG.supabaseAnonKey;
  if(!u||!k||!window.supabase)return false;
  try{sb=window.supabase.createClient(u,k);const {data,error}=await sb.auth.getSession();if(error)throw error;authUser=data.session?.user||null;$("#onlineDot").classList.add("live");$("#onlineDot").title=authUser?"Signed in and synced":"Database connected";sb.auth.onAuthStateChange(async(_event,session)=>{authUser=session?.user||null;if(authUser)await loadLiveData();render()});if(authUser)await loadLiveData();return true}catch(e){console.error(e);sb=null;authUser=null;return false}
}
async function loadLiveData(){
  if(!sb||!authUser)return;
  const [postRes,commentRes,reactionRes,bookmarkRes,profileRes]=await Promise.all([
    sb.from("posts").select("id,kind,title,body,tags,created_at,author_id,profiles!posts_author_id_fkey(full_name,grade,campus)").order("created_at",{ascending:false}),
    sb.from("comments").select("post_id"),sb.from("reactions").select("post_id,user_id"),sb.from("bookmarks").select("post_id,user_id").eq("user_id",authUser.id),
    sb.from("profiles").select("full_name,username,grade,campus,bio,interests").eq("id",authUser.id).maybeSingle()
  ]);
  if(postRes.error){console.error(postRes.error);return}
  const commentCount={},reactionCount={};(commentRes.data||[]).forEach(x=>commentCount[x.post_id]=(commentCount[x.post_id]||0)+1);(reactionRes.data||[]).forEach(x=>reactionCount[x.post_id]=(reactionCount[x.post_id]||0)+1);
  state.posts=(postRes.data||[]).map(p=>{const n=p.profiles?.full_name||"NEIS Student";return {id:p.id,user:n,initials:n.split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase(),color:"#006f5b",meta:[p.profiles?.grade,p.profiles?.campus].filter(Boolean).join(" · ")||"NEIS Circle",time:new Date(p.created_at).toLocaleDateString(),kind:p.kind,title:p.title,body:p.body,tags:p.tags||[],likes:reactionCount[p.id]||0,comments:commentCount[p.id]||0}});
  state.liked=(reactionRes.data||[]).filter(x=>x.user_id===authUser.id).map(x=>x.post_id);state.saved=(bookmarkRes.data||[]).map(x=>x.post_id);
  if(profileRes.data){const p=profileRes.data;state.profile={name:p.full_name||authUser.user_metadata?.full_name||"Student",username:p.username||"",grade:p.grade||"",campus:p.campus||"",bio:p.bio||"",interests:(p.interests||[]).join(", ")}}
  save();
  if(realtimeChannel)await sb.removeChannel(realtimeChannel);realtimeChannel=sb.channel("neis-live").on("postgres_changes",{event:"*",schema:"public",table:"posts"},async()=>{await loadLiveData();render()}).on("postgres_changes",{event:"*",schema:"public",table:"comments"},async()=>{await loadLiveData();render()}).subscribe();
}
async function googleSignIn(){
  if(!sb){setup();return}
  const {error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}});
  if(error)toast(error.message)
}
document.addEventListener("click",async e=>{
  const n=e.target.closest("[data-nav]");if(n){nav(n.dataset.nav);return}
  const a=e.target.closest("[data-action]");if(a){const x=a.dataset.action;
    if(x==="compose")compose(); if(x==="theme"){state.theme=state.theme==="light"?"dark":"light";applyPrefs()}
    if(x==="language"){state.lang=state.lang==="en"?"ar":"en";applyPrefs();render()} if(x==="profile")profile(); if(x==="settings")settings();
    if(x==="notifications")openModal(`<div class="modal-head"><div><h2>Notifications</h2><p>You are all caught up.</p></div><button class="close" data-close>×</button></div><div class="event"><span class="date">NEW</span><div><b>Your answer was marked helpful</b><small>Physics Lab · 18 minutes ago</small></div></div><div class="event"><span class="date">3</span><div><b>New messages in Robotics Group</b><small>One hour ago</small></div></div>`);
    if(x==="setup")setup(); if(x==="login")googleSignIn(); if(x==="new-circle")newCircle(); if(x==="new-opportunity")compose("Resource"); if(x==="new-message"){closeModal();nav("discover");toast("Choose a student to start a conversation")}
    if(x==="like"||x==="save"||x==="comments"||x==="share"){const id=+a.dataset.id;if(x==="comments"){comments(id);return}if(x==="share"){await navigator.clipboard.writeText(location.href+`#post-${id}`);toast("Link copied");return}if(sb&&!requireAccount())return;try{if(x==="like"){const on=!state.liked.includes(id);await liveToggle("reactions",id,on);state.liked=on?[...state.liked,id]:state.liked.filter(y=>y!==id)}if(x==="save"){const on=!state.saved.includes(id);await liveToggle("bookmarks",id,on);state.saved=on?[...state.saved,id]:state.saved.filter(y=>y!==id)}save();render()}catch(err){toast(err.message||"Could not sync this action")}}
    return
  }
  if(e.target.closest("[data-close]"))closeModal()
});
$("#globalSearch").addEventListener("input",e=>{state.query=e.target.value;state.view=state.view==="messages"?"discover":state.view;render()});
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#globalSearch").focus()}if(e.key==="Escape")closeModal()});
applyPrefs();initSupabase().finally(render);
</script>
</body>
</html>
